<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Same-origin only. img-src includes 'self' so icon-192.png (favicon and manifest) can load. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Elzee</title>
<meta name="description" content="Bite-size puzzles that build reasoning skills for kids.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Elzee">
<meta name="theme-color" content="#7c4dff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="app-version" content="1.2.3">
<style>
/* Fredoka (SIL Open Font License, see OFL-Fredoka.txt), self-hosted so the app never waits on a third-party server */
@font-face{font-family:"Fredoka";font-style:normal;font-weight:300 700;font-display:swap;src:url("fredoka-latin.woff2") format("woff2")}
:root{
  --bg:#fff8e7; --ink:#2d2a4a; --muted:#7a7699; --card:#ffffff; --line:#e7e2f5;
  --brand:#7c4dff; --brand-d:#5a2fd6;
  --good:#3ccf4e; --good-d:#2a9d38; --good-l:#e6fbe9;
  --oops:#ff9f43; --oops-d:#e07b15; --oops-l:#fff3e3;
  --gold:#ffc83d; --gold-d:#e0a400; --fire:#ff6b3d;
  --radius:22px;
  --font:"Fredoka","Chalkboard SE","Comic Sans MS","Arial Rounded MT Bold",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:20px;line-height:1.35;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
input,select{font:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:700}
#app{max-width:860px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 40px) calc(env(safe-area-inset-left) + 18px)}

/* ---------- buttons ---------- */
.btn{border:none;border-radius:18px;padding:14px 26px;min-height:62px;font-size:23px;font-weight:600;
  background:var(--good);color:#fff;box-shadow:0 5px 0 var(--good-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--good-d)}
.btn.block{display:block;width:100%}
.btn.brand{background:var(--brand);box-shadow:0 5px 0 var(--brand-d)}
.btn.oops{background:var(--oops);box-shadow:0 5px 0 var(--oops-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.danger{background:#ff5d6c;box-shadow:0 5px 0 #d23c4b}
.btn.small{min-height:48px;padding:8px 16px;font-size:18px;border-radius:14px}
.btn[disabled]{background:#d9d6e6;box-shadow:0 5px 0 #bdb9cf;color:#fff}
.iconbtn{border:none;background:#fff;border-radius:18px;width:60px;height:60px;font-size:30px;
  box-shadow:0 4px 0 var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.linkbtn{background:none;border:none;color:var(--brand);font-weight:600;font-size:18px;padding:10px;text-decoration:underline}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:sticky;top:0;z-index:5;
  padding:8px 0;background:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:8px 16px;
  font-size:24px;font-weight:700;box-shadow:0 4px 0 var(--line);min-height:52px}
.pill.fire b{color:var(--fire)} .pill.fire.off{filter:grayscale(1);opacity:.6}
.pill.tok b{color:var(--gold-d)}
.who{display:inline-flex;align-items:center;gap:8px;background:#fff;border:none;border-radius:999px;padding:4px 16px 4px 6px;
  box-shadow:0 4px 0 var(--line);min-height:56px;font-size:20px;font-weight:600;max-width:220px}
.who .av{font-size:34px}
.who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}

/* ---------- profile picker ---------- */
.title{text-align:center;margin:18px 0 6px;font-size:40px}
.subtitle{text-align:center;color:var(--muted);margin:0 0 26px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.playercard{background:#fff;border:none;border-radius:var(--radius);padding:22px 12px;box-shadow:0 6px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;gap:6px;min-height:200px;justify-content:center}
.playercard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.playercard .av{font-size:80px;line-height:1}
.playercard .nm{font-size:26px;font-weight:700;max-width:100%;overflow-wrap:anywhere;line-height:1.15}
.playercard .meta{font-size:17px;color:var(--muted)}
.playercard.add{border:3px dashed #cfc8ea;box-shadow:none;background:transparent;color:var(--brand)}
.form{background:#fff;border-radius:var(--radius);padding:24px;box-shadow:0 6px 0 var(--line)}
.form label{display:block;font-weight:600;margin:16px 0 8px}
.text{width:100%;font-size:26px;padding:14px 18px;border-radius:16px;border:3px solid var(--line);outline:none;background:#fff;color:var(--ink)}
.text:focus{border-color:var(--brand)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.avopt{font-size:44px;height:76px;border-radius:18px;border:3px solid var(--line);background:#fff}
.avopt.on{border-color:var(--brand);background:#efe9ff}
.pathopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pathopt{border:3px solid var(--line);background:#fff;border-radius:18px;padding:14px;text-align:left;min-height:84px}
.pathopt.on{border-color:var(--brand);background:#efe9ff}
.pathopt b{display:block;font-size:22px}
.pathopt small{color:var(--muted);font-size:16px}

/* ---------- home / map ---------- */
.hello{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.mascot{font-size:64px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.bubble{overflow-wrap:anywhere;background:#fff;border-radius:20px;padding:12px 18px;box-shadow:0 4px 0 var(--line);font-size:21px;position:relative}
.tabs{display:flex;gap:10px;margin:0 0 16px}
.tab{flex:1;border:3px solid var(--line);background:#fff;border-radius:18px;min-height:58px;font-size:20px;font-weight:600}
.tab.on{border-color:var(--brand);background:var(--brand);color:#fff}
.track{background:var(--cl);border-radius:28px;padding:16px 16px 22px;margin-bottom:20px}
.trackhead{display:flex;align-items:center;gap:12px;background:var(--c);color:#fff;border-radius:20px;padding:12px 16px;box-shadow:0 5px 0 var(--cd)}
.trackhead .te{font-size:42px}
.trackhead h2{font-size:26px}
.trackhead p{margin:2px 0 0;font-size:17px;opacity:.95}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:20px}
.stop{display:flex;flex-direction:column;align-items:center;position:relative;background:none;border:none;padding:8px 22px;
  min-width:170px;border-radius:24px;font:inherit;color:inherit}
.stop .node{display:flex;align-items:center;justify-content:center}
.stop:active .node{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.stop:active .node.done{box-shadow:0 2px 0 var(--gold-d)} .stop:active .node.locked{box-shadow:0 2px 0 #bdb9cf}
.stop:active .node::after,.stop:hover .node::after,.stop.touched .node::after{animation-play-state:paused;opacity:0}
.node{position:relative;width:104px;height:104px;border-radius:50%;border:none;font-size:40px;font-weight:700;color:#fff;
  background:var(--c);box-shadow:0 7px 0 var(--cd)}
.node::before{content:"";position:absolute;inset:-18px;border-radius:50%} /* invisible, enlarges the tap target */
.node.next::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:5px solid var(--c);opacity:.5;
  animation:ring 1.6s ease-out infinite;pointer-events:none}
@keyframes ring{0%{transform:scale(.92);opacity:.6}100%{transform:scale(1.18);opacity:0}}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d)}
.node.locked{background:#d9d6e6;box-shadow:0 7px 0 #bdb9cf;font-size:32px}

.nlabel{font-weight:600;font-size:18px;margin-top:10px}
.stars{display:block}
.nostar{filter:grayscale(1);opacity:.35}
.stars{font-size:18px;letter-spacing:2px;min-height:22px}
.startTag{pointer-events:none;position:absolute;top:-12px;right:-46px;background:#fff;color:var(--c);font-weight:700;font-size:15px;
  padding:4px 10px;border-radius:10px;box-shadow:0 3px 0 var(--line)}

/* ---------- lesson ---------- */
.lhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.bar{flex:1;height:22px;background:#e9e5f5;border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:var(--good);border-radius:999px;transition:width .4s;
  background-image:linear-gradient(rgba(255,255,255,.35) 0 40%,transparent 40%)}
.lbody{display:grid;gap:18px}
.qcard{background:#fff;border-radius:var(--radius);padding:20px 22px;box-shadow:0 6px 0 var(--line);position:relative}
.qtag{display:inline-block;font-size:16px;font-weight:600;color:#fff;background:var(--c);padding:4px 12px;border-radius:999px;margin-bottom:10px}
.qtag.again{background:var(--oops)}
.pic{font-size:52px;text-align:center;margin:6px 0 10px;letter-spacing:4px;line-height:1.2}
.qtext{font-size:25px;line-height:1.4}
.ask{font-size:26px;font-weight:700;margin-top:14px;color:var(--cd)}
.speak{position:absolute;top:14px;right:14px;width:56px;height:56px;font-size:28px}
.qcard.hasSpeak .qtext{padding-right:52px}
.choices{display:grid;gap:12px;align-content:start}
.showrow{display:flex;justify-content:center;margin-top:2px}
.showrow .btn{min-height:54px;padding:10px 22px;font-size:20px}
.choice{display:block;width:100%;text-align:left;font-size:23px;line-height:1.3;padding:16px 20px;min-height:68px;
  border:3px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 5px 0 var(--line)}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.choice.correct{border-color:var(--good);background:var(--good-l);box-shadow:0 5px 0 var(--good)}
.choice.wrong{border-color:var(--oops);background:var(--oops-l);box-shadow:0 5px 0 var(--oops);animation:wiggle .35s}
.choice.dim{opacity:.45}
@keyframes wiggle{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sheetpad{height:0;transition:height .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(110%);transition:transform .28s ease-out;
  padding:18px calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 20px)}
.sheet.show{transform:none}
.sheet.good{background:var(--good-l);border-top:4px solid var(--good)}
.sheet.oops{background:var(--oops-l);border-top:4px solid var(--oops)}
.sheet .inner{max-width:860px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:14px 18px;align-items:center}
.sheet h3{font-size:28px}
.sheet.good h3{color:var(--good-d)} .sheet.oops h3{color:var(--oops-d)}
.sheet p{margin:4px 0 0;font-size:21px}
.sheet .row{display:flex;gap:10px;align-items:center}
@media (max-width:640px){
  .sheet .inner{grid-template-columns:1fr}
  .sheet h3{font-size:22px} .sheet p{font-size:18px}
  .sheet .row .btn{flex:1}
  .qtext{font-size:22px} .ask{font-size:23px} .choice{font-size:20px;min-height:58px;padding:12px 16px}
}
@media (orientation:landscape) and (min-width:1000px){
  .lbody{grid-template-columns:1.05fr 1fr;align-items:start}
  #app.wide{max-width:1120px}
}

/* ---------- results ---------- */
.result{text-align:center;padding-top:20px}
.bigicon{font-size:110px;line-height:1;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
.bigstars{font-size:64px;margin:10px 0;letter-spacing:6px}
.bigstars span{display:inline-block;animation:pop .5s backwards}
.tally{background:#fff;border-radius:var(--radius);box-shadow:0 6px 0 var(--line);padding:10px 22px;margin:18px auto;max-width:520px;text-align:left}
.tally div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:2px dashed var(--line);font-size:21px}
.tally div:last-child{border:none;font-weight:700;font-size:25px}
.tally b{color:var(--gold-d)}

/* ---------- shop ---------- */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:16px;margin:16px 0;min-width:0}
.prize{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;min-width:0}
.prize .pe{font-size:62px;line-height:1.1}
.prize .pn{font-size:22px;font-weight:600;flex:1;overflow-wrap:anywhere;max-width:100%}
.prize .pc{font-size:24px;font-weight:700;color:var(--gold-d)}
.prize .need{font-size:16px;color:var(--muted)}
.card{background:#fff;border-radius:var(--radius);padding:18px 20px;box-shadow:0 6px 0 var(--line);margin:16px 0}
.card h3{font-size:24px;margin-bottom:10px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:2px dashed var(--line);font-size:19px}
.list li span:first-child{overflow-wrap:anywhere;min-width:0}
.list li:last-child{border:none}
.muted{color:var(--muted)}

/* ---------- parent ---------- */
.prow{display:grid;grid-template-columns:minmax(56px,76px) minmax(0,1fr) minmax(78px,110px) 60px;gap:10px;align-items:center;margin:10px 0;min-width:0}
.prow .text{font-size:20px;padding:10px 12px;min-width:0;width:100%}
.prizescroll{max-height:min(52vh,560px);overflow:auto;-webkit-overflow-scrolling:touch}
.prow .emo{text-align:center;font-size:28px}
.plrow{border:2px solid var(--line);border-radius:18px;padding:12px;margin:12px 0}
.plrow .line{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0}
.plrow select,.prow select{font-size:20px;padding:10px;border-radius:14px;border:3px solid var(--line);background:#fff}
.toggle{display:flex;align-items:center;gap:10px;font-size:19px}
.toggle input{width:28px;height:28px}

/* ---------- modal / pin pad ---------- */
.overlay{position:fixed;inset:0;background:rgba(45,42,74,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:28px;padding:24px;max-width:460px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.15);animation:pop .3s}
.modal h3{font-size:28px;margin-bottom:6px}
.modal p{margin:6px 0 14px;font-size:20px}
.modal .acts{display:grid;gap:12px;margin-top:16px}
.dots{display:flex;justify-content:center;gap:14px;margin:14px 0 6px}
.dots i{width:22px;height:22px;border-radius:50%;border:3px solid var(--brand);display:block}
.dots i.on{background:var(--brand)}
.err{color:#e0424f;min-height:26px;font-size:18px;font-weight:600}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.key{height:70px;border-radius:18px;border:none;background:#f1eefb;font-size:30px;font-weight:700;box-shadow:0 4px 0 var(--line)}
.key.cancel{font-size:19px;color:var(--muted)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.shake{animation:wiggle .35s}

/* ---------- effects ---------- */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:14px 22px;border-radius:16px;font-size:20px;z-index:60;animation:fade .2s;max-width:90vw;text-align:center}
.float{position:fixed;z-index:40;font-size:30px;font-weight:700;color:var(--gold-d);pointer-events:none;animation:floatUp 1.1s ease-out forwards;text-shadow:0 2px 0 #fff}
@keyframes floatUp{to{transform:translateY(-90px);opacity:0}}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:70;pointer-events:none;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ==========================================================================
   CONTENT — all puzzles are original. Convention: c[0] is ALWAYS the correct
   answer in the source data; choices are shuffled at display time.
   Fields: pic (optional emoji picture), q (story), ask (question), c (choices),
   why (short explanation shown after answering).
   ========================================================================== */
const PATHS = [
{
  id: "little", title: "Little Thinkers", ages: "Ages 5–6", emoji: "🐣",
  readAloudDefault: true,
  tracks: [
  { id: "order", title: "Line Up!", emoji: "🚂", color: "#7c4dff", dark: "#5a2fd6", light: "#efe9ff",
    blurb: "Who goes first? Use the clues!",
    levels: [
    { name: "Easy Lines", qs: [
      { pic: "🐱 ❔ 🐶", q: "Cat, Dog, and Frog stand in a line. Cat is first. Dog is last.", ask: "Who is in the middle?",
        c: ["🐸 Frog", "🐱 Cat", "🐶 Dog"], why: "Cat and Dog are on the ends, so Frog gets the middle!" },
      { pic: "🍎 🍌 🍇", q: "Apple is before Banana. Banana is before Grapes.", ask: "Which fruit is last?",
        c: ["🍇 Grapes", "🍎 Apple", "🍌 Banana"], why: "Apple, then Banana, then Grapes. Grapes is last!" },
      { pic: "🐻 🐭 🐜", q: "Bear is bigger than Mouse. Mouse is bigger than Ant.", ask: "Who is the smallest?",
        c: ["🐜 Ant", "🐻 Bear", "🐭 Mouse"], why: "Bear is biggest, then Mouse, then Ant. Ant is the smallest!" },
      { pic: "🚗 🚗 🚗", q: "Three cars are in a race. The red car is NOT first. The red car is NOT last.", ask: "Where is the red car?",
        c: ["In the middle", "First", "Last"], why: "If it's not first and not last, the only spot left is the middle!" },
      { pic: "🧒 🧒 🧒", q: "Ben is taller than Sue. Sue is taller than Kim.", ask: "Who is the tallest?",
        c: ["Ben", "Sue", "Kim"], why: "Ben is taller than Sue, and Sue is taller than Kim. So Ben is the tallest!" }
    ]},
    { name: "Bench Buddies", qs: [
      { pic: "🦆 🐥 🦆 🦆", q: "Ducks swim in a row. Big Duck is first. Baby Duck is right behind Big Duck.", ask: "Who is second?",
        c: ["🐥 Baby Duck", "🦆 Big Duck", "🦢 Swan"], why: "Right behind first is second. That's Baby Duck!" },
      { pic: "🪑 🪑 🪑", q: "Sam, Pam, and Tam sit on a bench. Pam sits in the middle. Sam sits on the left.", ask: "Where does Tam sit?",
        c: ["On the right", "On the left", "In the middle"], why: "Sam has the left and Pam has the middle. Tam gets the right!" },
      { pic: "📘 📗 📕", q: "Three books are in a stack. The blue book is on top. The red book is on the bottom.", ask: "Where is the green book?",
        c: ["In the middle", "On top", "On the bottom"], why: "Top and bottom are taken, so the green book is in the middle!" },
      { pic: "🎈 🎉 🎂", q: "Lily got to the party before Max. Max got there before Zoe.", ask: "Who got there first?",
        c: ["Lily", "Max", "Zoe"], why: "Lily came before Max, and Max came before Zoe. Lily was first!" },
      { pic: "🦘 🐰 🐸", q: "Frog jumps after Bunny. Bunny jumps after Kangaroo.", ask: "Who jumps first?",
        c: ["🦘 Kangaroo", "🐰 Bunny", "🐸 Frog"], why: "Kangaroo, then Bunny, then Frog. Kangaroo jumps first!" }
    ]},
    { name: "Line Leader", qs: [
      { pic: "🧒 ❔ ❔ 🧒", q: "Al, Bea, Cy, and Di stand in line. Al is first. Di is last. Bea is NOT second.", ask: "Who is second?",
        c: ["Cy", "Bea", "Al", "Di"], why: "Al and Di are on the ends. Bea can't be second, so Cy is second!" },
      { pic: "👩 👧 👶", q: "Mom is older than Jen. Jen is older than Baby Tim.", ask: "Who is the youngest?",
        c: ["👶 Baby Tim", "👧 Jen", "👩 Mom"], why: "Mom is oldest, then Jen, then Baby Tim. Tim is youngest!" },
      { pic: "🚂 🚂 🚂", q: "Three trains wait in a line: a red train, a blue train, and a yellow train. The yellow train is behind the red train. The blue train is in front of the red train.", ask: "Which train is at the front of the line?",

      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;

      const t1 = (h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;

      <button class="key" data-k="back" aria-label="Delete">⌫</button></div>

  };

/** First PIN on this device: the harder grown-up math check must pass before createPin. Kids still launch straight into play. */
function startGrownUpSetup(onDone) {
  grownUpCheck("A grown-up needs to do this", () => createPin(onDone));
}

function requireGrownUp(reason, onOk) {
  const st = state();
  if (!hasPin()) { startGrownUpSetup(onOk); return; } // math check first, then make the PIN; the prize or settings open only after that
  if (st.pinLockUntil > Date.now()) { toast(`Too many tries. Please wait ${waitText(st.pinLockUntil)}.`, 2600); return; }
  pinPad({ title: "Grown-up check 🔒", msg: reason, forgot: true, onSubmit(v, a) {
    if (checkPin(v)) { st.pinFails = 0; st.pinLockUntil = 0; Store.save(); a.close(); onOk(); return; }
    st.pinFails += 1;
    if (st.pinFails >= GATE.pinTriesBeforeLock) {
      st.pinLockUntil = Date.now() + Math.min(GATE.lockMaxMs, GATE.lockBaseMs * 2 ** (st.pinFails - GATE.pinTriesBeforeLock));
      Store.save(); a.close(); toast(`Too many tries. Please wait ${waitText(st.pinLockUntil)}.`, 2600); return;
    }
    Store.save(); a.error(`Hmm, that's not the PIN. ${GATE.pinTriesBeforeLock - st.pinFails} more ${GATE.pinTriesBeforeLock - st.pinFails === 1 ? "try" : "tries"}.`);
  }});
}

  closeModal();
  grownUpCheck("Reset the parent PIN", () => createPin(() => toast("New PIN saved! Now try again.", 2600)));
}

const NEEDS_PLAYER = ["home", "lesson", "results", "shop"];
function render() {
  Speech.stop();
  if (NEEDS_PLAYER.includes(view.name) && !player()) view = { name: "picker" };
  if (view.name === "lesson" && !lesson) view = { name: player() ? "home" : "picker" };
  if (view.name === "results" && !view.result) view = { name: "home" };
  $app.classList.toggle("wide", view.name === "lesson");

     results: renderResults, shop: renderShop, parent: renderParent })[view.name]();

let lastNavAt = 0; // used to swallow stray double-taps that land on the next screen
let histBooted = false;
function historySnapshot() {
  const snap = { elzee: 1, name: view.name };
  if (view.result) snap.result = view.result;
  if (view.pathId) snap.pathId = view.pathId;
  if (view.form) snap.form = { name: view.form.name, avatar: view.form.avatar, pathId: view.form.pathId };
  return snap;
}
function recordHistory(replace) {
  const url = location.pathname + location.search;
  try {
    if (!histBooted) {
      // A base entry under the current screen traps Safari swipe-back so it can't fall through to about:blank.
      history.replaceState({ elzee: "base" }, "", url);
      history.pushState(historySnapshot(), "", url);
      histBooted = true;
      return;
    }
    if (replace) history.replaceState(historySnapshot(), "", url);
    else history.pushState(historySnapshot(), "", url);
  } catch (e) { /* private mode */ }
}
function go(name, extra = {}, opts = {}) {
  lastNavAt = Date.now();
  document.querySelectorAll(".confetti, .float").forEach(el => el.remove());
  const sameScreen = histBooted && view.name === name;
  view = { name, ...extra };
  render();
  window.scrollTo(0, 0);
  if (!opts.fromPop) recordHistory(!!opts.replace || sameScreen);
  if (view.name !== "lesson") checkForUpdate();
}
function onPopState() {
  const s = history.state;
  if (!s || s.elzee !== 1) {
    try { history.pushState(historySnapshot(), "", location.pathname + location.search); } catch (e) {}
    return;
  }
  if (s.name === "parent") {
    // Forwarding back into grown-up settings must not skip the PIN.
    go(player() ? "home" : "picker", {}, { replace: true });
    return;
  }
  const extra = {};
  if (s.result) extra.result = s.result;
  if (s.pathId) extra.pathId = s.pathId;
  if (s.form) extra.form = s.form;
  go(s.name || "picker", extra, { fromPop: true });
  if (view.name !== s.name) recordHistory(true);
}

/* ---------- Lesson ---------- */
const LessonSave = {
  key: APP.storageKey + ".lesson",
  maxAgeMs: 12 * 3600000,
  save() {
    if (!lesson) return this.clear();
    try {
      localStorage.setItem(this.key, JSON.stringify({ ...lesson, mastered: [...lesson.mastered], missed: [...lesson.missed],
        profileId: state().activeId, savedAt: Date.now() }));
    } catch (e) { /* ignore */ }
  },
  clear() { try { localStorage.removeItem(this.key); } catch (e) {} },
  /** Returns a validated lesson object or null. */
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.key)); } catch (e) { d = null; }
    if (!d || typeof d !== "object") return null;
    const path = PATHS.find(x => x.id === d.pathId), track = path && path.tracks[d.ti], level = track && track.levels[d.li];
    const n = level ? level.qs.length : 0, okIdx = i => Number.isInteger(i) && i >= 0 && i < n;
    const valid = level && state().profiles.some(p => p.id === d.profileId) && Array.isArray(d.queue) && d.queue.every(okIdx)
      && Array.isArray(d.mastered) && d.mastered.every(okIdx) && Array.isArray(d.missed) && d.missed.every(okIdx)
      && (d.cur === null || okIdx(d.cur)) && typeof d.savedAt === "number" && Date.now() - d.savedAt < this.maxAgeMs;
    if (!valid) { this.clear(); return null; }
    if (d.cur === null && !d.queue.length) return (this.clear(), null);
    const nChoices = d.cur !== null ? level.qs[d.cur].c.length : 0;
    const order = Array.isArray(d.order) && d.order.length === nChoices && [...d.order].sort().every((v, i) => v === i) ? d.order : null;
    const revealed = !!(d.feedback && d.feedback.revealed);
    const pickedOk = d.feedback && Number.isInteger(d.feedback.picked) && d.feedback.picked >= 0 && d.feedback.picked < nChoices;
    const fb = d.feedback && typeof d.feedback === "object" && (revealed || pickedOk)
      ? { picked: revealed ? null : d.feedback.picked, ok: !revealed && d.feedback.picked === 0, gained: Math.max(0, d.feedback.gained | 0),
          comboNote: String(d.feedback.comboNote || ""), revealed, text: typeof d.feedback.text === "string" ? d.feedback.text.slice(0, 700) : "" } : null;
    const showMeLeft = Number.isInteger(d.showMeLeft) ? Math.min(SHOW_ME_MAX, Math.max(0, d.showMeLeft)) : SHOW_ME_MAX;
    return { profileId: d.profileId, lesson: { pathId: d.pathId, ti: d.ti, li: d.li, replay: !!d.replay, total: n, queue: d.queue.slice(),
      mastered: new Set(d.mastered), missed: new Set(d.missed), mistakes: Math.max(0, d.mistakes | 0), earned: Math.max(0, d.earned | 0),
      combo: Math.max(0, d.combo | 0), showMeLeft, cur: d.cur, order: order || (d.cur !== null ? shuffle(level.qs[d.cur].c.map((_, i) => i)) : null),
      answered: !!(d.answered && fb && order), feedback: d.answered && fb && order ? fb : null } };
  },
};
function startLesson(pathId, ti, li) {
  const level = getPath(pathId).tracks[ti].levels[li];
  const replay = !!progOf(player(), pathId, ti, li).done;
  lesson = { pathId, ti, li, replay, total: level.qs.length, queue: level.qs.map((_, i) => i), mastered: new Set(),
             missed: new Set(), mistakes: 0, earned: 0, combo: 0, showMeLeft: SHOW_ME_MAX, cur: null, order: null, answered: false };
  nextQuestion();
}
const lessonTrack = () => getPath(lesson.pathId).tracks[lesson.ti];
const lessonQ = () => lessonTrack().levels[lesson.li].qs[lesson.cur];
function questionSpeech(q) { return `${q.q} ${q.ask} ${lesson.order.map(i => q.c[i]).join("? Or, ")}?`; }

function nextQuestion() {
  if (!lesson.queue.length) return finishLesson();
  lesson.cur = lesson.queue.shift();
  lesson.order = shuffle(lessonTrack().levels[lesson.li].qs[lesson.cur].c.map((_, i) => i));
  lesson.answered = false; lesson.feedback = null;
  LessonSave.save();
  go("lesson");
  if (player().readAloud) Speech.say(questionSpeech(lessonQ()));
}
function renderQuestion() {
  const t = lessonTrack(), q = lessonQ(), pl = player();
  const again = lesson.missed.has(lesson.cur);
  $app.innerHTML = `<div style="--c:${t.color};--cd:${t.dark}">

        ${q.pic ? `<div class="pic" aria-hidden="true">${q.pic}</div>` : ""}

/** Kid-friendly why. Uses the question's own why when we have one, and always names the right answer on a miss or a reveal. */
function explain(q, { picked, ok, revealed } = {}) {
  const choices = q && Array.isArray(q.c) ? q.c : [];
  const right = choices[0] != null ? choices[0] : "the green answer";
  const why = (q && typeof q.why === "string" && q.why.trim())
    ? q.why.trim()
    : "The clues in the story fit this answer, and not the other ones.";
  if (ok && !revealed) return why;
  if (revealed || picked == null || choices[picked] == null) return `The answer is ${right}. ${why}`;
  return `${choices[picked]} doesn't fit this time. The right answer is ${right}. ${why}`;
}
function answer(btn) {
  if (lesson.answered) return;
  lesson.answered = true;
  const pl = player(), q = lessonQ(), picked = Number(btn.dataset.i), ok = picked === 0;
  let gained = 0, comboNote = "";
  if (ok) {
    const first = !lesson.missed.has(lesson.cur);
    lesson.combo = first ? lesson.combo + 1 : 0;
    if (!lesson.replay) { // per-question tokens only the first time through a lesson; paid out when the lesson is finished
      gained = first ? REWARDS.firstTry : REWARDS.retry;
      if (first && lesson.combo % REWARDS.comboEvery === 0) { gained += REWARDS.comboBonus; comboNote = ` · ${lesson.combo} in a row! 🔥`; }
    } else if (first && lesson.combo % REWARDS.comboEvery === 0) comboNote = ` · ${lesson.combo} in a row! 🔥`;
    lesson.mastered.add(lesson.cur); lesson.earned += gained;
    Sound.good(); if (gained) floatText(btn, `+${gained} 🪙`);
  } else {
    lesson.mistakes++; lesson.combo = 0; lesson.missed.add(lesson.cur); lesson.queue.push(lesson.cur); Sound.oops();
  }
  lesson.feedback = { picked, ok, gained, comboNote, revealed: false, text: explain(q, { picked, ok }) };
  LessonSave.save(); // save the scored answer before anything else can happen
  showFeedback(lesson.feedback);
  if (pl.readAloud) Speech.say((ok ? "Correct! " : "") + lesson.feedback.text);
}
/** Reveal the answer. No tokens for this question. Counts as a mistake unless it was already missed. The lesson can still be finished. */
function showMe() {
  if (!lesson || lesson.answered || lesson.showMeLeft <= 0) return;
  const q = lessonQ();
  lesson.answered = true;
  lesson.showMeLeft--;
  if (!lesson.missed.has(lesson.cur)) lesson.mistakes++;
  lesson.combo = 0;
  lesson.mastered.add(lesson.cur);
  lesson.missed.add(lesson.cur);
  lesson.feedback = { picked: null, ok: false, gained: 0, comboNote: "", revealed: true, text: explain(q, { revealed: true }) };
  LessonSave.save();
  showFeedback(lesson.feedback);
  Sound.tap();
  if (player().readAloud) Speech.say(lesson.feedback.text);
}
/** Draws the answered state + feedback sheet. Pure display: safe to call again after a reload. */
function showFeedback(fb) {
  const { picked, ok, gained, comboNote, revealed } = fb;
  const q = lessonQ();
  const text = fb.text || explain(q, { picked, ok, revealed });
  document.querySelectorAll(".choice").forEach(b => {
    const i = Number(b.dataset.i); b.disabled = true;
    if (revealed) b.classList.add(i === 0 ? "correct" : "dim");
    else b.classList.add(i === 0 ? "correct" : i === picked ? "wrong" : "dim");
  });
  const showBtn = document.querySelector('[data-act="showMe"]');
  if (showBtn) {
    showBtn.disabled = true;
    showBtn.setAttribute("aria-disabled", "true");
    showBtn.textContent = `Show me · ${lesson.showMeLeft} left`;
  }
  document.querySelectorAll("[data-pot]").forEach(el => el.textContent = "+" + lesson.earned);
  document.querySelector(".bar .fill").style.width = (lesson.mastered.size / lesson.total * 100) + "%";
  const sheet = document.getElementById("sheet");
  sheet.className = "sheet " + (ok ? "good" : "oops");
  const title = revealed ? "Here's the answer!" : ok ? "🎉 " + pickOne(PRAISE) : "💛 " + pickOne(GENTLE);
  const note = revealed ? "This one doesn't add tokens. You can keep going!"
    : ok ? `${lesson.replay ? "Practice round 💪" : `+${gained} tokens`}${comboNote}`
    : "We'll try this one again in a bit 👍";
  sheet.innerHTML = `<div class="inner">
      <div><h3>${esc(title)}</h3>
        <p>${esc(text)}</p><p class="muted">${esc(note)}</p></div>
      <div class="row">${Speech.supported ? `<button class="iconbtn" data-act="speakWhy" aria-label="Read aloud">🔊</button>` : ""}
        <button class="btn ${ok ? "" : "oops"}" data-act="continue">Continue</button></div></div>`;
  requestAnimationFrame(() => {
    sheet.classList.add("show");

  });
}
/** If the feedback sheet would cover the right answer, scroll just enough to show it, never past the question card. */
function keepAnswerVisible(sheet) {
  const target = document.querySelector(".choice.correct"), card = document.querySelector(".qcard");
  if (!target || !card) return;
  const sheetTop = window.innerHeight - sheet.offsetHeight;
  const hiddenBy = target.getBoundingClientRect().bottom - (sheetTop - 12);
  if (hiddenBy <= 0) return;
  const maxScroll = Math.max(0, card.getBoundingClientRect().top - 8); // keep the top of the question on screen
  window.scrollBy({ top: Math.min(hiddenBy, maxScroll || hiddenBy) });
}
function finishLesson() {
  LessonSave.clear();
  const pl = player(), key = progKey(lesson.pathId, lesson.ti, lesson.li);
  const prev = pl.progress[key] || {};
  const stars = lesson.mistakes === 0 ? 3 : lesson.mistakes <= 2 ? 2 : 1;
  const today = todayStr();
  const lines = [];
  if (!prev.done) {
    lines.push(["Correct answers", lesson.earned], ["Finished a new lesson!", REWARDS.lessonFirstClear]);
  } else {
    if (pl.replayDay !== today) { pl.replayDay = today; pl.replayCount = 0; }
    const paid = pl.replayCount < REWARDS.replaysPaidPerDay;
    pl.replayCount += 1;
    lines.push([paid ? "Practice replay" : "Practice replay (daily bonus used up)", paid ? REWARDS.lessonReplay : 0]);
  }
  if (stars === 3 && (prev.stars || 0) < 3) lines.push([prev.done ? "New best: 3 stars!" : "Perfect lesson!", REWARDS.perfect]);
  // daily streak
  let streakBonus = 0;
  if (pl.lastPlay !== today) {
    pl.streak = pl.lastPlay === yesterdayStr() ? pl.streak + 1 : 1;
    pl.lastPlay = today;
    streakBonus = REWARDS.streakPerDay * Math.min(pl.streak, REWARDS.streakCap);
    lines.push([`🔥 ${pl.streak}-day streak bonus`, streakBonus]);
  }
  const total = lines.reduce((s, l) => s + l[1], 0);
  addTokens(pl, total);
  pl.progress[key] = { done: true, stars: Math.max(stars, prev.stars || 0), plays: (prev.plays || 0) + 1, last: Date.now() };
  pl.lessonsDone++;
  Store.save();
  const result = { stars, lines, total, pathId: lesson.pathId };
  lesson = null;
  go("results", { result }, { replace: true });
  Sound.win(); confetti();
  if (pl.readAloud) Speech.say(result.total ? `Lesson complete! You earned ${result.total} tokens!` : "Lesson complete! Great practice!");
}

const stars3 = n => n === 3 ? "🏆" : n === 2 ? "🎉" : "👏";

/* ---------- Prize shop ---------- */
function renderShop() {
  const pl = player(), st = state();
  const mine = st.log.filter(l => l.profileId === pl.id).slice(0, 10);
  $app.innerHTML = topBar(pl, { back: true }) + `
    <h1 class="title">🎁 Prize Shop</h1><p class="subtitle">Spend your tokens on real prizes! A grown-up has to say yes.</p>
    ${st.prizes.length ? `<div class="shopgrid">${st.prizes.map(p => {
      const can = pl.tokens >= p.cost;
      return `<div class="prize"><div class="pe">${esc(p.emoji || "🎁")}</div><div class="pn">${esc(p.name)}</div>
        <div class="pc">🪙 ${p.cost}</div>
        ${can ? `<button class="btn block" data-act="redeem" data-id="${p.id}">Get it!</button>`
              : `<button class="btn block" disabled>Need ${p.cost - pl.tokens} more</button>`}</div>`;
    }).join("")}</div>` : `<div class="card"><p>No prizes yet! Ask a grown-up to add some in ⚙️.</p></div>`}
    <div class="card"><h3>My prizes</h3>${mine.length ? `<ul class="list">${mine.map(l =>
      `<li><span>${esc(l.emoji)} ${esc(l.name)}</span><span class="muted">${fmtDate(l.ts)} · 🪙 ${l.cost}</span></li>`).join("")}</ul>`
      : `<p class="muted">Nothing yet — keep solving puzzles!</p>`}</div>`;
}
function redeem(id) {
  const pl = player(), prize = state().prizes.find(p => p.id === id);
  if (!prize || pl.tokens < prize.cost) return;
  requireGrownUp(`${pl.name} wants “${prize.name}” for ${prize.cost} tokens. Grown-up, enter your PIN to say yes.`, () => {
    if (player() !== pl || pl.tokens < prize.cost) { toast("Not enough tokens for that one yet!"); render(); return; }
    pl.tokens -= prize.cost;
    state().log.unshift({ ts: Date.now(), profileId: pl.id, who: pl.name, avatar: pl.avatar, emoji: prize.emoji, name: prize.name, cost: prize.cost });
    Store.save(); render(); Sound.win(); confetti(120);
    const m = openModal(`<div class="bigicon">${esc(prize.emoji || "🎁")}</div><h3>You got it!</h3>
      <p>“${esc(prize.name)}” is yours! Go tell your grown-up. 🎉</p><div class="acts"><button class="btn block" data-m="ok">Yay!</button></div>`);
    m.querySelector('[data-m="ok"]').onclick = closeModal;
  });
}

/* ---------- Grown-ups area ---------- */
function renderParent() {
  const st = state();
  const avatarSelect = (p) => `<select data-field="avatar" data-kind="player" data-id="${p.id}">${AVATARS.map(a => `<option ${a === p.avatar ? "selected" : ""}>${a}</option>`).join("")}</select>`;
  const pathSelect = (p) => `<select data-field="pathId" data-kind="player" data-id="${p.id}">${PATHS.map(x => `<option value="${x.id}" ${x.id === p.pathId ? "selected" : ""}>${x.emoji} ${esc(x.title)} (${esc(x.ages)})</option>`).join("")}</select>`;
  const done = (p) => Object.values(p.progress).filter(x => x.done).length;
  const totalLessons = PATHS.reduce((s, x) => s + x.tracks.reduce((a, t) => a + t.levels.length, 0), 0);
  $app.innerHTML = `<div class="top"><button class="iconbtn" data-act="leaveParent" aria-label="Back">⬅️</button><h2>⚙️ Grown-ups</h2><span class="muted" style="font-weight:700">Version ${esc(APP.version)}</span></div>

    <div class="card"><h3>Players</h3>
      ${st.profiles.map(p => `<div class="plrow">
        <div class="line">${avatarSelect(p)}<input class="text" style="flex:1;min-width:160px;font-size:20px;padding:10px 12px" maxlength="16" value="${esc(p.name)}" data-field="name" data-kind="player" data-id="${p.id}"></div>
        <div class="line">${pathSelect(p)}<label class="toggle"><input type="checkbox" ${p.readAloud ? "checked" : ""} data-field="readAloud" data-kind="player" data-id="${p.id}"> Read questions aloud</label></div>
        <div class="line"><b>🪙 ${p.tokens}</b>
          <button class="btn small ghost" data-act="adjTokens" data-id="${p.id}" data-v="-5">−5</button>
          <button class="btn small ghost" data-act="adjTokens" data-id="${p.id}" data-v="5">+5</button>
          <span class="muted">· 🔥 ${liveStreak(p)} · ${done(p)}/${totalLessons} lessons · ${p.totalEarned} earned all-time</span></div>
        <div class="line"><button class="btn small ghost" data-act="resetPlayer" data-id="${p.id}">Reset progress</button>
          <button class="btn small danger" data-act="deletePlayer" data-id="${p.id}">Delete player</button></div>
      </div>`).join("") || `<p class="muted">No players yet.</p>`}
    </div>

    <div class="card"><h3>Prizes (shared by all players)</h3>
      <p class="muted" style="margin-top:0">Changes save automatically. Each kid spends their own tokens.</p>
      <div class="prizescroll">
      ${st.prizes.map(p => `<div class="prow">
        <input class="text emo" maxlength="16" value="${esc(p.emoji)}" data-field="emoji" data-kind="prize" data-id="${p.id}" aria-label="Emoji">
        <input class="text" maxlength="60" value="${esc(p.name)}" data-field="name" data-kind="prize" data-id="${p.id}" aria-label="Prize name">
        <input class="text" type="number" inputmode="numeric" min="1" max="9999" value="${p.cost}" data-field="cost" data-kind="prize" data-id="${p.id}" aria-label="Cost">
        <button class="iconbtn" data-act="deletePrize" data-id="${p.id}" aria-label="Delete prize">🗑️</button></div>`).join("")}
      </div>
      <button class="btn small brand" data-act="addPrize">＋ Add prize</button>
    </div>

    <div class="card"><h3>Prize history</h3>${st.log.length ? `<ul class="list">${st.log.slice(0, 50).map(l =>
      `<li><span>${esc(l.avatar)} ${esc(l.who)}: ${esc(l.emoji)} ${esc(l.name)}</span><span class="muted">${fmtDate(l.ts)} · 🪙 ${l.cost}</span></li>`).join("")}</ul>`
      : `<p class="muted">No prizes redeemed yet.</p>`}</div>

    <div class="card"><h3>Settings</h3>
      <div class="line" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
        <label class="toggle"><input type="checkbox" ${st.sound ? "checked" : ""} data-field="sound" data-kind="app"> Sound effects</label>
        <button class="btn small ghost" data-act="changePin">Change PIN</button></div>
      <p class="muted">Tip: on iPad, tap Share → “Add to Home Screen” to use ${esc(APP.name)} like an app. Progress is saved on this device.</p>
      <p class="muted" style="font-size:15px">Version ${APP.version}</p>
    </div>`;
}
function onParentFieldChange(el) {
  const st = state(), { kind, id, field } = el.dataset;
  if (kind === "app") { st[field] = el.checked; }
  else if (kind === "player") {
    const p = st.profiles.find(x => x.id === id); if (!p) return;
    if (field === "readAloud") p.readAloud = el.checked;
    else if (field === "name") p.name = el.value.trim().slice(0, 16) || p.name;
    else p[field] = el.value;
  } else if (kind === "prize") {
    const p = st.prizes.find(x => x.id === id); if (!p) return;
    if (field === "cost") p.cost = Math.max(1, Math.min(9999, Math.round(Number(el.value) || 1)));
    else if (field === "name") p.name = el.value.trim().slice(0, 60) || "Prize";
    else p.emoji = el.value.trim() || "🎁";
  }
  Store.save(); toast("Saved ✓", 900);
}

/* ==========================================================================
   ACTIONS (event delegation)
   ========================================================================== */
const actions = {
  picker() { Speech.stop(); go("picker"); },
  addPlayer() { go("addPlayer"); },
  setup() { render(); }, // the setup card was removed in 1.2.2; kept so a stale tap is harmless
  pickAvatar(el) { if (!view.form) return; view.form.avatar = el.dataset.v; render(); },
  pickPath(el) { if (!view.form) return; view.form.pathId = el.dataset.v; render(); },
  savePlayer() {
    const f = view.form; if (!f) return;
    const name = f.name.trim();
    if (!name) { toast("Type a nickname first! ✏️"); document.getElementById("pname").focus(); return; }
    const p = newProfile(name.slice(0, 16), f.avatar, f.pathId);
    state().profiles.push(p); state().activeId = p.id; Store.save(); Sound.win(); go("home");
  },
  choosePlayer(el) { LessonSave.clear(); lesson = null; if (!state().profiles.some(p => p.id === el.dataset.id)) return go("picker"); state().activeId = el.dataset.id; Store.save(); Sound.tap(); go("home"); },
  home() { go("home"); },
  viewPath(el) { view.pathId = el.dataset.v; render(); recordHistory(true); },
  startLesson(el) {
    if (!player()) return go("picker");
    const pathId = el.dataset.path, ti = Number(el.dataset.t), li = Number(el.dataset.l);
    if (!isUnlocked(player(), pathId, ti, li)) { toast("🔒 Finish the level before this one to unlock it!"); return; }
    Sound.tap(); startLesson(pathId, ti, li);
  },
  answer(el) { if (lesson && !lesson.answered) answer(el); },
  showMe() { if (lesson && !lesson.answered) showMe(); },
  continue() { if (lesson && lesson.answered) nextQuestion(); },
  speakQ() { if (lesson) Speech.say(questionSpeech(lessonQ())); },
  speakWhy() { if (lesson && lesson.feedback) Speech.say(lesson.feedback.text || explain(lessonQ(), lesson.feedback)); else if (lesson) Speech.say(explain(lessonQ(), { ok: true })); },
  quitLesson() { confirmBox("Leave this lesson?", lesson && !lesson.replay ? "Tokens are saved when you finish the lesson. If you leave now, this lesson's tokens won't count." : "You can come back any time!", "Leave", () => { lesson = null; LessonSave.clear(); go("home", {}, { replace: true }); }); },
  shop() { go("shop"); },
  redeem(el) { redeem(el.dataset.id); },
  parent() { requireGrownUp("This area is for grown-ups.", () => go("parent")); },
  leaveParent() { go(player() ? "home" : "picker"); },
  adjTokens(el) { const p = state().profiles.find(x => x.id === el.dataset.id); if (!p) return; p.tokens = Math.max(0, p.tokens + Number(el.dataset.v)); Store.save(); render(); },
  resetPlayer(el) {
    const p = state().profiles.find(x => x.id === el.dataset.id);
    confirmBox(`Reset ${p.name}?`, "This clears their lessons, stars, streak, and tokens.", "Reset", () => {
      Object.assign(p, { tokens: 0, totalEarned: 0, streak: 0, lastPlay: null, progress: {}, lessonsDone: 0, replayDay: null, replayCount: 0 }); LessonSave.clear(); Store.save(); render();
    }, true);
  },
  deletePlayer(el) {
    const st = state(), p = st.profiles.find(x => x.id === el.dataset.id);
    confirmBox(`Delete ${p.name}?`, "This removes the player and all their progress.", "Delete", () => {
      st.profiles = st.profiles.filter(x => x.id !== p.id); if (st.activeId === p.id) st.activeId = null; LessonSave.clear(); Store.save(); render();
    }, true);
  },
  addPrize() { state().prizes.push({ id: uid(), emoji: "🎁", name: "New prize", cost: 20 }); Store.save(); render(); },
  deletePrize(el) {
    const st = state(), p = st.prizes.find(x => x.id === el.dataset.id);
    confirmBox("Delete this prize?", `“${p.name}”`, "Delete", () => { st.prizes = st.prizes.filter(x => x.id !== p.id); Store.save(); render(); }, true);
  },
  changePin() { createPin(() => {}); },
};
const NAV_GUARD_MS = 350;
function recover(err) {
  console.error("[recovered]", err);
  try { closeModal(); lesson = null; go(player() ? "home" : "picker"); toast("Oops! Let's go back to the map. 🗺️"); }
  catch (e2) { $app.innerHTML = `<div class="card" style="text-align:center"><h3>Oops!</h3><p>Something went wrong.</p><button class="btn" onclick="location.reload()">Start again</button></div>`; }
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled || el.getAttribute("aria-disabled") === "true") return;
  if (Date.now() - lastNavAt < NAV_GUARD_MS && !el.closest(".overlay")) return; // stray tap from the previous screen
  const fn = actions[el.dataset.act];
  if (!fn) return;
  try { fn(el, e); } catch (err) { recover(err); }
});
document.addEventListener("change", e => { if (e.target.matches("[data-kind]")) { try { onParentFieldChange(e.target); } catch (err) { recover(err); } } });
document.addEventListener("touchstart", e => { // enables :active press styles on iOS; pauses the level ring while touched
  const stop = e.target.closest && e.target.closest(".stop"); if (stop) stop.classList.add("touched");
}, { passive: true });
document.addEventListener("touchend", () => document.querySelectorAll(".stop.touched").forEach(el => el.classList.remove("touched")), { passive: true });
window.addEventListener("resize", () => {
  const sheet = document.querySelector(".sheet.show"), pad = document.querySelector(".sheetpad");
  if (sheet && pad) pad.style.height = (sheet.offsetHeight + 10) + "px";
});

/* ==========================================================================
   INIT
   ========================================================================== */
let updatePending = null, updateCheckedAt = 0;
function checkForUpdate() {
  if (view.name === "lesson" || lesson) return; // never reload mid-lesson; progress stays in localStorage until then
  if (updatePending) { maybeApplyUpdate(); return; }
  const now = Date.now();
  if (now - updateCheckedAt < 15000) return;
  updateCheckedAt = now;
  let url;
  try { url = new URL("version.json", document.baseURI); } catch (e) { return; }
  url.searchParams.set("t", String(now));
  fetch(url.href, { cache: "no-store", credentials: "same-origin" }).then(r => r.ok ? r.json() : null).then(data => {
    const remote = data && typeof data.version === "string" ? data.version.trim() : "";
    if (!remote || remote === APP.version) return;
    updatePending = remote;
    maybeApplyUpdate();
  }).catch(() => {});
}
function maybeApplyUpdate() {
  if (!updatePending || lesson || view.name === "lesson") return;
  if (!["home", "picker", "shop", "parent"].includes(view.name)) return; // let a results celebration finish
  try {
    const key = APP.storageKey + ".update";
    if (sessionStorage.getItem(key) === updatePending) { updatePending = null; return; }
    sessionStorage.setItem(key, updatePending);
  } catch (e) { return; }
  location.reload();
}
window.addEventListener("popstate", onPopState);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") checkForUpdate();
});
Store.load();
Speech.pickVoice();
const resumed = LessonSave.load();
if (resumed) {
  // A reload or crash mid-lesson: pick up where the kid left off. Tokens are only paid at the end, so nothing is re-earned.
  state().activeId = resumed.profileId; Store.save(); lesson = resumed.lesson;
  if (lesson.cur === null) nextQuestion();      // between questions
  else { go("lesson"); if (lesson.feedback) showFeedback(lesson.feedback); } // same puzzle, same answer order; never re-scored
  toast("Welcome back! Let's keep going. 🦉");
} else go("picker"); // otherwise always start on the "Who's playing?" screen
lastNavAt = 0; // nothing to guard against on first load
if (/[?&]test=1\b/.test(location.search)) window.__app = { PATHS, Store, APP, explain, get lesson() { return lesson; } }; // automated tests only
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
</script>
