<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Offline-only backstop: this page may not load anything from anywhere (no fonts, images, scripts, or fetches). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; frame-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Lily Bridge · Elzee</title>
<style>
:root{
  --bg:#fff8e7; --ink:#2d2a4a; --muted:#6f6b8a; --line:#e7e2f5;
  --good:#3ccf4e; --good-d:#2a9d38; --gold:#ffc83d; --gold-d:#e0a400; --oops:#ff9f43;
  --water:#3fb5a6; --water-d:#2a8f84; --sand:#f3d9a4; --sand-d:#dcb878;
  --font:"Fredoka","Chalkboard SE","Comic Sans MS","Arial Rounded MT Bold",system-ui,sans-serif;
  --p:72px;   /* board cell size (set from JS to fit the screen) */
  --t:72px;   /* tray piece size */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:20px;line-height:1.3;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2{margin:0}
#app{max-width:1180px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px)}
.btn{border:none;border-radius:18px;padding:10px 20px;min-height:64px;min-width:64px;font-size:22px;font-weight:600;
  background:var(--good);color:#fff;box-shadow:0 5px 0 var(--good-d);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--good-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn .ico{font-size:30px;line-height:1}
.iconbtn{border:none;background:#fff;border-radius:16px;width:56px;height:56px;font-size:28px;flex:none;
  box-shadow:0 4px 0 var(--line);display:inline-flex;align-items:center;justify-content:center}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.iconbtn.on{background:#e3f6f3;box-shadow:0 4px 0 #b9e3dc}

/* top bar */
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px;min-height:56px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:4px 14px;min-height:52px;
  font-size:21px;font-weight:700;box-shadow:0 4px 0 var(--line);min-width:0}
.pill .av{font-size:30px}
.pill .nm{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jar b{color:var(--gold-d)}
.jarbar{width:80px;height:14px;border-radius:99px;background:#f1edfa;overflow:hidden;flex:none}
.jarbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.spacer{flex:1;min-width:0}

/* start screen */
.hero{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.hero .frog{width:92px;height:92px;flex:none;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.bubble{background:#fff;border-radius:20px;padding:12px 16px;box-shadow:0 4px 0 var(--line);font-size:20px;flex:1;min-width:0}
.bubble.sayzone{display:flex;align-items:center;gap:10px}
.bubble .btxt{flex:1;min-width:0}
.zonehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.zonehead h2{margin:0 0 0 4px!important}
[data-say]{cursor:pointer}
.sayzone.nudge,.story.nudge{animation:nudge .6s ease-in-out 2}
@keyframes nudge{50%{box-shadow:0 0 0 6px var(--gold)}}
.piece.glow,.cell.glow{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(255,200,61,.0)}to{box-shadow:0 0 0 7px rgba(255,200,61,.95)}}
.tiers.one{grid-template-columns:minmax(0,1fr)}
.tiers.one .tier{min-height:150px}
.bubble .demo{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bubble .demo svg{width:46px;height:46px}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tier{border:none;background:linear-gradient(var(--water),var(--water-d));border-radius:24px;box-shadow:0 6px 0 #1f6e66;color:#fff;
  min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px 6px;position:relative}
.tier:active{transform:translateY(4px);box-shadow:0 2px 0 #1f6e66}
.tier.rec{outline:5px solid var(--gold);outline-offset:-5px}
.tier .mini{display:flex;gap:2px}
.tier .mini svg{width:30px;height:30px}
@media (min-width:700px){ .tier .mini svg{width:46px;height:46px} .tier .mini{gap:4px} }
.tier b{font-size:19px}
.tier .resume{position:absolute;top:8px;right:10px;font-size:26px}
.shelf{background:#fff;border-radius:24px;box-shadow:0 6px 0 var(--line);padding:12px;margin-top:18px}
.shelf h2{font-size:22px;margin:0 0 8px 4px}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.stk span{height:64px;border-radius:16px;background:#e3f6f3;display:flex;align-items:center;justify-content:center;font-size:38px}
.stk span.no{background:#f1eff6;filter:grayscale(1);opacity:.35;font-size:26px}

/* play layout */
.playwrap{display:grid;gap:12px;justify-items:center}
.side{display:grid;gap:10px;width:100%;max-width:700px;align-content:start}
.story{display:flex;align-items:center;gap:8px;background:#fff;border-radius:20px;box-shadow:0 5px 0 var(--line);padding:6px 10px;min-height:64px;flex-wrap:nowrap}
.story .who{display:flex;align-items:center;gap:2px;flex:none}
.story .who svg{width:44px;height:44px}
.story .arrow{font-size:22px;color:var(--water-d);font-weight:700}
.tripdots{display:flex;gap:6px;align-items:center;flex:none}
.tripdots i{display:block;width:22px;height:22px;border-radius:50%;background:#e2ede9;border:3px solid #cfe3dd}
.tripdots i.done{background:#7cc96b;border-color:#58a84a}
.tripdots i.cur{background:#fff4d4;border-color:var(--gold)}
.story .ctrls{display:flex;gap:8px;margin-left:auto;flex:none}
.say-line{font-size:17px;color:var(--muted);text-align:center}
.boardcell{display:flex;justify-content:center;width:100%}
.board{display:grid;gap:4px;background:radial-gradient(circle at 30% 20%,#6fd0c2,var(--water) 55%,var(--water-d));border-radius:24px;
  padding:8px;box-shadow:0 6px 0 #1f6e66;position:relative}
.board.sunset{background:radial-gradient(circle at 70% 15%,#ffc98a,#e99a7a 35%,var(--water-d) 80%)}
.board.night{background:radial-gradient(circle at 50% 0%,#3b5a7a,#24425a 60%,#16303f)}
.shore{grid-row:1 / -1;background:var(--sand);border-radius:14px;box-shadow:inset 0 -4px 0 var(--sand-d);position:relative}
.shore .spot{position:absolute;left:0;right:0;height:var(--p);display:flex;align-items:center;justify-content:center}
.shore .spot svg{width:92%;height:92%}
.shore .spot .cup{position:absolute;top:-4px;right:-2px;font-size:calc(var(--p) * .3)}
.shore .spot .think{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:calc(var(--p) * .28);background:#fff;border-radius:999px;padding:0 5px;box-shadow:0 2px 0 var(--line)}
.cell{width:var(--p);height:var(--p);border-radius:12px;position:relative;display:flex;align-items:center;justify-content:center}
.cell.rock svg,.cell.lily svg{width:78%;height:78%}
.cell.slot{border:3px dashed rgba(255,255,255,.85);background:rgba(255,255,255,.12)}
.cell.slot.target{background:rgba(255,236,160,.55);border-color:#ffe066;border-style:solid;transform:scale(1.06)}
.cell.slot.sel-target{background:rgba(255,255,255,.28)}
.cell.flash{background:rgba(255,159,67,.55)!important;border-color:var(--oops)!important}
.plank{width:100%;height:100%;display:block;position:relative}
.plank svg{width:100%;height:100%;display:block;pointer-events:none}
.cell.fixed .plank svg{filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.cell .piece{position:absolute;inset:0;border:none;background:none;padding:0;touch-action:none;border-radius:10px}
.cell .piece svg{width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.lit::after{content:"";position:absolute;inset:-2px;border-radius:12px;box-shadow:0 0 0 3px #ffe066,0 0 14px #ffe9a8;pointer-events:none}
.squish{animation:squish .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes squish{0%{transform:scale(1.18,.82)}45%{transform:scale(.92,1.1)}75%{transform:scale(1.04,.97)}100%{transform:none}}
.wobble{animation:wobble .42s ease-in-out}
@keyframes wobble{20%{rotate:-10deg}40%{rotate:9deg}60%{rotate:-6deg}80%{rotate:4deg}100%{rotate:0deg}}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;background:#fff;border-radius:22px;box-shadow:0 6px 0 var(--line);padding:10px;
  min-height:calc(var(--t) + 20px);width:100%}
.tray .slotbox{width:var(--t);height:var(--t);position:relative;flex:none}
.tray .piece{width:100%;height:100%;border:none;padding:0;border-radius:14px;background:#f6efe2;box-shadow:0 4px 0 #e2d4b8;touch-action:none;position:relative}
.tray .piece svg{width:100%;height:100%;pointer-events:none;transition:transform .22s ease-out}
.tray .piece.sel{outline:4px solid var(--gold);background:#fff4d4;transform:translateY(-4px)}
.tray .piece.lifted{opacity:.25}
.tray .rot{position:absolute;right:-8px;bottom:-8px;width:44px;height:44px;border-radius:50%;border:none;background:#fff;box-shadow:0 3px 0 var(--line);
  font-size:22px;display:flex;align-items:center;justify-content:center;z-index:2}
.tray .rot:active{transform:translateY(2px)}
.tray.turny .slotbox{width:calc(var(--t) + 48px);height:var(--t);display:flex;flex-direction:row;gap:4px}
.tray.turny .piece{width:var(--t);height:var(--t);flex:none}
.tray.turny .rot{position:static;width:44px;height:100%;border-radius:14px;flex:none}
.tray .empty{align-self:center;font-size:30px;color:var(--muted)}
.dragghost{position:fixed;z-index:50;pointer-events:none;left:0;top:0;will-change:transform}
.dragghost svg{width:100%;height:100%;filter:drop-shadow(0 10px 6px rgba(0,0,0,.25))}
.dragghost.back{transition:transform .32s cubic-bezier(.3,.8,.4,1)}
.dragghost.snap{transition:transform .14s ease-out}
.frogger{position:absolute;z-index:5;pointer-events:none;width:calc(var(--p) * .9);height:calc(var(--p) * .9);left:0;top:0;transition:transform .2s ease-in-out}
.frogger svg{width:100%;height:100%;animation:none}
.frogger.hop svg{animation:hop .2s ease-in-out}
@keyframes hop{50%{transform:translateY(-35%) scale(1.08,.94)}}
.dance svg,.shore .spot.dance svg{animation:dance .5s ease-in-out infinite alternate}
@keyframes dance{0%{transform:translateY(0) rotate(-7deg)}100%{transform:translateY(-10px) rotate(7deg)}}
@media (orientation:landscape) and (min-aspect-ratio:5/4){
  .playwrap{grid-template-columns:auto minmax(400px,1fr);align-items:start;justify-items:stretch}
  .playwrap .boardcell{grid-column:1;grid-row:1}
  .playwrap .side{grid-column:2;grid-row:1;max-width:none}
}
.playwrap.compact .top{margin-bottom:0}
.playwrap.compact .top .nm{display:none}
@media (orientation:landscape) and (min-aspect-ratio:5/4){ .playwrap.compact{grid-template-columns:auto minmax(320px,1fr);gap:10px} }
.playwrap.compact .top .pill:not(.jar),.playwrap.compact .top .jarbar,.playwrap.compact .story .arrow{display:none}
.playwrap.compact .top,.playwrap.compact .story{gap:5px}
.playwrap.compact .tripdots{gap:3px}
.playwrap.compact .tray{gap:8px}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(45,42,74,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:14px}
.panel{background:var(--bg);border-radius:28px;padding:20px;max-width:600px;width:100%;max-height:94vh;overflow:auto;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.12);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.panel h2{font-size:30px;margin-bottom:6px}
.cheer{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.cheer svg{width:64px;height:64px;animation:dance .55s ease-in-out infinite alternate}
.cheer svg:nth-child(2n){animation-delay:.27s}
.coins{font-size:30px;font-weight:700;color:var(--gold-d);margin:6px 0}
.reveal{font-size:84px;line-height:1.1;animation:spin 1s .3s both}
@keyframes spin{0%{transform:rotateY(180deg) scale(.3)}100%{transform:none}}
.star{font-size:48px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.note{background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 var(--line);margin:10px 0;font-size:18px}
.left{text-align:left}
.muted{color:var(--muted)}
.confetti{position:fixed;top:-20px;z-index:60;width:12px;height:16px;border-radius:3px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (max-width:600px){
  .top{gap:5px} .top .iconbtn{width:48px;height:48px;font-size:24px}
  .pill{font-size:18px;padding:4px 10px;min-height:48px} .pill .av{font-size:26px}
  .jarbar{width:44px}
  .tiers{gap:8px} .tier{min-height:150px} .tier .mini svg{width:22px;height:22px}
  .story .who svg{width:36px;height:36px} .story .ctrls .iconbtn{width:48px;height:48px;font-size:24px}
  .tripdots i{width:16px;height:16px}
  .btn{font-size:19px;padding:8px 12px;min-height:58px;min-width:58px}
}
@media (max-height:500px){
  .top .iconbtn{width:46px;height:46px;font-size:22px} .pill{min-height:46px}
  .story{min-height:54px;padding:4px 8px} .story .ctrls .iconbtn{width:46px;height:46px;font-size:22px}
  .story .who svg{width:34px;height:34px}
}
/* Respect "reduce motion": no bouncing, wobbling, flying or falling. Feedback stays as colour + sound. */
@media (prefers-reduced-motion: reduce){
  .sayzone.nudge,.story.nudge,.piece.glow,.cell.glow{outline:5px solid var(--gold);outline-offset:2px}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001ms!important}
  .confetti{display:none}
}
</style>

<script>
/*VOICE-START v1.0.0*/
/* ElzeeVoice v1.0.0 - one shared read-aloud voice for Elzee and its games (1.4.2).
   Source of truth: workspace/build142/elzee-voice.js, pasted unchanged between the VOICE markers of
   index.html and games/*.html (the pages are offline single files, so no <script src>).
   - Calm, natural voices first (iPad Safari: Ava Premium/Enhanced, Samantha Enhanced, Allison, Susan, Karen, Samantha).
   - Novelty voices (Fred, Zarvox, Bubbles, ...) are never used.
   - One calm rate (0.9) and normal pitch (1.0) everywhere, younger mode included.
   - Each kid picks their own voice in Elzee (🔈 on the top bar). It is saved on their profile as profile.voice
     in logicquest.v1; games only READ it (active profile). No network, on-device voices only. */
(function (root) {
  "use strict";
  var VERSION = "1.0.0", RATE = 0.9, PITCH = 1.0, MAIN_KEY = "logicquest.v1";
  var NOVELTY = /(^|[\s.\-_(])(Fred|Albert|Bad News|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Pipe Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Bahh|Junior|Ralph|Kathy|Deranged|Hysterical)($|[\s.\-_)])/i;
  var PREFER = [/^Ava\b.*\((Premium|Enhanced)\)/i, /^Samantha\b.*\(Enhanced\)/i, /^Allison\b/i, /^Susan\b/i, /^Karen\b/i, /^Samantha\b/i];
  // Friendly characters for the kids' voice cards (picture-only; no reading needed).
  var CHARS = [{ e: "🦉", n: "Owl" }, { e: "🐻", n: "Bear" }, { e: "🐰", n: "Bunny" }, { e: "🐢", n: "Turtle" }, { e: "🐳", n: "Whale" }];
  function isNovelty(v) { return !!v && (NOVELTY.test(String(v.name || "")) || NOVELTY.test(String(v.voiceURI || ""))); }
  function score(v) {
    var name = String(v.name || ""), i;
    for (i = 0; i < PREFER.length; i++) if (PREFER[i].test(name)) return i;
    return /^en[-_]US/i.test(v.lang || "") ? 20 : 30;
  }
  function voices() {
    var all = [];
    try { all = (root.speechSynthesis && root.speechSynthesis.getVoices && root.speechSynthesis.getVoices()) || []; } catch (e) { all = []; }
    var seen = {}, out = [];
    for (var i = 0; i < all.length; i++) {
      var v = all[i];
      if (!v || !/^en/i.test(v.lang || "") || v.localService === false || isNovelty(v) || seen[v.name]) continue; // on-device English only
      seen[v.name] = 1; out.push(v);
    }
    return out.map(function (v, i) { return { v: v, s: score(v), i: i }; })
      .sort(function (a, b) { return a.s - b.s || a.i - b.i; }).map(function (x) { return x.v; });
  }
  // Active Elzee profile, read only (games never write logicquest.v1).
  function activeProfile() {
    try {
      var d = JSON.parse(root.localStorage.getItem(MAIN_KEY));
      if (!d || !Array.isArray(d.profiles)) return null;
      for (var i = 0; i < d.profiles.length; i++) if (d.profiles[i] && d.profiles[i].id === d.activeId) return d.profiles[i];
    } catch (e) {}
    return null;
  }
  function prefFor(p) { return p && typeof p.voice === "string" && p.voice ? p.voice.slice(0, 100) : null; }
  function pick(name) {
    var list = voices();
    if (name) for (var i = 0; i < list.length; i++) if (list[i].name === name) return list[i];
    return list[0] || null; // calm default
  }
  // Voice cards for the kid picker: the best few voices, each with a friendly character.
  function choices(max) {
    var list = voices().slice(0, Math.min(max || CHARS.length, CHARS.length));
    return list.map(function (v, i) { return { name: v.name, lang: v.lang, emoji: CHARS[i].e, char: CHARS[i].n }; });
  }
  // Set voice, calm rate and normal pitch on an utterance. name undefined = the active profile's pick.
  function apply(u, name) {
    if (name === undefined) name = prefFor(activeProfile());
    var v = pick(name);
    if (v) { try { u.voice = v; } catch (e) { /* not a real voice object */ } u.lang = v.lang || "en-US"; } else u.lang = "en-US";
    u.rate = RATE; u.pitch = PITCH;
    api.last = v ? v.name : null;
    return u;
  }
  var api = { version: VERSION, RATE: RATE, PITCH: PITCH, CHARS: CHARS, isNovelty: isNovelty, voices: voices, pick: pick,
    choices: choices, apply: apply, prefFor: prefFor, activeProfile: activeProfile, last: null };
  root.ElzeeVoice = api;
})(typeof window !== "undefined" ? window : this);
/*VOICE-END*/
</script>
<script>
"use strict";
/* ==========================================================================
   LILY BRIDGE: an Elzee interlude (spatial building). Boba Frog has to carry a
   boba tea across the pond to a buddy. Kids drag plank pieces (straight and
   corner) into the gaps so the planks connect from shore to shore.
   Every pond is generated from a seed and solver-checked to be buildable with
   the pieces in the tray (which include decoys).
   ========================================================================== */
const GAME = {
  id: "lilybridge",
  storageKey: "logicquest.minigame.lilybridge.v1", // this game's own key
  mainKey: "logicquest.v1",                        // main app key: READ ONLY, never written here
  pondsPerTrip: 3,
};
const ECON = { perPond: 1, tripBonus: 1, dailyCap: Infinity }; // Elzee 1.4.2: no daily cap (Aaron: unlimited, replays paid)
const STICKERS = ["🪷", "🐞", "🍄", "🐌", "🌻", "🦆", "🦋", "🐢", "🐟", "🌈", "🐚", "🦀"];
const SKIES = ["", "sunset", "night"];
const FRIENDS = ["D", "C", "A", "B"];   // who is waiting for the boba on each pond
const RM = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- generator + solver (identical copy is unit-tested in lily-bridge-dev/) ---------- */
/*GEN-START*/
/* Directions as bits: N=1 E=2 S=4 W=8. A plank tile is a 2-bit mask (straight or corner). */
const DIRS = [[1, -1, 0], [2, 0, 1], [4, 1, 0], [8, 0, -1]];
const OPP = { 1: 4, 4: 1, 2: 8, 8: 2 };
const rotCW = m => ((m << 1) | (m >> 3)) & 15;
const TILE_TYPES = [10, 5, 3, 6, 12, 9];               // ═ ║ ╚ ╔ ╗ ╝

    <h2>${last ? (nr ? "🎉🌉" : "🎉 All friends got their boba!") : (nr ? "🌉🧋" : `${BUDDY_NAMES[who]} got the boba!`)}</h2>
    <div class="cheer">${(last ? "FDCAB" : "F" + who).split("").map(b => buddySVG(b, "yay")).join("")}</div>
    ${perfect ? `<div class="star" aria-label="Perfect build">⭐</div>` : ""}
    ${got ? `<div class="coins">+${got} 🪙</div>` : ""}
    ${!got && capped ? `<div class="note">${nr ? "🪙✅🌙" : "Your token jar is full for today. Bridges are still free to build! 🌙"}</div>` : ""}
    ${last && sticker ? `<div class="reveal" aria-label="New sticker for My Pond">${sticker}</div>${nr ? "" : `<div class="muted">New sticker for My Pond!${stars ? ` (${stars} ⭐ this trip)` : ""}</div>`}` : ""}
    <div class="row">${sayBtn(words, "btn ghost")}${last
      ? `<button class="btn ghost" data-act="home" aria-label="Back to start"><span class="ico">🏠</span></button>
         <button class="btn" data-act="again" aria-label="New trip"><span class="ico">🔁</span>${nr ? "" : "Again"}</button>`
      : `<button class="btn" data-act="nextPond" aria-label="Next pond"><span class="ico">▶️</span>${nr ? "" : "Next pond"}</button>`}</div>
  </div></div>`;
  Speech.say(words);
}
function showGrown() {
  const k = kid();
  $ov.innerHTML = `<div class="ov"><div class="panel left sayzone" role="dialog" aria-label="For grown-ups">
    <h2 style="text-align:center">For grown-ups</h2>
    <p><b>What it practices:</b> spatial reasoning: matching connections (an opening must meet an opening), planning a route through open water, and on <i>Twisty pond</i> mentally rotating pieces. Some pieces are decoys, so kids must decide which ones belong.</p>
    <p><b>Tokens:</b> only from playing. +${ECON.perPond} per bridge, +${ECON.tripBonus} for finishing a ${GAME.pondsPerTrip}-bridge trip (about 1–3 minutes). No daily limit: every bridge pays, replays too. No purchases, ads, timers, or lives. Wobbles and hints only affect the ⭐.</p>
    <div class="note">Player: ${esc(me.avatar)} ${esc(me.name)} ${me.linked ? "(from Elzee)" : "(no Elzee player on this device)"}<br>
      Today: ${k.earnedToday} · Bridges built: ${k.ponds} · Trips: ${k.trips}</div>
    <p class="muted" style="font-size:16px">Tokens are moved into the Elzee wallet by the main app. 🐣 Younger mode hides all words and talks; 🔈 reads every screen with the device's own voice. Animations turn off when the device's “Reduce Motion” setting is on. No reset button here on purpose.</p>
    <p><b>Younger mode 🐣</b> (on by default for the Little path, switch per child on the start screen): no words, every screen talks (🔈 and auto-speak), Little pond only, and nothing to fail. Wrong pieces wobble home, the right piece glows after two misses, and the ⭐ is never lost.</p>
    <div class="row"><button class="btn ghost saybtn" data-act="sayZone" aria-label="Read aloud">🔈</button><button class="btn" data-act="closeOv">Close</button></div></div></div>`;
  const b = $ov.querySelector(".saybtn"); b.dataset.say = $ov.querySelector(".panel").innerText.replace(/🔈|Close/g, "").replace(/\s+/g, " ").trim();
  Speech.auto("grown", "For grown-ups. Tap the speaker to hear this page.");
}
function confetti(n = 60) {
  if (RM()) return;
  const colors = ["#3ccf4e", "#ffc83d", "#ff6b3d", "#ff8fab", "#2a9d8f", "#d8a26b"];
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div"); c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw"; c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.5 + Math.random() * 1.5) + "s"; c.style.animationDelay = (Math.random() * .3) + "s";
    document.body.appendChild(c); setTimeout(() => c.remove(), 3500);
  }
}
function render() { if (view === "pond" && pond && trip()) renderPond(); else { view = "start"; renderStart(); if (!$ov.innerHTML) Speech.auto("start" + (kid().earnedToday >= ECON.dailyCap ? ":full" : ""), startText()); } }

/* ---------- input: buttons ---------- */
const ACTS = {
  tier(el) { const n = +el.dataset.tier, t = trip(); Sound.tap(); if (t && t.tier === n && t.i < GAME.pondsPerTrip) openPond(true); else startTrip(n); },
  leave() { Speech.stop(); if (history.state && history.state.s === "pond") history.back(); else { view = "start"; render(); } },
  toggleRead() { kid().noRead = !noRead(); Store.save(); render(); Speech.say(young() ? "Younger mode on! Pictures and talking." : "Younger mode off. Words and all the ponds.", true); },
  toggleSound() { kid().sound = !soundOn(); Store.save(); if (!soundOn()) Speech.stop(); render(); },
  grown() { showGrown(); }, closeOv() { $ov.innerHTML = ""; render(); },
  hint() { hint(); },
  clearAll() { if (busy) return; trip().placed = {}; sel = null; Store.save(); Sound.tap(); render(); },
  rot(el) { rotate(+el.dataset.ti); },
  say(el) { speakOrNudge(pondText(), el); },
  sayZone(el) { speakOrNudge(el.dataset.say, el); },
  nextPond() { $ov.innerHTML = ""; openPond(false); },
  again() { $ov.innerHTML = ""; startTrip(recTier()); },
  home() { $ov.innerHTML = ""; ACTS.leave(); },
};
let lastNav = 0;
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled && ACTS[el.dataset.act]) {
    const nav = ["tier", "leave", "nextPond", "again", "home", "closeOv", "grown"].includes(el.dataset.act);
    if (nav && Date.now() - lastNav < 350) return;  // double-tap must not also hit the next screen
    if (nav) lastNav = Date.now();
    if (young() && !["say", "sayZone", "toggleRead"].includes(el.dataset.act) && el.getAttribute("aria-label")) Speech.say(el.getAttribute("aria-label"));   // talking buttons
    ACTS[el.dataset.act](el); return;
  }
});
/* Tap any picture with data-say (avatar, token jar, story strip) to hear it. */
document.addEventListener("pointerup", e => { const el = e.target.closest("[data-say]"); if (el && !el.closest("[data-act]") && !drag) speakOrNudge(el.dataset.say, el); });
/* tap-to-place: piece selected, then tap a gap. Uses pointer events because iOS Safari sends no click for plain divs. */
let downSlot = null;
document.addEventListener("pointerdown", e => { const s = e.target.closest("[data-slot]"); downSlot = s && !e.target.closest("[data-piece]") ? s : null; }, true);
document.addEventListener("pointerup", e => {
  const slot = e.target.closest("[data-slot]"), was = downSlot; downSlot = null;
  if (!slot || slot !== was || view !== "pond" || busy || sel === null || $ov.innerHTML || e.target.closest("[data-piece]")) return;
  const r = trayRect(sel); tryPlace(sel, +slot.dataset.slot, r ? { x: r.left + r.width / 2, y: r.top + r.height / 2 } : null, null);
});

/* ---------- input: drag with snap (pointer events: finger, pencil, or mouse) ---------- */
let drag = null;
document.addEventListener("pointerdown", e => {
  const pc = e.target.closest("[data-piece]");
  if (!pc || view !== "pond" || busy || $ov.innerHTML || e.target.closest(".rot")) return;
  e.preventDefault();
  const r = pc.getBoundingClientRect();
  drag = { ti: +pc.dataset.piece, from: pc.dataset.from, el: pc, x0: e.clientX, y0: e.clientY, ox: e.clientX - r.left, oy: e.clientY - r.top, w: r.width, home: r, moving: false, ghost: null, id: e.pointerId, target: null };
  try { pc.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
});
document.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moving && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) {
    drag.moving = true; Sound.lift();
    const size = Math.max(drag.w, parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--p")) || 72);
    const g = document.createElement("div"); g.className = "dragghost"; g.style.width = g.style.height = size + "px";
    g.innerHTML = plankSVG(maskOf(drag.ti)); document.body.appendChild(g); drag.ghost = g; drag.size = size;
    drag.el.classList.add("lifted"); drag.el.style.opacity = ".25";
  }
  if (drag.moving) {
    const s = drag.size;
    drag.ghost.style.transform = `translate(${e.clientX - s / 2}px,${e.clientY - s / 2 - (e.pointerType === "touch" ? s * 0.35 : 0)}px) rotate(-4deg) scale(1.08)`;
    const tgt = nearestSlot(e.clientX, e.clientY - (e.pointerType === "touch" ? s * 0.35 : 0));
    if (tgt !== drag.target) {
      document.querySelectorAll(".cell.target").forEach(c => c.classList.remove("target"));
      if (tgt !== null) document.querySelector(`[data-slot="${tgt}"]`)?.classList.add("target");
      drag.target = tgt;
    }
  }
});
async function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  document.querySelectorAll(".cell.target").forEach(c => c.classList.remove("target"));
  if (!d.moving) {          // a tap
    if (d.from !== "tray") return takeBack(+d.from);   // tap a placed piece: it slides back to the tray
    sel = sel === d.ti ? null : d.ti; Sound.lift(); render(); return;
  }
  const gr = d.ghost.getBoundingClientRect(), pt = { x: gr.left + gr.width / 2, y: gr.top + gr.height / 2 };
  if (cancelled || d.target === null) {
    if (d.from !== "tray" && !cancelled) { d.ghost.remove(); return takeBack(+d.from); }   // dragged off the board: back to the tray
    await slideBack(d.ghost, d.home); d.el.style.opacity = ""; d.el.classList.remove("lifted"); return;
  }
  if (d.from !== "tray" && +d.from === d.target) { d.ghost.remove(); d.el.style.opacity = ""; d.el.classList.remove("lifted"); animateIn(d.target, pt); return; }
  await tryPlace(d.ti, d.target, pt, d.ghost);
  if (d.el.isConnected) { d.el.style.opacity = ""; d.el.classList.remove("lifted"); }
}
document.addEventListener("pointerup", e => endDrag(e, false));
document.addEventListener("pointercancel", e => endDrag(e, true));

window.addEventListener("popstate", () => { if (view === "pond") { Speech.stop(); $ov.innerHTML = ""; view = "start"; render(); } });
window.addEventListener("storage", e => {
  if (e.key === GAME.mainKey) { me = readMainProfile(); if (!busy) render(); }
  else if (e.key === GAME.storageKey && !$ov.innerHTML && !busy) { Store.load(); render(); }
});
let rz = 0; window.addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (busy) return; if (view === "pond" && layoutKey() !== wasCompact) render(); else fitBoard(); }); });

Store.load();
{ const t = trip(); if (t && t.i < GAME.pondsPerTrip) openPond(true); else render(); }
</script>
