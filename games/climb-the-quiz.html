<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Offline-only: the page may not load anything from anywhere (no fonts, images, scripts, or fetches). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7c4dff">
<title>Climb the Quiz · Elzee</title>
<style>
:root{
  --bg:#fff8e7; --ink:#2d2a4a; --muted:#7a7699; --card:#fff; --line:#e7e2f5;
  --brand:#7c4dff; --brand-d:#5a2fd6; --brand-l:#efe9ff;
  --good:#3ccf4e; --good-d:#2a9d38; --good-l:#e6fbe9;
  --oops:#ff9f43; --oops-d:#e07b15; --oops-l:#fff3e3;
  --gold:#ffc83d; --gold-d:#e0a400;
  --radius:22px;
  --font:"Fredoka","Chalkboard SE","Comic Sans MS","Arial Rounded MT Bold",system-ui,sans-serif;
  /* game-specific */
  --sky1:#ffe9f3; --sky2:#d8f6ff; --glow:#fff36b; --rail:#d8d0f3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:20px;line-height:1.25;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:fixed;inset:0}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;flex:0 0 auto;z-index:20;background:rgba(255,248,231,.92)}
.iconbtn{width:64px;height:64px;border-radius:20px;border:none;background:#fff;font-size:30px;box-shadow:0 4px 0 var(--line);
  display:inline-flex;align-items:center;justify-content:center;text-decoration:none;flex:0 0 auto;position:relative}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.iconbtn.on{background:var(--brand-l);box-shadow:0 4px 0 #cbbcff}
.pill{height:64px;border-radius:20px;background:#fff;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;
  font-weight:700;font-size:22px;flex:0 1 auto;min-width:0}
.pill .av{width:44px;height:44px;border-radius:50%;background:var(--brand-l);overflow:hidden;display:flex;align-items:flex-start;justify-content:center;flex:0 0 auto}
.pill .av svg{width:44px;height:44px}
.pill .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.jarbar{display:inline-block;width:60px;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.jarbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.jar b{color:var(--gold-d)}
.spacer{flex:1 1 auto}
/* stage */
#stage{position:relative;flex:1 1 auto;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));transition:background 1s;touch-action:none}
#tower{position:absolute;bottom:0;top:0;transition:left .45s ease;will-change:left}
#world{position:absolute;left:0;bottom:0;width:100%;will-change:transform;transform-origin:50% 100%}
.band{position:absolute;left:0;width:100%;border-left:6px solid rgba(0,0,0,.06);border-right:6px solid rgba(0,0,0,.06)}
.band .fnum{position:absolute;left:10px;top:10px;font-weight:700;font-size:24px;color:rgba(45,42,74,.45);background:rgba(255,255,255,.55);
  border-radius:14px;padding:2px 10px}
.band.dark .fnum{color:rgba(255,255,255,.75);background:rgba(255,255,255,.12)}
.band .deco{position:absolute;font-size:34px;opacity:.55}
.band .win{position:absolute;width:42px;height:54px;border-radius:21px 21px 8px 8px;background:rgba(255,255,255,.55);box-shadow:inset 0 -6px 0 rgba(0,0,0,.06)}
.band.dark .win{background:rgba(255,236,150,.35)}
.ground{position:absolute;left:-200px;right:-200px;height:400px;background:linear-gradient(#8fd16a,#6cb14a);border-top:8px solid #5ea33d}
.pad,.plat,.ledge{position:absolute;left:0;bottom:0;will-change:transform}
.slab{height:22px;border-radius:14px;background:var(--pc);box-shadow:0 7px 0 var(--pd);position:relative}
.slab::after{content:"";position:absolute;left:10%;right:10%;top:4px;height:5px;border-radius:9px;background:rgba(255,255,255,.45)}
.plat .hit{position:absolute;left:-28px;right:-28px;top:-90px;bottom:-34px}
.plat.next .slab{animation:readyGlow 1s ease-in-out infinite}
.plat.next.ready .slab{outline:5px solid var(--glow);outline-offset:3px;box-shadow:0 7px 0 var(--pd),0 0 26px 8px rgba(255,243,107,.9)}
.plat.next.ready .arrow{opacity:1}
.plat .arrow{position:absolute;left:50%;top:-58px;width:40px;margin-left:-20px;font-size:34px;text-align:center;opacity:0;transition:opacity .15s;animation:bob 0.9s ease-in-out infinite;pointer-events:none}
.plat.wait .slab{animation:wiggle .35s 1}
.plat.jelly .slab{border-radius:20px 20px 14px 14px;height:26px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.6),transparent 40%),var(--pc)}
.plat.jelly.squish .slab{animation:jellySquish .6s ease-out}
.plat.spinner .slab::before,.plat.spinner2 .slab::before{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:rgba(255,255,255,.8)}
.plat.moving .slab,.plat.moving2 .slab{background:repeating-linear-gradient(90deg,var(--pc) 0 18px,color-mix(in srgb,var(--pc),#fff 25%) 18px 36px)}
.ledge .slab{height:28px}
.gatebox{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:132px;height:150px;pointer-events:none}
.arch{position:absolute;inset:0;border-radius:66px 66px 6px 6px;background:var(--pd);box-shadow:inset 0 0 0 8px rgba(255,255,255,.35)}
.door{position:absolute;bottom:0;width:50%;height:84%;background:linear-gradient(#ffe7a8,#ffc83d);border:4px solid #e0a400;transition:transform .5s ease;transform-origin:left center}
.door.l{left:8%;width:42%;border-radius:40px 0 4px 4px;transform-origin:left center}
.door.r{right:8%;width:42%;border-radius:0 40px 4px 4px;transform-origin:right center}
.gatebox.open .door.l{transform:perspective(300px) rotateY(80deg)}
.gatebox.open .door.r{transform:perspective(300px) rotateY(-80deg)}
.gatebox .gicon{position:absolute;left:50%;top:-50px;background:#fff;border-radius:50%;width:54px;height:54px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.12);transform:translateX(-50%);font-size:34px;z-index:2}
.gatebox.locked .gicon{animation:pulse 1.4s ease-in-out infinite}
.gatebox.wig{animation:wiggle .4s 2}
.ladder{position:absolute;left:0;bottom:0;width:46px;background:repeating-linear-gradient(transparent 0 16px,#c98d5b 16px 24px);
  border-left:7px solid #a26a3d;border-right:7px solid #a26a3d;border-radius:6px}
.flagpole{position:absolute;bottom:26px;width:8px;height:150px;background:#7a7699;border-radius:4px}
.flagpole .cloth{position:absolute;left:8px;top:6px;width:64px;height:42px;background:var(--gold);clip-path:polygon(0 0,100% 50%,0 100%);transform-origin:left center;transition:transform .6s}
.flagpole.down .cloth{top:100px;transform:scaleX(.6)}
.flagpole.up .cloth{animation:flap 1s ease-in-out infinite}
.restbuddy{position:absolute;bottom:26px;width:84px;height:84px}
.restbuddy svg{width:100%;height:100%}
.restbuddy.cheer{animation:dance .6s ease-in-out infinite}
.reward{position:absolute;bottom:200px;width:70px;height:70px;margin-left:-35px;font-size:50px;display:flex;align-items:center;justify-content:center;
  background:#fff;border-radius:50%;box-shadow:0 0 0 6px var(--gold),0 6px 0 6px var(--gold-d)}
.reward.got{opacity:.35;filter:grayscale(1)}
.summit{position:absolute;left:50%;width:220px;margin-left:-110px;height:240px}
.summit .spire{position:absolute;left:30px;right:30px;bottom:0;height:200px;background:linear-gradient(var(--gold),#ffe08a);clip-path:polygon(50% 0,100% 100%,0 100%)}
.summit .crown{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:64px;animation:bob 1.4s ease-in-out infinite}
/* hero */
#hero{position:absolute;left:0;bottom:0;z-index:5;pointer-events:none;will-change:transform}
#hero .face{width:100%;height:100%;transition:transform .15s}
#hero .squash{width:100%;height:100%;transform-origin:50% 100%}
#hero .bubble{position:absolute;left:50%;top:-56px;margin-left:-28px;width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 4px 0 var(--line);
  font-size:32px;display:flex;align-items:center;justify-content:center;animation:pop .3s}
.avh{width:100%;height:100%}
.avh svg{width:100%;height:100%;overflow:visible;display:block}
/* controls */
.controls{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;padding:8px 12px 10px;z-index:20;background:rgba(255,248,231,.92);min-height:116px}
.jumpbtn{width:180px;height:96px;border-radius:30px;border:none;background:var(--brand);color:#fff;font-size:52px;font-weight:700;
  box-shadow:0 7px 0 var(--brand-d);display:flex;align-items:center;justify-content:center;gap:6px;touch-action:none}
.jumpbtn.held,.jumpbtn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--brand-d)}
.jumpbtn.ready{animation:glow 1.2s ease-in-out infinite}
.jumpbtn .dir{font-size:40px}
.controls.hide .jumpbtn{visibility:hidden}
.ctlhint{font-size:18px;color:var(--muted);max-width:220px}
/* gate panel */
#gate{position:absolute;z-index:12;background:var(--bg);box-shadow:0 -6px 30px rgba(45,42,74,.25);display:flex;flex-direction:column;gap:10px;padding:14px;
  transition:transform .3s ease}
#gate.hidden{display:none}
.portrait #gate{left:0;right:0;bottom:0;height:60%;border-radius:30px 30px 0 0}
.landscape #gate{right:0;top:0;bottom:0;width:56%;border-radius:30px 0 0 30px}
#gate.wig{animation:wiggle .4s 2}
.prompt{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:22px;box-shadow:0 5px 0 var(--line);padding:10px 12px;flex:0 0 auto}
.prompt .ptxt{flex:1 1 auto;min-width:0}
.prompt .pic{font-size:44px;line-height:1.15;letter-spacing:4px}
.prompt .q{font-size:20px}
.prompt .ask{font-size:22px;font-weight:700;color:var(--brand-d);margin-top:4px}
.prompt .say{flex:0 0 auto}
.garea{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative}
.gfoot{flex:0 0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:64px}
.btn{min-height:64px;border:none;border-radius:20px;padding:0 22px;font-size:24px;font-weight:700;background:var(--good);color:#fff;
  box-shadow:0 5px 0 var(--good-d);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--good-d)}
.btn.brand{background:var(--brand);box-shadow:0 5px 0 var(--brand-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.big{min-height:84px;font-size:30px;padding:0 34px;border-radius:26px}
.btn.hoot{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
/* doors */
.doors{display:flex;gap:12px;justify-content:center;align-items:stretch;width:100%;flex-wrap:nowrap}
.dchoice{flex:1 1 0;max-width:190px;min-width:0;min-height:170px;border:none;border-radius:60px 60px 14px 14px;background:linear-gradient(#ffe7a8,#ffc83d);
  border:5px solid #e0a400;box-shadow:0 6px 0 #c08a00;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 6px;position:relative}
.dchoice .em{font-size:52px;line-height:1}
.dchoice .lb{font-size:18px;font-weight:700;line-height:1.15;word-break:break-word}
.dchoice .knob{position:absolute;right:14px;top:55%;width:12px;height:12px;border-radius:50%;background:#a26a3d}
.dchoice.good{background:linear-gradient(#e6fbe9,#a8efb3);border-color:var(--good-d);animation:pop .4s}
.dchoice.bad{animation:wiggle .4s 2;filter:saturate(.6)}
.dchoice.reveal{outline:6px solid var(--good);outline-offset:3px;animation:glow 1s ease-in-out infinite}
.minisay{position:absolute;top:-8px;right:-8px;width:64px;height:64px;border-radius:50%;border:none;background:#fff;box-shadow:0 3px 0 var(--line);font-size:26px;
  display:flex;align-items:center;justify-content:center}
/* bridge */
.bridge{display:flex;align-items:flex-end;justify-content:center;gap:0;position:relative;padding:0 30px 26px;max-width:100%}
.bridge::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:14px;border-radius:7px;background:#a26a3d;z-index:0}
.bridge .post{width:24px;height:110px;background:#c98d5b;border-radius:8px;box-shadow:inset -5px 0 0 #a26a3d;flex:0 0 auto;z-index:1}
.plank{width:var(--tile,96px);height:var(--tile,96px);margin:0 4px;border-radius:18px;background:#fff;box-shadow:0 6px 0 #c98d5b;border:4px solid #e2b07e;
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--tile,96px) * .5);z-index:1;position:relative}
.plank.slot{background:rgba(255,255,255,.4);border:5px dashed var(--brand);box-shadow:none;color:var(--brand)}
.plank.slot.hover,.seat.hover{background:var(--brand-l);transform:scale(1.06)}
.plank.slot.filled{border-style:solid;border-color:var(--good);background:var(--good-l)}
.plank.slot.wig{animation:wiggle .4s 2}
.plank.pocket{margin-left:16px}
.bridge.done .plank{animation:wave .5s ease-in-out backwards}
.tray{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;background:#fff;border-radius:24px;box-shadow:0 5px 0 var(--line);padding:12px;min-height:110px;align-items:center;max-width:100%}
.chip{min-width:96px;min-height:96px;border:none;border-radius:22px;background:var(--brand-l);box-shadow:0 5px 0 #cbbcff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:6px 12px;touch-action:none;gap:2px;position:relative}
.chip .em{font-size:44px;line-height:1}
.chip .lb{font-size:18px;font-weight:700;max-width:180px}
.chip.ghost{opacity:.25}
.chip.bad{animation:wiggle .4s 2}
.dragging{position:fixed!important;z-index:100;pointer-events:none;transform:scale(1.08) rotate(-3deg);box-shadow:0 14px 24px rgba(45,42,74,.3)!important;margin:0!important}
.seatrow{display:flex;gap:14px;justify-content:center;align-items:flex-end}
.seatrow.stack{flex-direction:column-reverse;gap:8px}
.seat{width:104px;height:104px;border-radius:22px;background:#fff;border:5px dashed var(--brand);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative}
.seat .hero{position:absolute;top:-30px;right:-18px;font-size:44px}
.seat.goodseat{border-style:solid;border-color:var(--good);background:var(--good-l)}
.seat.wig{animation:wiggle .4s 2}
/* jars */
.jars{display:flex;gap:30px;justify-content:center;align-items:flex-end}
.jarbtn{width:170px;height:190px;border:none;border-radius:30px 30px 46px 46px;background:linear-gradient(rgba(255,255,255,.8),rgba(239,233,255,.95));border:6px solid #cbbcff;
  box-shadow:0 7px 0 #b3a1f0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.jarbtn::before{content:"";position:absolute;top:-20px;left:18%;right:18%;height:22px;border-radius:10px;background:#cbbcff}
.jarbtn .em{font-size:66px;line-height:1}
.jarbtn .lb{font-size:22px;font-weight:700}
.jarbtn.hover{transform:scale(1.06);border-color:var(--brand)}
.jarbtn.good{border-color:var(--good);animation:liftUp .9s ease-in-out}
.jarbtn.bad{animation:wiggle .4s 2}
.jarbtn.reveal{outline:6px solid var(--good);outline-offset:4px;animation:glow 1s ease-in-out infinite}
.speech{background:#fff;border-radius:26px;padding:12px 18px;box-shadow:0 6px 0 var(--line);border:4px solid var(--line);display:flex;align-items:center;gap:10px;max-width:92%;touch-action:none;position:relative}
.speech .em{font-size:48px;letter-spacing:4px;white-space:nowrap}
.speech .lb{font-size:19px}
.speech::after{content:"";position:absolute;left:34px;bottom:-18px;border:10px solid transparent;border-top-color:#fff}
/* switch */
.switch{width:min(520px,100%);display:flex;flex-direction:column;align-items:center;gap:14px}
.rail{position:relative;width:100%;height:200px}
.rail .track{position:absolute;left:10%;right:10%;top:70%;height:24px;margin-top:-12px;border-radius:12px;background:var(--rail);box-shadow:inset 0 4px 0 rgba(0,0,0,.08)}
.stop{position:absolute;top:70%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:none;background:#fff;box-shadow:0 5px 0 var(--line);font-size:48px;display:flex;align-items:center;justify-content:center}
.stop .lb{position:absolute;top:100%;margin-top:8px;font-size:17px;font-weight:700;white-space:nowrap;color:var(--muted)}
.knob{position:absolute;top:22%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:var(--brand);box-shadow:0 6px 0 var(--brand-d),0 0 0 6px rgba(255,255,255,.7);
  touch-action:none;transition:left .25s ease,top .25s ease;z-index:2;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff}
.knob.drag{transition:none}
.knob.set{top:70%}
.knob.bad{animation:wiggle .4s 2}
.knob.good{background:var(--good);box-shadow:0 6px 0 var(--good-d),0 0 0 6px rgba(255,255,255,.7)}
.elev{font-size:48px;transition:transform .8s ease}
.elev.up{transform:translateY(-40px)}
/* reveal / why */
.why{background:var(--good-l);border:4px solid var(--good);border-radius:22px;padding:10px 14px;font-size:20px;display:flex;align-items:center;gap:12px;animation:pop .35s}
.why .em{font-size:40px}
/* overlays */
#ov:empty{display:none}
#ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(45,42,74,.35)}
#ov.clear{background:transparent;pointer-events:none}
#ov.clear .panel{pointer-events:auto}
.panel{background:var(--bg);border-radius:30px;padding:20px;max-width:640px;width:100%;max-height:calc(100% - 8px);overflow:hidden;text-align:center;
  box-shadow:0 10px 40px rgba(45,42,74,.35);animation:pop .35s;display:flex;flex-direction:column;gap:12px;align-items:center}
.panel h1{margin:0;font-size:34px}
.panel h2{margin:0;font-size:26px}
.panel p{margin:0}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.swatch{width:64px;height:64px;border-radius:50%;border:5px solid #fff;box-shadow:0 4px 0 var(--line);background:var(--c)}
.swatch.on{outline:5px solid var(--brand);outline-offset:2px}
.hatbtn{width:76px;height:76px;border-radius:20px;border:none;background:#fff;box-shadow:0 4px 0 var(--line);padding:4px}
.hatbtn svg{width:100%;height:100%}
.hatbtn.on{outline:5px solid var(--brand);outline-offset:2px;background:var(--brand-l)}
.bigav{width:130px;height:195px}
.bigav svg{width:100%;height:100%}
.prog{width:100%;max-width:420px;height:28px;border-radius:14px;background:var(--line);position:relative;overflow:visible}
.prog i{display:block;height:100%;border-radius:14px;background:linear-gradient(90deg,var(--brand),var(--gold));transition:width 1s}
.prog .end{position:absolute;right:-18px;top:50%;transform:translateY(-50%);font-size:36px;background:#fff;border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--gold)}
.coins{font-size:34px;font-weight:700;color:var(--gold-d)}
.note{background:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 var(--line);font-size:18px;text-align:left}
.info{overflow:auto;text-align:left;max-height:70vh}
.holdbtn{position:relative;overflow:hidden}
.holdbtn i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,93,108,.35)}
#banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:15;pointer-events:none}
#banner .b{background:#fff;border-radius:22px;padding:10px 20px;box-shadow:0 5px 0 var(--line);font-size:26px;font-weight:700;animation:pop .35s;white-space:nowrap}
#fx{position:absolute;inset:0;pointer-events:none;z-index:14;overflow:hidden}
.float{position:absolute;font-size:34px;font-weight:800;color:var(--gold-d);text-shadow:0 2px 0 #fff;animation:floatUp 1.4s ease-out forwards}
.conf{position:absolute;top:-30px;width:14px;height:20px;border-radius:4px;animation:fall var(--d,2.4s) linear forwards}
.spark{position:absolute;width:12px;height:12px;border-radius:50%;animation:burst 1.1s ease-out forwards}

    if (el.classList.contains("chip") && !el.dataset.hero) { const sl = $("#gate .plank.slot"); play.gate.locked = true; fly(el, sl).then(() => { play.gate.locked = false; commit(+el.dataset.pick, el, sl); }); }
    else if (el.dataset.stop) setKnob(+el.dataset.stop, true);
    else el.click();
    return;
  }
  if (play && play.gate && !play.gate.locked && play.gate.gate === "switch" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    play.gate.pos = Math.max(0, Math.min(2, play.gate.pos + (e.key === "ArrowLeft" ? -1 : 1))); $("#knob").style.left = 10 + play.gate.pos * 40 + "%"; return;
  }
  if (play && play.gate && play.gate.gate === "switch" && e.key === "Enter" && !play.gate.locked) { setKnob(play.gate.pos, true); return; }
  if ([" ", "ArrowUp", "w", "W"].includes(e.key) || (e.key === "Enter" && !(document.activeElement && document.activeElement.tagName === "BUTTON"))) {
    if (tapSkip) { tapSkip(); e.preventDefault(); return; }
    if (view === "climb" && play && !play.gate) { e.preventDefault(); jumpHeld = true; tryJump(false); }
  }
});
document.addEventListener("keyup", e => { if ([" ", "ArrowUp", "w", "W", "Enter"].includes(e.key)) jumpHeld = false; });
/* hold-to-confirm (grown-up reset; standalone only, never in Elzee kid view) */
let hold = null;
document.addEventListener("pointerdown", e => {
  const el = e.target.closest("[data-hold]"); if (!el) return;

      const k = kid(); k.floor = 0; k.climbs = 0; k.unlocks = []; k.mid = null; k.showMeUsed = false;   // keeps today's earned count + lifetime
      Store.save(); $("#ov").innerHTML = ""; showStart();
    }
  }, 50);
});
const stopHold = () => { if (hold) { clearInterval(hold); hold = null; $$("[data-hold] i").forEach(b => (b.style.width = "0")); } };
document.addEventListener("pointerup", stopHold); document.addEventListener("pointercancel", stopHold);
window.addEventListener("resize", () => {
  if (view === "boot") return;
  const m = play && play.mid;
  renderWorld();
  if (view === "climb" && m) { const fl = Math.min(m.floor, TOWER.floors); H.tw = null; placeHeroAtStep(fl, m.phase === "gate" ? 99 : m.phase === "finish" ? 0 : m.step); if (play.gate && !play.gate.locked) renderGatePanel(); play.busy = false; }
  else if (view === "start") placeHeroAtStep(Math.min(TOWER.floors, kid().floor + 1), 0);
  renderControls();
});
window.addEventListener("storage", e => {
  if (e.key === GAME.mainKey) { const was = me.id; me = readMainProfile(); if (me.id !== was && !URLP.elzee) { Store.load(); showStart(); } else renderTop(); }
});
window.addEventListener("popstate", () => {
  if (exiting) return;
  if ($("#ov").innerHTML && !$("#finishCard") && !$("#startCard") && view !== "error") { $("#ov").innerHTML = ""; history.pushState({ cq: "x" }, ""); return; }
  if (URLP.elzee) { const m = play && play.mid; exitTo(m && m.phase === "finish" ? "done" : "quit"); return; }
  if (view === "climb") { closeGateQuiet(); showStart(); }
});
setInterval(() => { if (view === "climb" && play && play.mid.phase === "climb" && play.mid.step === 0 && !play.busy) checkBudget(true); }, 2000);

/* ---------- boot ---------- */
function boot() {
  Store.load(); kid(); Store.save();
  buildShell();
  if (URLP.elzee) { history.replaceState({ cq: "root" }, ""); history.pushState({ cq: "game" }, ""); }
  const pk = loadPack();

  realPack = pk.pack || null;

window.__climb = { get play() { return play; }, get view() { return view; }, kid, LAY, URLP, GAME, ECON, TOWER, AvatarAdapter, noRead, autoRead, youngerMode, GENTLE, get me() { return me; }, get spoken() { return Speech.log.slice(); }, get audioState() { return Sound.ctx ? Sound.ctx.state : null; } };   // test hook (read only)
