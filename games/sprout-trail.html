<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Offline-only: the page may not load anything from anywhere (no fonts, images, scripts, or fetches). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7c4dff">
<title>Sprout Trail · Elzee</title>
<style>
/* Visual language matches Elzee (lq-site/index.html) and Squish Seats: cream background, purple brand, chunky 3D buttons. */
:root{
  --bg:#fff8e7; --ink:#2d2a4a; --muted:#7a7699; --card:#fff; --line:#e7e2f5;
  --brand:#7c4dff; --brand-d:#5a2fd6; --brand-l:#efe9ff;
  --good:#3ccf4e; --good-d:#2a9d38; --good-l:#e6fbe9;
  --oops:#ff9f43; --oops-d:#e07b15; --oops-l:#fff3e3;
  --gold:#ffc83d; --gold-d:#e0a400;
  --grass:#bfe9a0; --grass-d:#94cf6f; --soil:#e9c99a; --soil-d:#c99c66; --water:#7fd0ff; --water-d:#3fa6e6;
  --radius:22px;
  --font:"Fredoka","Chalkboard SE","Comic Sans MS","Arial Rounded MT Bold",system-ui,sans-serif;
  --cell:80px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:20px;line-height:1.3;overflow:hidden;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0}
#app{max-width:1180px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 16px)}
.hidden{display:none!important}

/* buttons (same as Squish Seats) */
.btn{border:none;border-radius:18px;padding:12px 24px;min-height:64px;min-width:64px;font-size:23px;font-weight:600;
  background:var(--good);color:#fff;box-shadow:0 5px 0 var(--good-d);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--good-d)}
.btn.brand{background:var(--brand);box-shadow:0 5px 0 var(--brand-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn[disabled]{background:#d9d6e6;box-shadow:0 5px 0 #bdb9cf;color:#fff}
.btn .ico{font-size:30px;line-height:1}
.iconbtn{border:none;background:#fff;border-radius:18px;width:60px;height:60px;font-size:30px;flex:none;
  box-shadow:0 4px 0 var(--line);display:inline-flex;align-items:center;justify-content:center;position:relative;text-decoration:none}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.iconbtn.on{background:var(--brand-l);box-shadow:0 4px 0 #cbbcff}

/* top bar */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px;min-height:56px;
  font-size:22px;font-weight:700;box-shadow:0 4px 0 var(--line)}
.pill .av{font-size:32px}
.pill .nm{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jar{display:inline-flex;align-items:center;gap:8px}
.jar b{color:var(--gold-d)}
.jarbar{width:90px;height:16px;border-radius:99px;background:#f1edfa;overflow:hidden}
.jarbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.spacer{flex:1}
.lvpill{font-size:26px}

/* map */
.mapwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.hero{display:flex;align-items:center;gap:14px;flex:none}
.hero .buds{display:flex;gap:2px}
.hero .buds svg{width:62px;height:62px;animation:bob 2.4s ease-in-out infinite}
.hero .buds svg:nth-child(2){animation-delay:.3s}.hero .buds svg:nth-child(3){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-6px)}}
.bubble{background:#fff;border-radius:20px;padding:12px 18px;box-shadow:0 4px 0 var(--line);font-size:21px;flex:1}
.levels{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:minmax(0,1fr);gap:16px;max-height:420px}
@media (orientation:portrait){.levels{grid-template-columns:repeat(4,1fr);max-height:640px}}
.lvl{position:relative;border:none;background:#fff;border-radius:24px;box-shadow:0 6px 0 var(--line);min-height:120px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px}
.lvl:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.lvl .scene{font-size:54px;line-height:1}
.lvl .num{position:absolute;top:8px;left:12px;font-weight:700;color:var(--muted);font-size:20px}
.lvl .tw{position:absolute;top:6px;right:8px;font-size:15px;font-weight:700;background:var(--gold);color:var(--ink);border-radius:99px;padding:2px 8px}
.lvl .gsize{font-size:14px;color:var(--muted)}
.lvl .stars{font-size:22px;letter-spacing:2px}
.lvl.locked{background:#eeebf6;box-shadow:0 6px 0 #d9d6e6}
.lvl.locked .scene{filter:grayscale(1);opacity:.35}
.lvl.next{outline:5px solid var(--brand);outline-offset:-5px;animation:glow 1.6s ease-in-out infinite}
.lvl .scene.egg{display:inline-block;animation:eggidle 4.6s ease-in-out infinite}
@keyframes glow{50%{outline-color:#b9a2ff}}
.nostar{filter:grayscale(1);opacity:.3}

/* play */
.playwrap{flex:1;min-height:0;display:grid;gap:12px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"rules" "board" "ctrls"}
@media (orientation:landscape){
  .playwrap{grid-template-columns:minmax(250px,30%) 1fr;grid-template-rows:auto 1fr;grid-template-areas:"rules board" "ctrls board"}
  .playwrap .ctrls{flex-wrap:wrap;align-content:flex-start}
  .playwrap .rules{flex-direction:column;align-items:stretch}
}
.rules{grid-area:rules;display:flex;gap:10px;flex-wrap:wrap}
.rule{background:#fff;border-radius:18px;box-shadow:0 4px 0 var(--line);padding:8px 12px;display:flex;align-items:center;gap:8px;min-height:60px;flex:1 1 auto}
.rule .ric{display:flex;align-items:center;gap:4px;font-size:28px;flex:none}
.rule .rtx{font-size:17px;line-height:1.2}
.rule.newr{border:3px solid var(--gold)}
.mt{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:var(--grass);box-shadow:inset 0 -3px 0 var(--grass-d);font-size:20px;position:relative}
.mt svg{width:100%;height:100%}
.ar{font-size:22px;color:var(--brand-d);font-weight:700}
.ctrls{grid-area:ctrls;display:flex;gap:12px}
.ctrls .btn{flex:1}
.boardbox{grid-area:board;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;position:relative}
.cam{position:relative}
.board{position:relative;width:calc(var(--cell) * var(--w));height:calc(var(--cell) * var(--h));background:#8bc96a;border-radius:calc(var(--cell) * .28);
  box-shadow:0 8px 0 #6aa84c, 0 0 0 8px #8bc96a;touch-action:none}
.cell{position:absolute;width:var(--cell);height:var(--cell);padding:calc(var(--cell) * .045)}
.tile{width:100%;height:100%;border-radius:calc(var(--cell) * .2);background:var(--grass);box-shadow:inset 0 calc(var(--cell) * -.07) 0 var(--grass-d);
  position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell) * .5);line-height:1;transition:background-color .2s}
.cell.rock .tile{background:#a9b0bd;box-shadow:inset 0 calc(var(--cell) * -.07) 0 #858c99}
/* streams: chevrons slide along forever */
.cell.stream .tile{background:var(--water);box-shadow:inset 0 calc(var(--cell) * -.07) 0 var(--water-d);overflow:hidden}
.chev{width:100%;height:100%}
.flowg{animation:flow .9s linear infinite}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(14px)}}
.cell.burrow .tile svg{width:86%;height:86%;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cell.stage .tile{box-shadow:inset 0 calc(var(--cell) * -.07) 0 var(--grass-d), inset 0 0 0 calc(var(--cell) * .05) var(--gold)}
.stage .pips{position:absolute;left:7%;top:5%;font-size:calc(var(--cell) * .13);color:var(--brand-d);letter-spacing:1px}
.sg{display:inline-block;transform-origin:50% 85%}
/* the seed you need next wiggles: "pick me!" */
.cell.want .sg{animation:seedwig 1.3s ease-in-out infinite}
@keyframes seedwig{0%,50%,100%{transform:rotate(0) scale(1)}60%{transform:rotate(-12deg) scale(1.15)}70%{transform:rotate(10deg) scale(1.15)}80%{transform:rotate(-6deg) scale(1.08)}90%{transform:rotate(3deg) scale(1.02)}}
.cell.want .tile{box-shadow:inset 0 calc(var(--cell) * -.07) 0 var(--grass-d), inset 0 0 0 calc(var(--cell) * .05) var(--gold), 0 0 calc(var(--cell) * .18) rgba(255,200,61,.9)}
.cell.visited .tile{background:var(--soil);box-shadow:inset 0 calc(var(--cell) * -.07) 0 var(--soil-d)}
.cell.visited.stream .tile{background:#9fd7f5}
.cell.visited.stage .tile{box-shadow:inset 0 calc(var(--cell) * -.07) 0 var(--soil-d), inset 0 0 0 calc(var(--cell) * .05) var(--good)}
/* buds sprout with a spring, then sway */
.bud{position:absolute;width:44%;height:44%;left:28%;top:22%;pointer-events:none;transform:scale(0);transform-origin:50% 100%}
.bud .budi{width:100%;height:100%;display:block;transform-origin:50% 100%}
.visited .bud{transform:scale(1);animation:sprout .6s cubic-bezier(.2,1.9,.4,1) backwards}
.visited .budi{animation:sway 2.6s ease-in-out .6s infinite alternate}
@keyframes sprout{0%{transform:scale(0) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.stage .bud,.burrow .bud,.stream .bud{left:54%;top:46%;width:38%;height:38%}
.fl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell) * .6);transform:scale(0);pointer-events:none;z-index:4}
.fli{display:inline-block;transform-origin:50% 90%;animation:sway 2.2s ease-in-out infinite alternate}
.bloom .fl{animation:bloom .55s cubic-bezier(.2,1.8,.4,1) forwards}
.bloom .bud{opacity:0}
@keyframes bloom{0%{transform:scale(0) rotate(-50deg)}100%{transform:scale(1) rotate(0)}}
.cell.next .tile::after{content:"";position:absolute;width:22%;height:22%;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 4px rgba(124,77,255,.35);animation:dot 1.2s ease-in-out infinite}
@keyframes dot{50%{transform:scale(1.3)}}
.cell.hint .tile{outline:calc(var(--cell) * .06) solid var(--gold);outline-offset:-2px}
/* nest + egg (idle wiggle now and then; cracks in stages on win) */
.cell.nest .tile{background:#ffe8b8;box-shadow:inset 0 calc(var(--cell) * -.07) 0 #e7c27a}
.nestsvg{width:92%;height:92%;overflow:visible}
.nest .egg{transform-origin:30px 44px;animation:eggidle 4.6s ease-in-out infinite}
@keyframes eggidle{0%,82%,100%{transform:rotate(0)}85%{transform:rotate(-9deg)}88%{transform:rotate(8deg)}91%{transform:rotate(-5deg)}94%{transform:rotate(2deg)}}
.crk{fill:none;stroke:#7a5233;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .22s ease-out}
.nest.crack1 .c1,.nest.crack2 .c1,.nest.crack2 .c2{stroke-dashoffset:0}
.eggtop{transform-origin:30px 24px;transition:transform .6s cubic-bezier(.2,.9,.3,1),opacity .5s .25s}
.nest.crack3 .eggtop{transform:translate(12px,-34px) rotate(55deg);opacity:0}
.nest.crack3 .crk{opacity:0}
.critter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell) * .8);transform:scale(0);pointer-events:none;z-index:6}
.nest.hatched .critter{animation:popout .7s cubic-bezier(.2,1.8,.4,1) forwards}
@keyframes popout{0%{transform:scale(0) translateY(20%)}100%{transform:scale(1.25) translateY(-28%)}}
.start .foot{font-size:calc(var(--cell) * .32);opacity:.5}
/* the vine grows behind the buddy, segment by segment, with leaves popping out */
.pathsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
.pathsvg line{fill:none;stroke-linecap:round}
.pathsvg line.vine{stroke:#4fae3c;stroke-width:.16;stroke-dasharray:1 1}
.pathsvg line.jump{stroke:#b07cff;stroke-width:.1;stroke-dasharray:.04 .08}
.pathsvg line.vine.grow{animation:vinegrow var(--d) linear backwards}
.pathsvg line.jump.grow{animation:fadein var(--d) ease-out backwards}
@keyframes vinegrow{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}}
.leaf{fill:#6fd05a;stroke:#3f9a35;stroke-width:.02;transform-box:fill-box;transform-origin:center}
.leaf.grow{animation:leafpop .45s cubic-bezier(.2,1.9,.4,1) backwards;animation-delay:var(--ld)}
@keyframes leafpop{from{transform:scale(0)}}
.board.done .pathsvg line.vine{stroke:#ff8fab;transition:stroke .6s}
.pt{position:absolute;left:0;top:0;width:calc(var(--cell) * .11);height:calc(var(--cell) * .07);border-radius:60% 0;background:#5cc04a;z-index:4;pointer-events:none}
.pt.drop{background:#e3f6ff;border-radius:50%;width:calc(var(--cell) * .09);height:calc(var(--cell) * .09);box-shadow:0 0 0 2px #7fd0ff}
/* the buddy: position (walker) > hop squash/stretch (hop) > idle bob/blink/dance (idle) */
.walker{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);z-index:5;pointer-events:none;padding:calc(var(--cell) * .06);transition:transform .17s cubic-bezier(.3,.7,.4,1)}
.walker .hop{width:100%;height:100%;transform-origin:50% 92%;transition:transform .14s, filter .14s}
.walker .idle{width:100%;height:100%;transform-origin:50% 92%;animation:wbob 2.2s ease-in-out infinite}
.walker svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 0 rgba(45,42,74,.18))}
.walker.held .hop{transform:translateY(-12%) scale(1.1);filter:drop-shadow(0 10px 6px rgba(45,42,74,.25))}
.walker.dance .idle{animation:dance .42s ease-in-out infinite alternate}
@keyframes wbob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-5%) scale(.97,1.03)}}
@keyframes dance{0%{transform:translateY(0) rotate(-10deg) scale(1.05,.95)}100%{transform:translateY(-16%) rotate(10deg) scale(.95,1.05)}}
.eyes{transform-box:fill-box;transform-origin:center}
.walker .eyes,.hero .eyes{animation:blink 3.8s infinite}
.hero .buds svg:nth-child(2) .eyes{animation-delay:1.3s}.hero .buds svg:nth-child(3) .eyes{animation-delay:2.1s}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.headring{position:absolute;width:var(--cell);height:var(--cell);z-index:2;pointer-events:none;border-radius:calc(var(--cell) * .24);
  box-shadow:inset 0 0 0 calc(var(--cell) * .05) rgba(124,77,255,.7);transition:transform .17s cubic-bezier(.3,.7,.4,1)}
.headring::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 calc(var(--cell) * .05) rgba(124,77,255,.55);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.92);opacity:.9}to{transform:scale(1.22);opacity:0}}
.board.done .headring{opacity:0}
/* level-1 coach: a hand that shows the drag */
.hand{position:absolute;z-index:8;font-size:52px;pointer-events:none;left:0;top:0}
.hand.tap{animation:point 1s ease-in-out infinite}
.hand.drag{animation:dragdemo 2.3s ease-in-out infinite}
@keyframes point{50%{transform:translateY(14px)}}
@keyframes dragdemo{0%{transform:translate(0,0) scale(1.2);opacity:0}10%{transform:translate(0,0) scale(1.2);opacity:1}20%{transform:translate(0,0) scale(.92)}
  50%{transform:translate(var(--x1),var(--y1)) scale(.92)}78%{transform:translate(var(--x2),var(--y2)) scale(.92);opacity:1}90%{transform:translate(var(--x2),var(--y2)) scale(1.2);opacity:0}100%{opacity:0}}
.ctrls .btn.wig{animation:btnwig .5s 3;outline:4px solid var(--oops)}
@keyframes btnwig{0%,100%{transform:rotate(0) scale(1)}30%{transform:rotate(-6deg) scale(1.06)}70%{transform:rotate(5deg) scale(1.06)}}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(45,42,74,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.panel{background:var(--bg);border-radius:28px;padding:22px;max-width:620px;width:100%;max-height:92vh;overflow:auto;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.12);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.panel h2{font-size:34px;margin-bottom:6px}
.bigstars{font-size:58px;letter-spacing:6px}
.bigstars span{display:inline-block;animation:pop .5s backwards}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.coins{font-size:30px;font-weight:700;color:var(--gold-d);margin:8px 0}
.winrow{display:flex;justify-content:center;align-items:flex-end;gap:10px}
.winrow .wb{width:96px;height:96px;animation:dance .5s ease-in-out infinite alternate}
.winrow .wc{font-size:96px;line-height:1;animation:dance .5s .25s ease-in-out infinite alternate}
.sticker{width:140px;height:140px;margin:8px auto;perspective:600px}
.sticker .inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:flip 1.1s .5s both}
@keyframes flip{0%{transform:rotateY(180deg)}100%{transform:rotateY(0)}}
.sticker .face,.sticker .back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;display:flex;align-items:center;justify-content:center}
.sticker .face{background:#fff;box-shadow:0 6px 0 var(--line);border:5px solid var(--gold);font-size:84px}
.sticker .back{background:var(--brand);transform:rotateY(180deg);font-size:60px;color:#fff}
.book{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:12px}
.book .slot{background:#fff;border-radius:20px;box-shadow:0 5px 0 var(--line);padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:110px;justify-content:center}
.book .slot .big{font-size:52px;line-height:1.1}
.book .slot.no .big{filter:grayscale(1) brightness(.4);opacity:.3}
.book .slot small{color:var(--muted);font-size:16px}
.muted{color:var(--muted)}
.left{text-align:left}
.note{background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 4px 0 var(--line);margin:10px 0;font-size:18px}
.newbadge{display:inline-block;background:var(--gold);border-radius:99px;padding:4px 16px;font-weight:700;font-size:24px;box-shadow:0 4px 0 var(--gold-d);animation:pop .5s}
.demo{position:relative;display:flex;gap:6px;justify-content:center;margin:18px auto 8px;width:max-content}
.demo .mt{width:90px;height:90px;border-radius:20px;font-size:48px}
.demo .mt.water{background:var(--water);box-shadow:inset 0 -6px 0 var(--water-d)}
.demo .mb{position:absolute;left:0;top:-6px;width:90px;height:90px;animation:var(--anim) 3s ease-in-out infinite}
.demo .mb svg{width:100%;height:100%}
@keyframes dStream{0%,15%{transform:translateX(0)}35%,45%{transform:translateX(96px)}65%,100%{transform:translateX(192px)}}
@keyframes dStage{0%,12%{transform:translateX(0)}30%,42%{transform:translateX(96px)}60%,100%{transform:translateX(192px)}}
@keyframes dBurrow{0%,15%{transform:translateX(0) scale(1)}30%{transform:translateX(96px) scale(1)}40%{transform:translateX(96px) scale(0)}55%{transform:translateX(288px) scale(0)}70%,100%{transform:translateX(288px) scale(1)}}
.burst{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:35;pointer-events:none}
.burst .rays{position:absolute;width:min(70vmin,560px);height:min(70vmin,560px);border-radius:50%;
  background:repeating-conic-gradient(rgba(255,200,61,.6) 0 12deg,rgba(255,255,255,0) 12deg 24deg);animation:spin 5s linear infinite}
.burst .bcw{position:relative}
.burst .bc{font-size:min(32vmin,220px);line-height:1;transform-origin:50% 90%;animation:critbob .5s ease-in-out 1.6s infinite alternate}
@keyframes critbob{from{transform:translateY(0) scale(1.06,.94)}to{transform:translateY(-8%) scale(.96,1.04)}}
.coins{animation:coinpop .6s .6s cubic-bezier(.2,1.8,.4,1) backwards}
@keyframes coinpop{from{transform:scale(0) rotate(-20deg)}}
/* Reduced motion: no idle loops, shakes, zooms, bouncing or confetti. Moves become short glides and reveals become fades. */
@media (prefers-reduced-motion: reduce){
  .walker .idle,.walker .eyes,.hero .eyes,.hero .buds svg,.nest .egg,.visited .budi,.fli,.flowg,.cell.burrow .tile svg,.cell.want .sg,
  .headring::after,.lvl.next,.lvl .scene.egg,.cell.next .tile::after,.burst .rays,.burst .bc,.winrow .wb,.winrow .wc,.ctrls .btn.wig,

const DIRS = { ">": [0, 1], "<": [0, -1], "^": [-1, 0], "v": [1, 0] };

  if (!play || play.done || view !== "play" || $ov.innerHTML) return;
  const b = byId("board"); if (!b || !e.target.closest("#board")) return;
  const rect = b.getBoundingClientRect(), hit = cellAt(e.clientX, e.clientY, rect); if (hit === -1) return;
  e.preventDefault();
  drag = { id: e.pointerId, last: hit.i, rect };
  document.querySelectorAll(".hand").forEach(h => h.remove());
  byId("walker").classList.add("held");
  touchCell(hit.i, false);
  try { e.target.releasePointerCapture && e.target.releasePointerCapture(e.pointerId); } catch (err) {}
});
document.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const hit = cellAt(e.clientX, e.clientY, drag.rect); if (hit === -1 || !hit.inner || hit.i === drag.last) return;
  drag.last = hit.i; touchCell(hit.i, true);
});
["pointerup", "pointercancel"].forEach(ev => document.addEventListener(ev, e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag = null; const w = byId("walker"); if (w) w.classList.remove("held");
  if (play && !play.done) placeHand();
}));

/* hold-to-confirm (grown-up reset) */
let hold = null;
document.addEventListener("pointerdown", e => {
  const el = e.target.closest("[data-hold]"); if (!el) return;
  const bar = el.querySelector("i"), t0 = Date.now();
  hold = setInterval(() => {
    const p = Math.min(1, (Date.now() - t0) / 2000); bar.style.width = (p * 100) + "%";
    if (p >= 1) {
      clearInterval(hold); hold = null;
      const k = kid(); k.progress = {}; Store.save(); $ov.innerHTML = ""; render(); toastNote("Puzzle progress reset.");
    }
  }, 50);
});
["pointerup", "pointercancel", "pointerleave"].forEach(ev => document.addEventListener(ev, () => {
  if (hold) { clearInterval(hold); hold = null; document.querySelectorAll("[data-hold] i").forEach(b => b.style.width = "0"); }
}));

/* keep in sync if the main app switches player in another tab; refit the board on rotate */
window.addEventListener("storage", e => { if (e.key === GAME.mainKey) { me = readMainProfile(); render(); } else if (e.key === GAME.storageKey) { Store.load(); if (view !== "play") render(); } });
window.addEventListener("resize", () => { if (view === "play" && play && !play.done) { resetAnim(); fitBoard(); paint(true); } else if (view === "play" && play) fitBoard(); });

Store.load(); render();
</script>
</body>
</html>
