.panel{background:#fff;border-radius:30px;padding:20px 22px;max-width:720px;width:100%;max-height:calc(100dvh - 32px);overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:pop .35s}

.title{font-size:44px;font-weight:700;color:var(--brand-d);text-shadow:0 3px 0 #fff}

.winscene .words{position:absolute;top:10px;left:0;right:0;font-size:min(44px,6vh)}
.pairs{font-size:clamp(26px,4vh,38px);line-height:1.35}.pairs small{font-size:.55em;font-weight:700;color:var(--muted)}.pairs svg{width:1.2em;height:1.2em;vertical-align:middle}
.bigstars{font-size:42px}.bigstars span{display:inline-block;animation:pop .4s backwards}
.coins{font-size:30px;font-weight:700;color:var(--gold-d)}
.parade{display:flex;gap:10px;font-size:48px}.parade span{animation:hop 1s ease-in-out infinite}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.grown p{text-align:left;font-size:18px;margin:4px 0}

  .top{gap:6px}.top .pill[aria-label=Player],[data-act=grown]{display:none!important}.pill{padding:6px 10px}.tray{gap:8px}.prompt .ptxt{font-size:17px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
/*VOICE-START v1.0.0*/
/* ElzeeVoice v1.0.0 - one shared read-aloud voice for Elzee and its games (1.4.2).
   Source of truth: workspace/build142/elzee-voice.js, pasted unchanged between the VOICE markers of
   index.html and games/*.html (the pages are offline single files, so no <script src>).
   - Calm, natural voices first (iPad Safari: Ava Premium/Enhanced, Samantha Enhanced, Allison, Susan, Karen, Samantha).
   - Novelty voices (Fred, Zarvox, Bubbles, ...) are never used.
   - One calm rate (0.9) and normal pitch (1.0) everywhere, younger mode included.
   - Each kid picks their own voice in Elzee (🔈 on the top bar). It is saved on their profile as profile.voice
     in logicquest.v1; games only READ it (active profile). No network, on-device voices only. */
(function (root) {
  "use strict";
  var VERSION = "1.0.0", RATE = 0.9, PITCH = 1.0, MAIN_KEY = "logicquest.v1";
  var NOVELTY = /(^|[\s.\-_(])(Fred|Albert|Bad News|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Pipe Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Bahh|Junior|Ralph|Kathy|Deranged|Hysterical)($|[\s.\-_)])/i;
  var PREFER = [/^Ava\b.*\((Premium|Enhanced)\)/i, /^Samantha\b.*\(Enhanced\)/i, /^Allison\b/i, /^Susan\b/i, /^Karen\b/i, /^Samantha\b/i];
  // Friendly characters for the kids' voice cards (picture-only; no reading needed).
  var CHARS = [{ e: "🦉", n: "Owl" }, { e: "🐻", n: "Bear" }, { e: "🐰", n: "Bunny" }, { e: "🐢", n: "Turtle" }, { e: "🐳", n: "Whale" }];
  function isNovelty(v) { return !!v && (NOVELTY.test(String(v.name || "")) || NOVELTY.test(String(v.voiceURI || ""))); }
  function score(v) {
    var name = String(v.name || ""), i;
    for (i = 0; i < PREFER.length; i++) if (PREFER[i].test(name)) return i;
    return /^en[-_]US/i.test(v.lang || "") ? 20 : 30;
  }
  function voices() {
    var all = [];
    try { all = (root.speechSynthesis && root.speechSynthesis.getVoices && root.speechSynthesis.getVoices()) || []; } catch (e) { all = []; }
    var seen = {}, out = [];
    for (var i = 0; i < all.length; i++) {
      var v = all[i];
      if (!v || !/^en/i.test(v.lang || "") || v.localService === false || isNovelty(v) || seen[v.name]) continue; // on-device English only
      seen[v.name] = 1; out.push(v);
    }
    return out.map(function (v, i) { return { v: v, s: score(v), i: i }; })
      .sort(function (a, b) { return a.s - b.s || a.i - b.i; }).map(function (x) { return x.v; });
  }
  // Active Elzee profile, read only (games never write logicquest.v1).
  function activeProfile() {
    try {
      var d = JSON.parse(root.localStorage.getItem(MAIN_KEY));
      if (!d || !Array.isArray(d.profiles)) return null;
      for (var i = 0; i < d.profiles.length; i++) if (d.profiles[i] && d.profiles[i].id === d.activeId) return d.profiles[i];
    } catch (e) {}
    return null;
  }
  function prefFor(p) { return p && typeof p.voice === "string" && p.voice ? p.voice.slice(0, 100) : null; }
  function pick(name) {
    var list = voices();
    if (name) for (var i = 0; i < list.length; i++) if (list[i].name === name) return list[i];
    return list[0] || null; // calm default
  }
  // Voice cards for the kid picker: the best few voices, each with a friendly character.
  function choices(max) {
    var list = voices().slice(0, Math.min(max || CHARS.length, CHARS.length));
    return list.map(function (v, i) { return { name: v.name, lang: v.lang, emoji: CHARS[i].e, char: CHARS[i].n }; });
  }
  // Set voice, calm rate and normal pitch on an utterance. name undefined = the active profile's pick.
  function apply(u, name) {
    if (name === undefined) name = prefFor(activeProfile());
    var v = pick(name);
    if (v) { try { u.voice = v; } catch (e) { /* not a real voice object */ } u.lang = v.lang || "en-US"; } else u.lang = "en-US";
    u.rate = RATE; u.pitch = PITCH;
    api.last = v ? v.name : null;
    return u;
  }
  var api = { version: VERSION, RATE: RATE, PITCH: PITCH, CHARS: CHARS, isNovelty: isNovelty, voices: voices, pick: pick,
    choices: choices, apply: apply, prefFor: prefFor, activeProfile: activeProfile, last: null };
  root.ElzeeVoice = api;
})(typeof window !== "undefined" ? window : this);

<script>
"use strict";
/* ==========================================================================
   SEESAW WORDS: a vocabulary interlude for Elzee.
   Opposites go on opposite ends (the seesaw swings level), same-meaning words
   share a seat, and shades of meaning climb a ladder from "a little" to "a lot".
   Young path (little-path profiles): picture opposites, everything read aloud.
   Fixed levels; exactly one card fits each spot (seesaw-words-dev/verify.mjs).
   No randomness, no timer, no fail state.
   ========================================================================== */
const GAME = {
  id: "seesaw-words",
  storageKey: "logicquest.minigame.seesaw-words.v1", // this game's own key
  mainKey: "logicquest.v1",                           // main app key: READ ONLY, never written here
  resultKey: "logicquest.interlude.result.v1",
};
const ECON = { firstClear: 3, firstThreeStars: 2, replay: 0 }; // contract §6 fixed-level rates; no caps of any kind
const RM = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- picture helpers (inline SVG, no assets) ---------- */
function cupSVG(full, color) {
  const id = "c" + full + color.slice(1);
  return `<svg viewBox="0 0 80 80" aria-hidden="true"><defs><clipPath id="${id}"><path d="M18 10 L62 10 L56 72 L24 72 Z"/></clipPath></defs>
    ${full ? `<rect x="0" y="22" width="80" height="60" fill="${color}" clip-path="url(#${id})"/>` : ""}
    <path d="M18 10 L62 10 L56 72 L24 72 Z" fill="none" stroke="#2d2a4a" stroke-width="4" stroke-linejoin="round"/></svg>`;
}
function jarSVG(full) {
  const cookies = full ? [[30, 60], [50, 60], [40, 46], [28, 34], [52, 34]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="9" fill="#c98b4a" stroke="#8a5a2b" stroke-width="2"/><circle cx="${x - 3}" cy="${y - 2}" r="1.8" fill="#5a3a1a"/><circle cx="${x + 3}" cy="${y + 3}" r="1.8" fill="#5a3a1a"/>`).join("") : "";
  return `<svg viewBox="0 0 80 80" aria-hidden="true"><rect x="22" y="6" width="36" height="10" rx="4" fill="#ff8fab" stroke="#2d2a4a" stroke-width="3"/>
    <path d="M18 18 Q14 18 14 26 L14 66 Q14 74 22 74 L58 74 Q66 74 66 66 L66 26 Q66 18 62 18 Z" fill="#e9f6ff" stroke="#2d2a4a" stroke-width="4"/>${cookies}</svg>`;
}

/*LEVELS-START*/
/* Words. e = picture (emoji) or svg, w = word (big path), say = spoken form, prop = picture property (young path). */
const WORDS = {
  hot: { e: "🔥", w: "hot" }, cold: { e: "🧊", w: "cold" }, warm: { e: "☀️", w: "warm" }, spicy: { e: "🌶️", w: "spicy" },
  up: { e: "⬆️", w: "up" }, down: { e: "⬇️", w: "down" }, high: { e: "🪁", w: "high" }, sky: { e: "☁️", w: "sky" },
  happy: { e: "😀", w: "happy" }, sad: { e: "😢", w: "sad" }, glad: { e: "😊", w: "glad" }, silly: { e: "🤪", w: "silly" },
  big: { e: "🐘", w: "big" }, small: { e: "🐭", w: "small" }, huge: { e: "🦕", w: "huge" }, tall: { e: "🦒", w: "tall" },

  const cur = g.getBoundingClientRect(), home = el.getBoundingClientRect();
  const done = () => { g.remove(); el.style.visibility = ""; };
  if (RM() || !g.animate) { done(); return; }
  const a = g.animate([{ transform: `translate(${cur.left}px,${cur.top}px) scale(1.08)` }, { transform: `translate(${home.left}px,${home.top}px) scale(1.1,.9)`, offset: 0.8 }, { transform: `translate(${home.left}px,${home.top}px) scale(1)` }], { duration: 380, easing: "ease-out" });
  a.onfinish = done; setTimeout(() => { if (g.isConnected) done(); }, 700);
}
document.addEventListener("pointerup", e => endDrag(e, false));
document.addEventListener("pointercancel", e => endDrag(e, true));
document.addEventListener("contextmenu", e => { if (e.target.closest && e.target.closest(".card")) e.preventDefault(); });
function tapCard(id) {
  Sound.pick();
  play.sel = play.sel === id ? null : id;
  document.querySelectorAll(".tray .card").forEach(el => el.classList.toggle("sel", el.dataset.card === play.sel));
}

/* ---------- clicks ---------- */
document.addEventListener("click", e => {
  const slot = e.target.closest && e.target.closest(".stage .slot");
  if (slot && view === "play" && play && !play.done && !play.busy && !$ov.firstChild) {
    if (play.sel) tryPlace(play.sel, slot.dataset.spot, null); else Speech.say(promptSay(R0()));
    return;
  }
  const pc = e.target.closest && e.target.closest(".stage .card");
  if (pc && view === "play" && !$ov.firstChild) { Speech.say(wSay(pc.dataset.card)); return; }
  const b = e.target.closest && e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "begin") begin();
  else if (act === "start") { pushNav(); startLevel(+b.dataset.li, true); }
  else if (act === "locked") { Sound.oops(); if (b.animate) b.animate([{ transform: "rotate(0)" }, { transform: "rotate(-4deg)" }, { transform: "rotate(4deg)" }, { transform: "rotate(0)" }], { duration: 300 }); }
  else if (act === "map") { try { if (history.state && history.state.sw === "play") history.replaceState({ sw: "map" }, ""); } catch (err) { /* ignore */ } toMap(); }
  else if (act === "home") exitGame(session.finished ? "done" : "quit");
  else if (act === "back") exitGame(session.solved ? "done" : "quit");
  else if (act === "toggleRead") { const k = kid(); k.noRead = !noRead(); Store.save(); render(); }
  else if (act === "toggleSound") { const k = kid(); k.sound = !soundOn(); Store.save(); if (!k.sound) Speech.stop(); render(); }
  else if (act === "sayPrompt") Speech.say(promptSay(R0()));
  else if (act === "sayIntro") Speech.say(curTrack() === "young" ? "Seesaw Words! Put the opposite picture on the other end of the seesaw." : "Seesaw Words! Opposites ride on opposite ends. Same-meaning words share a seat. Ladders climb from a little to a lot.");
  else if (act === "hint") hint();
  else if (act === "next") { const n = nextIn(play.li); $ov.innerHTML = ""; if (n >= 0) startLevel(n, true); else toMap(); }
  else if (act === "toggleTrack") {
    const k = kid(); k.track = curTrack() === "young" ? "big" : "young"; Store.save(); Sound.pick();
    Speech.say(k.track === "young" ? "Little seesaw" : "Big seesaw");
    if (view === "play") { if (play && !play.done) saveCur(); if (INTERLUDE) startLevel(pickLevel(k.track), true); else { $ov.innerHTML = ""; view = "map"; play = null; render(); } }
    else render();
  }
  else if (act === "replay") { $ov.innerHTML = ""; startLevel(play.li, false); }
  else if (act === "keep") { $ov.innerHTML = ""; }
  else if (act === "grown") showGrown();
  else if (act === "closeOv") { $ov.innerHTML = ""; }
});

/* ---------- the ▶️ start tap (unlocks speech + audio on iPad) ---------- */
function startScreen() {
  const nr = noRead() || curTrack() === "young", [b1, b2] = BUDDIES[curTrack()];
  $ov.innerHTML = `<div class="ov startov"><div class="panel" style="background:transparent;box-shadow:none" role="dialog" aria-label="Seesaw Words. Tap to start">
    ${nr ? "" : `<div class="title">Seesaw Words</div>`}
    <div class="minisaw" aria-hidden="true"><span>${b1}</span><span style="animation-delay:.5s">🎢</span><span style="animation-delay:.25s">${b2}</span></div>
    <button class="startbtn" data-act="begin" aria-label="Tap to start">▶️</button></div></div>`;
}
function begin() {
  if (started) { $ov.innerHTML = ""; return; }
  started = true;
  Speech.unlock(); // inside the tap gesture
  $ov.innerHTML = ""; Sound.pick();
  if (view === "play") fitStage();
  const q = afterStart.splice(0); q.forEach(fn => setTimeout(fn, 300));
  Speech.flush();
}

/* ---------- navigation (back button) ---------- */
function pushNav() { if (!INTERLUDE) try { history.pushState({ sw: "play" }, ""); } catch (e) { /* ignore */ } }
function toMap() { Speech.stop(); clearGlow(); $ov.innerHTML = ""; if (play && !play.done) saveCur(); view = "map"; play = null; render(); }
window.addEventListener("popstate", () => {
  if (INTERLUDE) { exitGame(session.solved ? "done" : "quit"); return; }
  if (view === "play") toMap();
});
function exitGame(status) {
  Speech.stop();
  if (LAUNCH.elzee) {
    const now = Date.now();
    const rec = { v: 1, gameId: GAME.id, sid: LAUNCH.sid, step: LAUNCH.step, profileId: me.id, status: status === "done" ? "done" : "quit",
      rounds: INTERLUDE ? (session.finished ? 1 : 0) : session.solved, solved: session.solved, startedAt: session.startedAt, endedAt: now,
      durationMs: Math.max(0, now - session.startedAt), tokensEarned: session.tokens };
    try { localStorage.setItem(GAME.resultKey, JSON.stringify(rec)); } catch (e) { /* ignore */ }
    try { sessionStorage.removeItem("sw.session." + LAUNCH.sid); } catch (e) { /* ignore */ }
  }
  window.__swExit = LAUNCH.ret; // for tests
  if (!window.__swNoNav) location.replace(LAUNCH.ret);
}

/* ---------- winning ---------- */
function winLevel() {
  if (!play || play.done) return;
  play.done = true; clearGlow();
  const li = play.li, stars = Math.max(1, 3 - play.hints), final = isFinal(li);
  const res = award(li, stars);
  session.solved++; session.tokens += res.got; saveSession();
  if (INTERLUDE) session.finished = true;
  Sound.win();
  showWin(li, stars, res, final);
}
function pairHTML(R, nr) {
  if (R.type === "ladder") return R.scale.map(id => `${pic(id)}${nr ? "" : `<small> ${esc(wSay(id))}</small>`}`).join(" < ");
  const mid = R.type === "opp" ? "↔️" : "🤝";
  return `${pic(R.anchor)}${nr || R.say ? "" : `<small> ${esc(wSay(R.anchor))}</small>`} ${mid} ${pic(R.answer)}${nr || R.say ? "" : `<small> ${esc(wSay(R.answer))}</small>`}`;
}
function showWin(li, stars, res, final) {
  const L = LEVELS[li], nr = noRead() || !!L.young, [b1, b2] = BUDDIES[trackOf(li)];
  const parade = final ? `<div class="parade" aria-hidden="true">${trackList(trackOf(li)).map((i, n) => `<span style="animation-delay:${n * 0.12}s">${LEVELS[i].scene}</span>`).join("")}<span>🏆</span></div>` : "";
  const buttons = INTERLUDE
    ? `<button class="btn" data-act="back" aria-label="Back to my adventure"><span class="ico">▶️</span>${nr ? "" : "Back to my adventure"}</button>`
    : `<button class="btn ghost" data-act="map" aria-label="All levels"><span class="ico">🗺️</span></button>
       <button class="btn ghost" data-act="replay" aria-label="Play again"><span class="ico">🔁</span></button>
       ${final ? "" : `<button class="btn" data-act="next" aria-label="Next level"><span class="ico">▶️</span>${nr ? "" : "Next"}</button>`}`;
  $ov.innerHTML = `<div class="ov"><div class="panel win ${final ? "final" : ""}" role="dialog" aria-label="Level complete">
    <h2>${final ? "🏆" : "🎉"} ${nr ? "" : final ? "Seesaw champion!" : esc(L.name) + "!"}</h2>
    <div class="winscene" aria-hidden="true"><div class="wpiv"></div><div class="wplank"><span style="left:6%">${b1}</span><span style="right:6%;animation-delay:.45s">${b2}</span></div>
      <span class="deco" style="position:absolute;left:46%;top:38%;font-size:40px">${L.scene}</span></div>
    <div class="pairs">${L.rounds.map(R => `<div>${pairHTML(R, nr)}</div>`).join("")}</div>
    ${parade}
    <div class="row" style="align-items:center"><span class="bigstars">${[0, 1, 2].map(i => `<span style="animation-delay:${0.3 + i * 0.2}s" class="${i < stars ? "" : "nostar"}">⭐</span>`).join("")}</span>
      ${res.got ? `<span class="coins">+${res.got} 🪙</span>` : ""}</div>
    <div class="row">${buttons}</div></div></div>`;
  const pill = document.querySelector('.top .pill[aria-label^="Tokens"]'); if (pill) { pill.setAttribute("aria-label", "Tokens earned today " + kid().earnedToday); const b = pill.querySelector("b"); if (b) b.textContent = kid().earnedToday; }
  if (!RM()) { FX.burst(innerWidth / 2, innerHeight * 0.35, final ? 120 : 80, 1.2, 1); if (final) for (let i = 1; i <= 6; i++) setTimeout(() => { if (!$ov.querySelector(".final")) return; FX.burst(innerWidth * (0.15 + 0.7 * ((i * 37) % 10) / 10), innerHeight * (0.15 + 0.1 * (i % 3)), 60, 1, 0); Sound.pop(); }, 500 + i * 450); }
  const lines = [final ? (L.young ? "Hooray! You finished all the little seesaws!" : "Hooray! You are a seesaw champion!") : (L.young ? "Hooray! You did it!" : "Hooray! Level complete!")];
  if (res.got) lines.push(`You earned ${res.got} tokens!`);
  setTimeout(() => { if ($ov.querySelector(".win")) Speech.seq(lines); }, 400);
}
function showGrown() {
  const k = kid();
  $ov.innerHTML = `<div class="ov"><div class="panel grown" role="dialog" aria-label="For grown-ups"><h2>ⓘ For grown-ups</h2>
    <p><b>Seesaw Words</b> practices vocabulary: opposites (antonyms), same-meaning words (synonyms), and shades of meaning (warm, hot, boiling). Every spot has exactly one card that fits; the others are close but don't. Wrong picks just slide off.</p>
    <p><b>Tokens:</b> first time a level is finished +${ECON.firstClear}, first time with no hints +${ECON.firstThreeStars}, replays ${ECON.replay}. No daily limits. No purchases, no ads, no timer.</p>
    <p>Today: ${k.earnedToday} · Waiting to go into the Elzee jar: <b>${k.pending}</b> · All-time: ${k.lifetime}</p>
    <p>🐣 little seesaw: picture opposites, everything read aloud. 🖼️ hides all words. 🔈 uses the device's own voice.</p>
    <div class="row"><button class="btn" data-act="closeOv" aria-label="Close"><span class="ico">👍</span></button></div></div></div>`;
}

/* ---------- confetti ---------- */
const FX = {
  cv: document.getElementById("fx"), ctx: null, parts: [], on: false,
  size() { const d = window.devicePixelRatio || 1; this.cv.width = innerWidth * d; this.cv.height = innerHeight * d; this.ctx = this.cv.getContext("2d"); if (this.ctx) this.ctx.setTransform(d, 0, 0, d, 0, 0); },
  burst(x, y, n = 40, spread = 1, up = 1) {
    if (RM()) return;
    const cols = ["#7c4dff", "#3ccf4e", "#ffc83d", "#ff6b3d", "#ff8fab", "#4dc3ff", "#ff5d73"];
    for (let i = 0; i < n; i++) { // decorative only; never affects play or rewards
      const a = up ? -Math.PI / 2 + (Math.random() - 0.5) * 1.6 * spread : Math.random() * Math.PI * 2, v = 380 + Math.random() * 520;
      this.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6, vr: (Math.random() - 0.5) * 14, w: 8 + Math.random() * 7, h: 10 + Math.random() * 8, c: cols[i % cols.length], life: 2.2 + Math.random(), round: i % 4 === 0 });
    }
    if (!this.on) { this.on = true; this.size(); if (!this.ctx) { this.on = false; this.parts = []; return; } this.t = performance.now(); requestAnimationFrame(t => this.tick(t)); }
  },
  tick(t) {
    const dt = Math.min(0.033, (t - this.t) / 1000); this.t = t;
    const g = this.ctx; g.clearRect(0, 0, innerWidth, innerHeight);
    this.parts = this.parts.filter(p => (p.life -= dt) > 0 && p.y < innerHeight + 40);
    for (const p of this.parts) {
      p.vy += 900 * dt; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.globalAlpha = Math.min(1, p.life);
      if (p.round) { g.beginPath(); g.arc(0, 0, p.w / 2, 0, 7); g.fill(); } else g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 2);
      g.restore();
    }
    if (this.parts.length) requestAnimationFrame(tt => this.tick(tt)); else { this.on = false; g.clearRect(0, 0, innerWidth, innerHeight); }
  },
};

/* ---------- soft time budget (interlude §4.3) ---------- */
function tickBudget() {
  if (!INTERLUDE || session.finished || !started) return;
  const m = (Date.now() - session.startedAt) / 60000;
  if (m >= LAUNCH.min && !session.bannerShown) { session.bannerShown = true; if (view === "play" && !drag && !(play && play.busy)) renderPlay(); }
  if (m >= LAUNCH.min + 3 && !session.offerShown && !$ov.firstChild) {
    session.offerShown = true; const nr = noRead() || isYoung();
    $ov.innerHTML = `<div class="ov"><div class="panel" role="dialog" aria-label="Back to the trail?"><h2>🗺️ ${nr ? "" : "Time for the trail?"}</h2>
      <div class="row"><button class="btn ghost" data-act="keep" aria-label="Keep playing"><span class="ico">🎢</span></button>
      <button class="btn" data-act="back" aria-label="Back to my adventure"><span class="ico">▶️</span>${nr ? "" : "Back to my adventure"}</button></div></div></div>`;
  }
}
setInterval(tickBudget, 5000);

/* ---------- boot ---------- */
Store.load();
window.addEventListener("pagehide", () => { if (play && !play.done) saveCur(); });
window.addEventListener("storage", ev => { if (ev.key === GAME.mainKey) { me = readMainProfile(); if (!(play && play.busy)) render(); } });
window.addEventListener("resize", () => { if (FX.on) FX.size(); if (view === "play" && play && !drag && !play.busy) renderPlay(); });
(function boot() {
  const k = kid(); Store.save();
  if (INTERLUDE) {
    try { history.replaceState({ sw: "base" }, ""); history.pushState({ sw: "game" }, ""); } catch (e) { /* ignore */ }
    startLevel(pickLevel(curTrack()), true);
  } else if (k.cur) { pushNav(); startLevel(k.cur.li, true); }
  else render();
  startScreen(); // every boot (interlude and resume too): one big ▶️ tap, which unlocks speech on iPad
})();

/* Read-only hooks for automated tests (cannot change game state). */
window.SeesawWords = Object.freeze({
  levels: LEVELS, words: WORDS, lex: LEX, fits, spotsOf, pickNaturalVoice,
  track: () => curTrack(),
  state: () => JSON.parse(JSON.stringify({ view, play, session, kid: kid(), launch: LAUNCH, started, unlocked: Speech.unlocked, voice: Speech.voice ? Speech.voice.name : null })),
});
</script>
</body>
