<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Offline-only: the page may not load anything from anywhere (no fonts, images, scripts, or fetches). Same CSP as every Elzee game. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7c4dff">

<title>Balloon or Sandbag? · Elzee</title>
<style>
:root{
  --bg:#fff8e7; --ink:#2d2a4a; --muted:#7a7699; --card:#fff; --line:#e7e2f5;
  --brand:#7c4dff; --brand-d:#5a2fd6; --brand-l:#efe9ff;
  --good:#3ccf4e; --good-d:#2a9d38; --good-l:#e6fbe9;
  --oops:#ff9f43; --oops-d:#e07b15; --oops-l:#fff3e3;
  --gold:#ffc83d; --gold-d:#e0a400;
  --radius:22px;
  --font:"Fredoka","Chalkboard SE","Comic Sans MS","Arial Rounded MT Bold",system-ui,sans-serif;
  /* game-specific */
  --box:#e7a35c; --box-d:#b8743a; --lawn:#d9f2c9; --lawn-d:#a9dc8f; --sign:#fff4d4;
  --cs:360px; --st:112px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:20px;line-height:1.3;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0}
#app{max-width:1180px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 16px)}
.btn{border:none;border-radius:18px;padding:12px 24px;min-height:64px;min-width:64px;font-size:23px;font-weight:600;text-decoration:none;
  background:var(--good);color:#fff;box-shadow:0 5px 0 var(--good-d);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--good-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn .ico{font-size:30px;line-height:1}
.iconbtn{border:none;background:#fff;border-radius:18px;width:64px;height:64px;font-size:30px;flex:none;text-decoration:none;
  box-shadow:0 4px 0 var(--line);display:inline-flex;align-items:center;justify-content:center;position:relative}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.iconbtn.on{background:var(--good-l);box-shadow:0 4px 0 #bfe9c6}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px;min-height:56px;font-size:22px;font-weight:700;box-shadow:0 4px 0 var(--line)}
.pill .av{font-size:30px}
.pill .nm{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
[data-say]{cursor:pointer}
.muted{color:var(--muted)}

/* menu */
.menu{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:16px}
.hero{display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--radius);box-shadow:0 6px 0 var(--line);padding:14px 16px}
.hero .judge{width:96px;height:96px;flex:none;animation:bob 2.4s ease-in-out infinite}
.hero .judge svg{width:100%;height:100%}
.hero .txt{flex:1;min-width:0;font-size:21px}
.hero .demo{display:flex;align-items:center;gap:8px;font-size:44px;flex-wrap:wrap}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.tier{border:none;background:linear-gradient(#bfe9a8,#8fd16a);border-radius:26px;box-shadow:0 7px 0 #6cb14a;color:var(--ink);min-height:180px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;position:relative}
.tier:active{transform:translateY(4px);box-shadow:0 3px 0 #6cb14a}
.tier .mini{font-size:46px;letter-spacing:4px}
.tier b{font-size:24px}
.tier .resume{position:absolute;top:10px;right:14px;font-size:30px}
.tier.rec{outline:5px solid var(--gold);outline-offset:-5px}

/* play */
.play{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px}
.prompt{display:flex;align-items:center;gap:12px;background:var(--sign);border:3px solid #f0dca0;border-radius:var(--radius);box-shadow:0 6px 0 #ead18a;padding:10px 12px}
.prompt .judge{width:64px;height:64px;flex:none}
.prompt .judge svg{width:100%;height:100%}
.prompt .rule{flex:1;min-width:0}
.rulepics{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:40px;line-height:1.1}
.rulepics .arrow{font-size:30px;color:var(--good-d);font-weight:700}
.rulewords{font-size:19px;margin-top:4px}
.rulewords b{font-weight:700}
.prompt .tools{display:flex;gap:8px;flex:none;align-self:flex-start}
.prompt.glow{animation:glow 1s ease-in-out 3}
.stage{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.dots{display:flex;gap:8px;align-items:center;flex:none}
.dots i{display:block;width:22px;height:22px;border-radius:50%;background:#eceaf3;border:3px solid #dcd8ea}
.dots i.done{background:var(--good);border-color:var(--good-d)}
.dots i.cur{background:var(--gold);border-color:var(--gold-d)}
.sky{width:var(--cs);height:calc(var(--cs) * var(--sr,.5));position:relative;border-radius:26px;overflow:hidden;flex:none;
  background:linear-gradient(#ffd9a8 0%,#fff1d6 62%,var(--lawn) 62%,var(--lawn) 100%);box-shadow:0 6px 0 var(--lawn-d)}
.sky .cloud{position:absolute;font-size:calc(var(--cs) * .09);opacity:.8;animation:bob 4s ease-in-out infinite}
.sky .c1{left:6%;top:8%} .sky .c2{right:30%;top:4%;animation-delay:1.4s}
.basket{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:top .8s cubic-bezier(.3,1.5,.5,1)}
.balloons{display:flex;gap:2px;font-size:calc(var(--cs) * .075);line-height:1;min-height:calc(var(--cs) * .02)}
.balloons span{animation:bob 2.2s ease-in-out infinite}
.balloons span:nth-child(2n){animation-delay:.6s}
.balloons .new{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.bsk{position:relative;font-size:calc(var(--cs) * .12);line-height:1}
.bsk .sign{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:calc(var(--cs) * .032);background:#fff;border-radius:10px;padding:1px 5px;white-space:nowrap}
.bags{display:flex;gap:2px}
.bags svg{width:calc(var(--cs) * .055);height:calc(var(--cs) * .055)}
.bags .new{animation:squish .45s ease-out}
.puddle{position:absolute;right:4%;bottom:5%;font-size:calc(var(--cs) * .07);background:#fff8;border-radius:50%;padding:2px 10px;display:flex;align-items:center;gap:4px}
.puddle b{font-size:calc(var(--cs) * .04)}
.puddle.splash{animation:splash .6s ease-out}
.sky.dance .basket .bsk{animation:dance .5s ease-in-out infinite alternate}
.clue{width:min(640px,100%);position:relative;background:#fff;border-radius:24px;box-shadow:0 6px 0 var(--line);padding:10px 12px 10px 16px;
  display:flex;align-items:center;gap:12px;touch-action:none;flex:none;transition:transform .28s cubic-bezier(.3,1.4,.5,1),opacity .28s;cursor:grab}
.clue.enter{transform:translateX(50%) scale(.85);opacity:0}
.clue.leave{transform:translateY(-40%) scale(.85);opacity:0}
.clue.lifted{opacity:.35}
.clue.done{cursor:default;box-shadow:0 6px 0 var(--good-l),0 0 0 3px var(--good) inset}
.cpics{display:flex;align-items:center;gap:6px;font-size:40px;line-height:1.1;flex:none;white-space:nowrap}
.cpics .arrow{font-size:28px;color:var(--good-d);font-weight:700}
.cpics .eq{font-size:30px;font-weight:700;color:var(--muted)}
.cpics .n{font-size:22px}
.ctext{flex:1;min-width:0;font-size:20px}
.clue .badge{position:absolute;right:-8px;top:-14px;width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 3px 0 var(--line);
  display:flex;align-items:center;justify-content:center;font-size:28px;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.badge svg,.stamp .face svg,.explain .pic svg{width:1em;height:1em;vertical-align:-0.12em}
.noitem{position:relative;display:inline-flex}
.noitem .it{opacity:.35;filter:grayscale(.6)}
.noitem .x{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.85em}
.stamp.hot{transform:scale(1.1);box-shadow:0 0 0 6px var(--gold),0 6px 0 var(--line)}
.stamp.z-balloon{background:#fff0f3} .stamp.z-sandbag{background:#fbf1e4} .stamp.z-puddle{background:#eef7f2}
.clueghost{width:auto!important;height:auto!important;padding:10px 16px;font-size:40px!important;gap:6px;white-space:nowrap}
.clueghost .arrow{font-size:28px;color:var(--good-d)}
.hero .txt svg,.tier svg{width:1.1em;height:1.1em;vertical-align:-0.15em}
.below{min-height:76px;display:flex;align-items:center;justify-content:center;gap:12px;flex:none;width:100%}
.say-line{font-size:20px;text-align:center;max-width:640px}
.explain{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;box-shadow:0 5px 0 var(--line);padding:6px 10px 6px 16px;max-width:760px}
.explain .pic{font-size:34px;white-space:nowrap;flex:none}
.explain .txt{min-width:0}
.explain .txt{font-size:19px}
.explain.oops{background:var(--oops-l)}
.stamps{display:flex;gap:14px;justify-content:center;align-items:stretch}
.stamp{border:none;background:#fff;border-radius:26px;width:var(--st);min-height:var(--st);box-shadow:0 6px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 6px;touch-action:none;position:relative}
.stamp .face{font-size:calc(var(--st) * .36);line-height:1}
.stamp .sub{font-size:calc(var(--st) * .24);line-height:1;display:inline-flex}
.stamp .sub .noitem .x{font-size:calc(var(--st) * .22)}
.stamp small{font-size:16px;font-weight:600;color:var(--muted)}
.stamp:active{transform:translateY(3px)}
.stamp.lifted{opacity:.3}
.stamp.glow{animation:glow 1s ease-in-out infinite alternate}
.stamp[disabled]{opacity:.45}
.dragghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;width:var(--st);height:var(--st);border-radius:26px;background:#fff;
  box-shadow:0 14px 18px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-size:calc(var(--st) * .4);will-change:transform}
.dragghost.back{transition:transform .3s cubic-bezier(.3,.8,.4,1)}
.dragghost.fly{transition:transform .2s ease-out}
.dragghost.wiggle span{display:inline-block;animation:wiggle .45s ease-in-out}
.banner{background:var(--gold);color:var(--ink);border-radius:16px;padding:8px 14px;text-align:center;font-weight:600;margin-bottom:8px;flex:none}
@media (orientation:landscape) and (min-aspect-ratio:5/4){
  .play{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr)}
  .play .prompt{grid-column:1;grid-row:1}
  .play .stage{grid-column:1;grid-row:2}
  .play .stamps{grid-column:2;grid-row:1 / 3;flex-direction:column;justify-content:center}
}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(45,42,74,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.panel{background:var(--bg);border-radius:28px;padding:22px;max-width:620px;width:100%;max-height:94vh;overflow:auto;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.12);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.panel h2{font-size:30px;margin-bottom:8px}
.panel.grown{text-align:left}
.panel.grown h2{text-align:center}
.panel p{font-size:18px}
.cheer{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:18px 0 8px}
.cheer svg{width:72px;height:72px;animation:dance .55s ease-in-out infinite alternate}
.cheer svg:nth-child(2n){animation-delay:.27s}
.bigstars{font-size:40px;letter-spacing:4px}
.bigstars .no{filter:grayscale(1);opacity:.3}
.coins{font-size:34px;font-weight:700;color:var(--gold-d);animation:pop .5s .3s both}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.gate .judge{width:150px;height:150px;margin:0 auto;animation:bob 2.4s ease-in-out infinite}
.gate .judge svg{width:100%;height:100%}
.gate .go{width:140px;height:140px;border-radius:50%;font-size:64px;margin-top:10px}
.confetti{position:fixed;top:-20px;z-index:60;width:12px;height:16px;border-radius:3px;pointer-events:none;animation:fall linear forwards}

/* shared motion vocabulary (contract §8) */
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes wiggle{20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(4deg)}100%{transform:none}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes dance{0%{transform:translateY(0) rotate(-7deg)}100%{transform:translateY(-12px) rotate(7deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(255,200,61,0)}to{box-shadow:0 0 0 8px rgba(255,200,61,.95)}}
@keyframes squish{0%{transform:scale(1.3,.7)}50%{transform:scale(.9,1.1)}100%{transform:none}}
@keyframes splash{0%{transform:scale(1)}30%{transform:scale(1.35,.7)}60%{transform:scale(.9,1.15)}100%{transform:none}}

@media (max-width:600px){
  .top{gap:6px} .iconbtn{width:56px;height:56px;font-size:26px} .pill{min-height:50px;font-size:19px;padding:4px 12px} .pill .nm{display:none}
  .rulepics{font-size:32px} .prompt .judge{display:none}
}
/* Respect "reduce motion": nothing bounces, wiggles, flies or falls. Feedback stays as colour, glow outline and sound. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001ms!important}
  .confetti{display:none}
  .stamp.glow,.prompt.glow,.box.target{outline:5px solid var(--gold);outline-offset:3px}
}
</style>

<div id="app" role="main"></div>
<div id="ov"></div>
<script>
/*VOICE-START v1.0.0*/
/* ElzeeVoice v1.0.0 - one shared read-aloud voice for Elzee and its games (1.4.2).
   Source of truth: workspace/build142/elzee-voice.js, pasted unchanged between the VOICE markers of
   index.html and games/*.html (the pages are offline single files, so no <script src>).
   - Calm, natural voices first (iPad Safari: Ava Premium/Enhanced, Samantha Enhanced, Allison, Susan, Karen, Samantha).
   - Novelty voices (Fred, Zarvox, Bubbles, ...) are never used.
   - One calm rate (0.9) and normal pitch (1.0) everywhere, younger mode included.
   - Each kid picks their own voice in Elzee (🔈 on the top bar). It is saved on their profile as profile.voice
     in logicquest.v1; games only READ it (active profile). No network, on-device voices only. */
(function (root) {
  "use strict";
  var VERSION = "1.0.0", RATE = 0.9, PITCH = 1.0, MAIN_KEY = "logicquest.v1";
  var NOVELTY = /(^|[\s.\-_(])(Fred|Albert|Bad News|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Pipe Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Bahh|Junior|Ralph|Kathy|Deranged|Hysterical)($|[\s.\-_)])/i;
  var PREFER = [/^Ava\b.*\((Premium|Enhanced)\)/i, /^Samantha\b.*\(Enhanced\)/i, /^Allison\b/i, /^Susan\b/i, /^Karen\b/i, /^Samantha\b/i];
  // Friendly characters for the kids' voice cards (picture-only; no reading needed).
  var CHARS = [{ e: "🦉", n: "Owl" }, { e: "🐻", n: "Bear" }, { e: "🐰", n: "Bunny" }, { e: "🐢", n: "Turtle" }, { e: "🐳", n: "Whale" }];
  function isNovelty(v) { return !!v && (NOVELTY.test(String(v.name || "")) || NOVELTY.test(String(v.voiceURI || ""))); }
  function score(v) {
    var name = String(v.name || ""), i;
    for (i = 0; i < PREFER.length; i++) if (PREFER[i].test(name)) return i;
    return /^en[-_]US/i.test(v.lang || "") ? 20 : 30;
  }
  function voices() {
    var all = [];
    try { all = (root.speechSynthesis && root.speechSynthesis.getVoices && root.speechSynthesis.getVoices()) || []; } catch (e) { all = []; }
    var seen = {}, out = [];
    for (var i = 0; i < all.length; i++) {
      var v = all[i];
      if (!v || !/^en/i.test(v.lang || "") || v.localService === false || isNovelty(v) || seen[v.name]) continue; // on-device English only
      seen[v.name] = 1; out.push(v);
    }
    return out.map(function (v, i) { return { v: v, s: score(v), i: i }; })
      .sort(function (a, b) { return a.s - b.s || a.i - b.i; }).map(function (x) { return x.v; });
  }
  // Active Elzee profile, read only (games never write logicquest.v1).
  function activeProfile() {
    try {
      var d = JSON.parse(root.localStorage.getItem(MAIN_KEY));
      if (!d || !Array.isArray(d.profiles)) return null;
      for (var i = 0; i < d.profiles.length; i++) if (d.profiles[i] && d.profiles[i].id === d.activeId) return d.profiles[i];
    } catch (e) {}
    return null;
  }
  function prefFor(p) { return p && typeof p.voice === "string" && p.voice ? p.voice.slice(0, 100) : null; }
  function pick(name) {
    var list = voices();
    if (name) for (var i = 0; i < list.length; i++) if (list[i].name === name) return list[i];
    return list[0] || null; // calm default
  }
  // Voice cards for the kid picker: the best few voices, each with a friendly character.
  function choices(max) {
    var list = voices().slice(0, Math.min(max || CHARS.length, CHARS.length));
    return list.map(function (v, i) { return { name: v.name, lang: v.lang, emoji: CHARS[i].e, char: CHARS[i].n }; });
  }
  // Set voice, calm rate and normal pitch on an utterance. name undefined = the active profile's pick.
  function apply(u, name) {
    if (name === undefined) name = prefFor(activeProfile());
    var v = pick(name);
    if (v) { try { u.voice = v; } catch (e) { /* not a real voice object */ } u.lang = v.lang || "en-US"; } else u.lang = "en-US";
    u.rate = RATE; u.pitch = PITCH;
    api.last = v ? v.name : null;
    return u;
  }
  var api = { version: VERSION, RATE: RATE, PITCH: PITCH, CHARS: CHARS, isNovelty: isNovelty, voices: voices, pick: pick,
    choices: choices, apply: apply, prefFor: prefFor, activeProfile: activeProfile, last: null };
  root.ElzeeVoice = api;
})(typeof window !== "undefined" ? window : this);
/*VOICE-END*/
</script>
<script>
"use strict";
/* ==========================================================================
   BALLOON OR SANDBAG?: an Elzee reasoning game (strengthen vs weaken).
   A buddy makes a cause ➜ effect claim ("Eating carrots makes you run fast!"). Clue cards arrive one by one;
   the kid drags each clue to 🎈 (makes the claim stronger: the basket rises), a sandbag (weaker: it sinks),
   or the 💧 puddle (doesn't matter). Every clue's verdict comes from classify(structure) in the generator,
   and the hand-written clue sentences are reviewed in balloon-or-sandbag-dev/bank-review.md.
   Interlude contract v1 (logic-app/interlude-contract.md): launch params, ret, result record,
   no caps, rates from §6, never writes logicquest.v1.
   ========================================================================== */
const GAME = {
  id: "balloon-or-sandbag",
  storageKey: "logicquest.minigame.balloon-or-sandbag.v1", // this game's own key
  mainKey: "logicquest.v1",                                 // main app key: READ ONLY, never written here
  resultKey: "logicquest.interlude.result.v1",
};
const ECON = { round: 2, newTier: 2, perPuzzle: 0 }; // contract §6 generated-puzzle rates; no caps of any kind
const RM = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- clue bank + classifier (same file is benchmarked in balloon-or-sandbag-dev/bench.js) ---------- */
/*GEN-START*/
/* Balloon or Sandbag? clue bank + classifier + round generator.
   Every claim is a cause → effect claim ("eating carrots makes you run fast").
   Every clue is built from a STRUCTURE, never free text:
     group   : "C" (had the cause) | "notC" (did not) | "both"
     outcome : "E" (the effect happened) | "notE" (the opposite happened) | "other" (something unrelated)
     timing  : "before" = the effect was already there before the cause | null
     same    : true = with and without the cause came out the same
   classify() turns the structure into exactly one verdict with one fixed rule (a comparison of
   "with the cause" vs "without the cause", the kid-sized version of a controlled comparison):
     outcome "other"            → "puddle"  (doesn't matter)
     timing "before"            → "sandbag" (it happened before the cause, so the cause didn't make it)
     group "both" + same        → "sandbag" (with or without the cause, no difference)

  const b = $ov.querySelector(".saybtn"); b.dataset.say = $ov.querySelector(".panel").innerText.replace(/🔈|👍$/g, "").replace(/\s+/g, " ").trim();
}
/* ---------- start gate: one big ▶️ tap (unlocks speech and sound on iPad) ---------- */
function startScreen() {
  $ov.innerHTML = `<div class="ov"><div class="panel gate" role="dialog" aria-label="Start">
    <div class="judge" aria-hidden="true">${buddySVG("C", "yay")}</div>
    <button class="btn go" data-act="go" aria-label="Start">▶️</button></div></div>`;
}
function go() {
  started = true; Speech.unlock(); $ov.innerHTML = ""; Sound.pick();
  if (view === "play") fitCard();
  afterStart.splice(0).forEach(fn => setTimeout(fn, 300));
  Speech.flush();
}

/* ---------- navigation and exit (contract §4, §5) ---------- */
function toMenu() { Speech.stop(); $ov.innerHTML = ""; if (cur) saveCur(); view = "menu"; R = null; cur = null; render(); }
window.addEventListener("popstate", () => {
  if (INTERLUDE) { exitGame(session.solved ? "done" : "quit"); return; }
  if (view === "play" || $ov.innerHTML) toMenu();
});
function exitGame(status) {
  Speech.stop(); if (cur) saveCur();
  if (LAUNCH.elzee) {
    const now = Date.now();
    const rec = { v: 1, gameId: GAME.id, sid: LAUNCH.sid, step: LAUNCH.step, profileId: me.id, status: status === "done" ? "done" : "quit",
      rounds: INTERLUDE ? (session.finished ? 1 : 0) : kid().rounds, solved: session.solved, startedAt: session.startedAt, endedAt: now,
      durationMs: Math.max(0, now - session.startedAt), tokensEarned: session.tokens };
    try { localStorage.setItem(GAME.resultKey, JSON.stringify(rec)); } catch (e) { /* ignore */ }
    try { sessionStorage.removeItem("bs.session." + LAUNCH.sid); } catch (e) { /* ignore */ }
  }
  window.__bsExit = LAUNCH.ret; // for tests
  if (!window.__bsNoNav) location.replace(LAUNCH.ret);
}

/* ---------- input: buttons ---------- */
const ACTS = {
  go() { go(); },
  tier(el) { const t = +el.dataset.tier; Sound.pick(); if (!INTERLUDE) try { history.pushState({ pr: "play" }, ""); } catch (e) { /* ignore */ } startRound(t, true); },
  menu() { if (!INTERLUDE && history.state && history.state.pr === "play") history.back(); else toMenu(); },
  home() { exitGame(session.finished || session.solved ? "done" : "quit"); },
  back() { exitGame(session.solved ? "done" : "quit"); },
  again() { $ov.innerHTML = ""; if (!INTERLUDE) try { history.pushState({ pr: "play" }, ""); } catch (e) { /* ignore */ } startRound(curTier(), false); },
  next() { nextCard(); },
  hint() { hint(); },
  zone(el) { tapZone(el.dataset.stamp); },
  keep() { $ov.innerHTML = ""; },
  toggleYoung() { const k = kid(); k.young = !young(); Store.save(); if (view === "play" && cur && cur.young !== (young() && cur.tier === 1)) { toMenu(); } else render(); Speech.say(young() ? "Younger mode on! Pictures and talking." : "Big version! Words and tricky clues.", true); },
  toggleSound() { const k = kid(); k.sound = !soundOn(); Store.save(); if (!soundOn()) Speech.stop(); render(); },
  grown() { showGrown(); },
  closeOv() { $ov.innerHTML = ""; render(); },
  sayZone(el) { speakOrNudge(el.dataset.say, el); },
};
const NAV = ["tier", "menu", "home", "back", "again", "next", "go", "closeOv", "grown"];
let lastNav = 0;
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled || !ACTS[el.dataset.act]) return;
  if (NAV.includes(el.dataset.act)) { if (Date.now() - lastNav < 350) return; lastNav = Date.now(); }   // a double tap must not hit the next screen too
  if (young() && started && !["sayZone", "toggleYoung", "go", "hint", "next", "zone"].includes(el.dataset.act) && el.getAttribute("aria-label")) Speech.say(el.getAttribute("aria-label"));   // talking buttons
  ACTS[el.dataset.act](el);
});
/* Tap any picture with data-say (avatar, tokens, buddy card) to hear it. Pointer events: iOS sends no click for plain divs. */
document.addEventListener("pointerup", e => { const el = e.target.closest("[data-say]"); if (el && !el.closest("button, a") && !drag) speakOrNudge(el.dataset.say, el); });

/* ---------- input: drag the clue card onto 🎈 / sandbag / 💧 (finger, pencil, or mouse); tapping a spot works too ---------- */
let drag = null;
function clueGhost() {
  const s = document.getElementById("clue"); if (!s) return null;
  const g = document.createElement("div"); g.className = "dragghost clueghost"; g.innerHTML = s.querySelector(".cpics").innerHTML;
  document.body.appendChild(g); return g;
}
document.addEventListener("pointerdown", e => {
  const s = e.target.closest("#clue");
  if (!s || e.target.closest("button") || busy || !cur || cur.revealed || view !== "play" || $ov.innerHTML) return;
  e.preventDefault();
  drag = { id: e.pointerId, el: s, x0: e.clientX, y0: e.clientY, moving: false, ghost: null, hot: null };
  try { s.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
});
document.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moving && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) {
    drag.moving = true; Sound.pick(); drag.ghost = clueGhost(); drag.el.classList.add("lifted");
  }
  if (!drag.moving || !drag.ghost) return;
  const lift = e.pointerType === "touch" ? 40 : 0;
  placeGhost(drag.ghost, e.clientX, e.clientY - lift, "rotate(-4deg) scale(1.05)");
  let best = null, bd = Infinity;
  for (const z of document.querySelectorAll(".stamp[data-stamp]")) {
    const r = z.getBoundingClientRect(), d = Math.hypot(r.left + r.width / 2 - e.clientX, r.top + r.height / 2 - (e.clientY - lift));
    if (d < Math.max(r.width, r.height) * 0.95 && d < bd) { bd = d; best = z; }
  }
  if (best !== drag.hot) { drag.hot?.classList.remove("hot"); best?.classList.add("hot"); drag.hot = best; }
});
function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  d.el.classList.remove("lifted"); d.hot?.classList.remove("hot");
  if (!d.moving) return;   // a plain tap on the clue: younger mode hears it (data-say), nothing else happens
  if (!cancelled && d.hot) { judge(d.hot.dataset.stamp, d.ghost); return; }
  const g = d.ghost; if (!g) return;
  if (RM()) { g.remove(); return; }
  const home = d.el.getBoundingClientRect();
  g.classList.add("back"); placeGhost(g, home.left + home.width / 2, home.top + home.height / 2);
  setTimeout(() => g.remove(), 320);
}
function tapZone(zone) {   // a tap on a spot: the clue flies there by itself
  const s = document.getElementById("clue"); if (!s || busy || !cur || cur.revealed) return;
  const r = s.getBoundingClientRect(), g = clueGhost(); if (!g) return;
  placeGhost(g, r.left + r.width / 2, r.top + r.height / 2); void g.offsetWidth; judge(zone, g);
}
document.addEventListener("pointerup", e => endDrag(e, false));
document.addEventListener("pointercancel", e => endDrag(e, true));
/* ---------- soft time budget (contract §4.3) ---------- */
function tickBudget() {
  if (!INTERLUDE || session.finished || !started) return;
  const m = (Date.now() - session.startedAt) / 60000;
  if (m >= LAUNCH.min && !session.bannerShown) { session.bannerShown = true; if (view === "play" && !drag && !busy) renderPlay(); Speech.say("Last clue, then back to the trail!"); }
  if (m >= LAUNCH.min + 3 && !session.offerShown && !$ov.firstChild) {
    session.offerShown = true; const y = young();
    $ov.innerHTML = `<div class="ov"><div class="panel sayzone" role="dialog" aria-label="Back to the trail?"><h2>🗺️${y ? "" : " Time for the trail?"}</h2>
      <div class="row">${sayBtn("Time for the trail? Tap the roller coaster to keep playing, or the big button to go back to your adventure.", "btn ghost")}
      <button class="btn ghost" data-act="keep" aria-label="Keep playing"><span class="ico">🎢</span></button>
      <button class="btn" data-act="back" aria-label="Back to my adventure"><span class="ico">▶️</span>${y ? "" : "Back to my adventure"}</button></div></div></div>`;
    Speech.say("Time for the trail?");
  }
}
setInterval(tickBudget, 5000);

/* ---------- boot ---------- */
Store.load();
window.addEventListener("pagehide", () => { if (cur) saveCur(); });
window.addEventListener("storage", ev => { if (ev.key === GAME.mainKey) { me = readMainProfile(); if (!busy && !drag) render(); } });
let rz = 0; window.addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { if (view === "play" && !drag && !busy) renderPlay(); }); });
(function boot() {
  const k = kid(); Store.save();
  if (INTERLUDE) {
    try { history.replaceState({ pr: "base" }, ""); history.pushState({ pr: "game" }, ""); } catch (e) { /* ignore */ }
    startRound(curTier(), true);
  } else if (k.cur) { try { history.pushState({ pr: "play" }, ""); } catch (e) { /* ignore */ } startRound(k.cur.tier, true); }
  else render();
  startScreen(); // every boot: one big ▶️ tap, which unlocks speech on iPad
})();

/* Read-only hooks for automated tests (cannot change game state). */
window.BalloonSandbag = Object.freeze({
  classify, genRound, CLAIMS,
  state: () => JSON.parse(JSON.stringify({ view, R, cur, session, kid: kid(), launch: LAUNCH, started, young: young() })),
});
</script>
</body>
