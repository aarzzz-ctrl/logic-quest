<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Same device only: scripts and styles are inline. Fonts, the app icon, and version.json stay on this site. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; media-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7c4dff">
<link rel="icon" type="image/png" href="../icon-192.png">
<title>Squish Seats · Elzee</title>
<style>
/* Fredoka (SIL Open Font License, see ../OFL-Fredoka.txt), self-hosted. */
@font-face{font-family:"Fredoka";font-style:normal;font-weight:300 700;font-display:swap;src:url("../fredoka-latin.woff2") format("woff2")}
/* Visual language matches Elzee: cream background, purple brand, chunky 3D buttons. */
:root{
  --bg:#fff8e7; --ink:#2d2a4a; --muted:#7a7699; --card:#fff; --line:#e7e2f5;
  --brand:#7c4dff; --brand-d:#5a2fd6; --brand-l:#efe9ff;
  --good:#3ccf4e; --good-d:#2a9d38; --good-l:#e6fbe9;
  --oops:#ff9f43; --oops-d:#e07b15; --oops-l:#fff3e3;
  --gold:#ffc83d; --gold-d:#e0a400;
  --radius:22px;
  --font:"Fredoka","Chalkboard SE","Comic Sans MS","Arial Rounded MT Bold",system-ui,sans-serif;
  --seat:min(19vw,128px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:20px;line-height:1.3;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0}
#app{max-width:1120px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 30px) calc(env(safe-area-inset-left) + 16px)}
.hidden{display:none!important}

/* buttons */
.btn{border:none;border-radius:18px;padding:12px 24px;min-height:64px;min-width:64px;font-size:23px;font-weight:600;
  background:var(--good);color:#fff;box-shadow:0 5px 0 var(--good-d);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--good-d)}
.btn.brand{background:var(--brand);box-shadow:0 5px 0 var(--brand-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn[disabled]{background:#d9d6e6;box-shadow:0 5px 0 #bdb9cf;color:#fff}
.btn .ico{font-size:30px;line-height:1}
.iconbtn{border:none;background:#fff;border-radius:18px;width:60px;height:60px;font-size:30px;flex:none;
  box-shadow:0 4px 0 var(--line);display:inline-flex;align-items:center;justify-content:center;position:relative}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.iconbtn.on{background:var(--brand-l);box-shadow:0 4px 0 #cbbcff}
.modebtn{width:auto;min-width:60px;height:auto;min-height:60px;padding:6px 12px;gap:4px;flex-direction:column;font-size:13px;font-weight:700;line-height:1.1}
.modebtn small{font-size:13px;font-weight:700}

/* top bar */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px;min-height:56px;
  font-size:22px;font-weight:700;box-shadow:0 4px 0 var(--line)}
.pill .av{font-size:32px}
.pill .nm{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jar{display:inline-flex;align-items:center;gap:8px}
.jar b{color:var(--gold-d)}
.jarbar{width:90px;height:16px;border-radius:99px;background:#f1edfa;overflow:hidden}
.jarbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.spacer{flex:1}

/* map */
.hero{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.hero .buds{display:flex;gap:2px}
.hero .buds svg{width:62px;height:62px;animation:bob 2.4s ease-in-out infinite}
.hero .buds svg:nth-child(2){animation-delay:.3s}.hero .buds svg:nth-child(3){animation-delay:.6s}
.hero .buds svg:nth-child(4){animation-delay:.9s}.hero .buds svg:nth-child(5){animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-6px)}}
.bubble{background:#fff;border-radius:20px;padding:12px 18px;box-shadow:0 4px 0 var(--line);font-size:21px;flex:1}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.lvl{position:relative;border:none;background:#fff;border-radius:24px;box-shadow:0 6px 0 var(--line);min-height:150px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px}
.lvl:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.lvl .scene{font-size:50px;line-height:1}
.lvl .num{position:absolute;top:8px;left:12px;font-weight:700;color:var(--muted);font-size:20px}
.lvl .seatsdots{font-size:14px;letter-spacing:2px;color:var(--muted)}
.lvl .stars{font-size:22px;letter-spacing:2px}
.lvl.locked{background:#eeebf6;box-shadow:0 6px 0 #d9d6e6}
.lvl.locked .scene{filter:grayscale(1);opacity:.35}
.lvl.next{outline:5px solid var(--brand);outline-offset:-5px;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{outline-color:#b9a2ff}}
.nostar{filter:grayscale(1);opacity:.3}

/* play */
.play{display:grid;gap:16px;align-items:start;min-width:0}
.lcol{display:grid;gap:16px;min-width:0;max-width:100%}
@media (orientation:landscape) and (min-width:900px){
  .play{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .lcol{position:sticky;top:8px;align-self:start}
  .clues{padding-bottom:28px}
}
.stage{background:linear-gradient(#e9f7ff,#fdf6ff);border-radius:28px;padding:16px 12px 18px;box-shadow:0 6px 0 var(--line);position:relative;overflow:hidden;max-width:100%;min-width:0}
.stage .scenebg{position:absolute;right:10px;top:4px;font-size:44px;opacity:.55;pointer-events:none}
.stage .lvtitle{font-weight:700;font-size:22px;margin:0 0 10px 6px;min-height:28px}
.bench{display:flex;justify-content:center;gap:8px;padding:6px 0 0;min-width:0;max-width:100%}
.seat{flex:1 1 0;min-width:0;max-width:var(--seat);min-height:calc(var(--seat) + 20px);border-radius:22px;border:4px dashed #c9bdf3;background:rgba(255,255,255,.75);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 0 0;position:relative}
.seat .sn{font-weight:700;color:var(--brand-d);font-size:22px;line-height:1;margin-bottom:2px}
.seat .pips{font-size:9px;letter-spacing:1px;color:var(--brand)}
.seat.filled{border-style:solid;border-color:#b9a2ff;background:#fff}
.seat.target{border-color:var(--brand);background:var(--brand-l)}
.seat.lock{border-color:var(--gold-d)}
.seat .slot{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.seat .slot .tok{width:92%;height:auto;aspect-ratio:1}
.benchwood{height:18px;border-radius:0 0 14px 14px;background:#c98d5b;box-shadow:0 5px 0 #a26a3d;margin:0 auto;max-width:calc(var(--seat) * 5 + 60px)}
.tok{width:min(calc(var(--seat) - 14px),104px);height:min(calc(var(--seat) - 14px),104px);border:none;background:none;padding:0;touch-action:none;position:relative;
  display:flex;align-items:center;justify-content:center;border-radius:20px}
.tok svg{width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 4px 0 rgba(45,42,74,.12))}
.tok.sel{background:var(--brand-l);outline:4px solid var(--brand);animation:selpulse 1s ease-in-out infinite}
@keyframes selpulse{50%{transform:scale(1.06)}}
.tok.ghosted{opacity:.25}
.tok .pin{position:absolute;right:-2px;top:-6px;font-size:22px}
.tok.dance svg{animation:dance .6s ease-in-out infinite alternate}
@keyframes dance{0%{transform:translateY(0) rotate(-6deg)}100%{transform:translateY(-12px) rotate(6deg)}}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:calc(var(--seat) + 8px);background:#fff;border-radius:24px;
  box-shadow:0 6px 0 var(--line);padding:8px;border:4px solid transparent}
.tray.target{border-color:var(--brand);background:var(--brand-l)}
.tray .empty{align-self:center;color:var(--muted);font-size:34px}
.ctrls{display:flex;gap:12px;flex-wrap:wrap}
.ctrls .btn{flex:1}
.ctrls .btn.ghost{flex:0 0 auto}
.ghost-drag{position:fixed;z-index:50;pointer-events:none;width:110px;height:110px;transform:translate(-50%,-60%) scale(1.1)}
.ghost-drag svg{width:100%;height:100%}

/* clue cards */
.clues{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px;align-content:start;min-width:0}
.clue{background:#fff;border-radius:20px;box-shadow:0 5px 0 var(--line);border:4px solid var(--line);padding:8px 12px 12px;
  display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:0;max-width:100%}
.cluehead{display:flex;align-items:center;gap:8px;width:100%;min-height:48px}
.clue .cn{font-weight:700;color:var(--muted);font-size:18px}
.clue .say{width:48px;height:48px;font-size:24px;margin-left:auto}
.clue .pic{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;min-height:64px;max-width:100%;padding:2px 0}
.clue .txt{font-size:19px;text-align:center;line-height:1.3;padding:0 6px;max-width:100%}
.clue.ok{border-color:var(--good);background:var(--good-l)}
.clue.bad{border-color:#ff5d6c;background:#fff1f0;box-shadow:0 0 0 5px #ffb4bc, 0 5px 0 #e07b15;animation:wiggle .4s 2}
.clue .mark{font-size:26px;line-height:1;min-width:28px}
@keyframes wiggle{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mb{display:flex;gap:3px;padding:4px;background:#c98d5b;border-radius:12px;max-width:100%}
.mb .c{width:40px;height:40px;border-radius:9px;background:#fff6ec;display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto}
.mb .c.dim{background:#e9dccd}
.mb .c svg{width:36px;height:36px}
.mb .c.ghost svg{opacity:.45}
.ban{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.ban svg{width:100%;height:100%}
.chip{width:48px;height:48px;flex:none}
.chip svg{width:48px;height:48px}
.sym{font-size:26px;font-weight:700;color:var(--brand-d);display:flex;align-items:center}
.sym svg{display:block}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(45,42,74,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.panel{background:var(--bg);border-radius:28px;padding:22px;max-width:620px;width:100%;max-height:92vh;overflow:auto;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.12);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.panel h2{font-size:34px;margin-bottom:6px}
.bigstars{font-size:58px;letter-spacing:6px}
.bigstars span{display:inline-block;animation:pop .5s backwards}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.winbench{display:flex;justify-content:center;gap:4px;margin:8px 0}
.winbench .tok{width:76px;height:76px}
.coins{font-size:30px;font-weight:700;color:var(--gold-d);margin:8px 0}
.sticker{width:150px;height:150px;margin:8px auto;perspective:600px}
.sticker .inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:flip 1.1s .5s both}
@keyframes flip{0%{transform:rotateY(180deg)}100%{transform:rotateY(0)}}
.sticker .face,.sticker .back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;
  display:flex;align-items:center;justify-content:center}
.sticker .face{background:#fff;box-shadow:0 6px 0 var(--line);border:5px solid var(--gold)}
.sticker .back{background:var(--brand);transform:rotateY(180deg);font-size:60px;color:#fff}
.stk{position:relative;width:110px;height:110px}
.stk svg{width:100%;height:100%}
.stk .acc{position:absolute;right:-6px;bottom:-4px;font-size:44px}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;margin-top:12px}
.book .slot{background:#fff;border-radius:22px;box-shadow:0 5px 0 var(--line);padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:150px;justify-content:center}
.book .slot.no .stk{filter:grayscale(1) brightness(.3);opacity:.18}
.book .slot small{color:var(--muted);font-size:16px}
.muted{color:var(--muted)}
.left{text-align:left}
.legend{display:grid;gap:10px;margin:12px 0;text-align:left}
.legend div{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:8px 12px}
.hand{position:fixed;z-index:30;font-size:52px;pointer-events:none;animation:point 1s ease-in-out infinite;transform:translate(-20%,0)}
@keyframes point{50%{margin-top:14px}}
.confetti{position:fixed;top:-20px;z-index:60;width:12px;height:16px;border-radius:3px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.holdbtn{position:relative;overflow:hidden}
.holdbtn i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,93,108,.35)}
.note{background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 4px 0 var(--line);margin:10px 0;font-size:18px}
.dots{display:flex;justify-content:center;gap:10px;margin:10px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--brand);display:block}
.dots i.on{background:var(--brand)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.key{height:58px;border-radius:16px;border:none;background:#fff;font-size:28px;font-weight:700;box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.err{min-height:1.3em;color:#d23b4a;font-size:18px;font-weight:600;margin:4px 0}
.panel.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:640px){
  .clue .txt{font-size:17px}
  .mb .c{width:32px;height:32px}.mb .c svg{width:29px;height:29px}
  .chip,.chip svg{width:40px;height:40px}
  .pill{font-size:19px;padding:4px 12px}
  .jarbar{width:56px}
  .btn{font-size:20px;padding:10px 16px}
  .top{gap:6px} .top .iconbtn{width:52px;height:52px;font-size:26px} .pill{min-height:52px}
}
</style>
</head>
<body>
<div id="app" role="main"></div>
<div id="ov"></div>
<script>
"use strict";
/* ==========================================================================
   SQUISH SEATS: a seating-logic mini-game for Elzee.
   Buddies need seats; picture clue cards say who sits where. Every level has
   exactly one answer and every clue is needed (verified offline by brute force).
   ========================================================================== */

const GAME = {
  id: "squishseats",
  storageKey: "logicquest.minigame.squishseats.v1", // this game's own key
  mainKey: "logicquest.v1",                          // main app key: READ ONLY, never written here
};
const BUILD = "1.3.3";
const ECON = {
  firstClear: 3,        // first time a level is solved
  firstThreeStars: 2,   // first time a level earns 3 stars
  replay: 1,            // solving an already-cleared level
  replayPaidPerDay: Infinity, // no daily limit on replay tokens (Aaron, Oct 3)
};

/* ---------- buddies (inline SVG, no image files) ---------- */
const BUDDIES = {
  D: { name: "Dumpling", full: "Dumpling Detective" },
  C: { name: "Capybara", full: "Capybara Judge" },
  A: { name: "Axolotl",  full: "Axolotl" },
  B: { name: "Bunny",    full: "Mochi Bunny" },
  F: { name: "Frog",     full: "Boba Frog" },
};
function face(ey, mood, opt = {}) {
  const sp = opt.sp || 12, cx = 50;
  const eyes = mood === "yay"
    ? `<path d="M${cx-sp-5} ${ey+1} q5 -7 10 0 M${cx+sp-5} ${ey+1} q5 -7 10 0" stroke="#2d2a4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>`
    : `<circle cx="${cx-sp}" cy="${ey}" r="4.8" fill="#2d2a4a"/><circle cx="${cx+sp}" cy="${ey}" r="4.8" fill="#2d2a4a"/>
       <circle cx="${cx-sp+1.6}" cy="${ey-1.8}" r="1.6" fill="#fff"/><circle cx="${cx+sp+1.6}" cy="${ey-1.8}" r="1.6" fill="#fff"/>`;
  const m = ey + (opt.my || 9);
  const mouth = mood === "sad" ? `<path d="M${cx-5} ${m+4} q5 -6 10 0" stroke="#2d2a4a" stroke-width="3" fill="none" stroke-linecap="round"/>`
    : mood === "yay" ? `<path d="M${cx-6} ${m-1} q6 10 12 0 z" fill="#e35d7a" stroke="#2d2a4a" stroke-width="2.5" stroke-linejoin="round"/>`
    : `<path d="M${cx-5} ${m} q5 5 10 0" stroke="#2d2a4a" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const brow = mood === "sad" ? `<path d="M${cx-sp-6} ${ey-9} l9 3 M${cx+sp+6} ${ey-9} l-9 3" stroke="#2d2a4a" stroke-width="2.5" stroke-linecap="round"/>` : "";
  return `${eyes}${brow}<ellipse cx="${cx-sp-9}" cy="${ey+8}" rx="6" ry="3.6" fill="#ff8fab" opacity=".55"/>
    <ellipse cx="${cx+sp+9}" cy="${ey+8}" rx="6" ry="3.6" fill="#ff8fab" opacity=".55"/>${mouth}`;
}
function buddySVG(id, mood = "happy") {
  let body = "";
  if (id === "D") body = `
    <path d="M10 72 Q10 40 50 32 Q90 40 90 72 Q90 88 50 88 Q10 88 10 72Z" fill="#fff3dc" stroke="#e5c995" stroke-width="3"/>
    <path d="M34 37 q4 -7 8 0 M46 33 q4 -7 8 0 M58 37 q4 -7 8 0" stroke="#e5c995" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M30 34 Q34 12 52 12 Q68 13 72 30 Z" fill="#9b6b43"/><path d="M24 33 Q50 24 80 31 Q52 38 24 33Z" fill="#7a5233"/>
    <path d="M40 18 l10 -6 l3 4" stroke="#c99b6b" stroke-width="3" fill="none"/>${face(60, mood)}`;
  else if (id === "C") body = `
    <circle cx="26" cy="30" r="7" fill="#a86f42"/><circle cx="74" cy="30" r="7" fill="#a86f42"/>
    <rect x="12" y="26" width="76" height="64" rx="30" fill="#c48a5a"/>
    <g fill="#fff" stroke="#ddd" stroke-width="2"><circle cx="38" cy="24" r="9"/><circle cx="50" cy="20" r="9.5"/><circle cx="62" cy="24" r="9"/>
    <circle cx="15" cy="48" r="8"/><circle cx="13" cy="62" r="8"/><circle cx="85" cy="48" r="8"/><circle cx="87" cy="62" r="8"/></g>
    <ellipse cx="50" cy="71" rx="19" ry="12" fill="#a86f42"/>
    <ellipse cx="44" cy="66" rx="2.5" ry="1.6" fill="#5b3a22"/><ellipse cx="56" cy="66" rx="2.5" ry="1.6" fill="#5b3a22"/>
    ${face(50, mood, { my: 24, sp: 14 })}`;
  else if (id === "A") body = `
    <g fill="#ff7aa2"><rect x="2" y="34" width="22" height="9" rx="4.5" transform="rotate(-25 13 38)"/><rect x="0" y="49" width="22" height="9" rx="4.5"/>
    <rect x="2" y="63" width="22" height="9" rx="4.5" transform="rotate(25 13 67)"/>
    <rect x="76" y="34" width="22" height="9" rx="4.5" transform="rotate(25 87 38)"/><rect x="78" y="49" width="22" height="9" rx="4.5"/>
    <rect x="76" y="63" width="22" height="9" rx="4.5" transform="rotate(-25 87 67)"/></g>
    <ellipse cx="50" cy="60" rx="35" ry="29" fill="#ffc2d4" stroke="#f59ab8" stroke-width="3"/>${face(56, mood, { sp: 14 })}`;
  else if (id === "B") body = `
    <ellipse cx="36" cy="26" rx="9" ry="21" fill="#e3d6ff" stroke="#c4b0f5" stroke-width="3"/><ellipse cx="36" cy="28" rx="4" ry="13" fill="#ffc2d4"/>
    <ellipse cx="64" cy="26" rx="9" ry="21" fill="#e3d6ff" stroke="#c4b0f5" stroke-width="3"/><ellipse cx="64" cy="28" rx="4" ry="13" fill="#ffc2d4"/>
    <ellipse cx="50" cy="64" rx="36" ry="27" fill="#e3d6ff" stroke="#c4b0f5" stroke-width="3"/>${face(60, mood)}`;
  else if (id === "F") body = `
    <circle cx="32" cy="38" r="14" fill="#8fd16a" stroke="#6cb14a" stroke-width="3"/><circle cx="68" cy="38" r="14" fill="#8fd16a" stroke="#6cb14a" stroke-width="3"/>
    <ellipse cx="50" cy="64" rx="38" ry="26" fill="#8fd16a" stroke="#6cb14a" stroke-width="3"/>
    <ellipse cx="50" cy="74" rx="22" ry="12" fill="#c9efb0"/>

/* ---------- rules ---------- */
const posOf = (seats, b) => seats.indexOf(b);
const RULES = {
  at:          (s, [b, i]) => posOf(s, b) === i,
  notAt:       (s, [b, i]) => posOf(s, b) !== i,
  end:         (s, [b]) => posOf(s, b) === 0 || posOf(s, b) === s.length - 1,
  notEnd:      (s, [b]) => posOf(s, b) > 0 && posOf(s, b) < s.length - 1,
  before:      (s, [a, b]) => posOf(s, a) < posOf(s, b),
  rightBefore: (s, [a, b]) => posOf(s, b) - posOf(s, a) === 1,
  nextTo:      (s, [a, b]) => Math.abs(posOf(s, a) - posOf(s, b)) === 1,
  notNextTo:   (s, [a, b]) => Math.abs(posOf(s, a) - posOf(s, b)) !== 1,
  between:     (s, [a, m, b]) => { const x = posOf(s, a), y = posOf(s, m), z = posOf(s, b); return (x < y && y < z) || (z < y && y < x); },
};
const clueOk = (seats, [t, ...args]) => RULES[t](seats, args);
const N = id => BUDDIES[id].name;
function clueText([t, a, b, c]) {
  switch (t) {
    case "at": return `${N(a)} sits in seat\u00A0${b + 1}.`;
    case "notAt": return `${N(a)} does NOT sit in seat\u00A0${b + 1}.`;
    case "end": return `${N(a)} sits at an end.`;
    case "notEnd": return `${N(a)} does NOT sit at an end.`;
    case "before": return `${N(a)} sits somewhere to the LEFT of ${N(b)}.`;
    case "rightBefore": return `${N(a)} sits just LEFT of ${N(b)}. They touch.`;
    case "nextTo": return `${N(a)} and ${N(b)} sit side by side.`;
    case "notNextTo": return `${N(a)} and ${N(b)} do NOT sit side by side.`;
    case "between": return `${N(b)} sits somewhere between ${N(a)} and ${N(c)}.`;
  }
  return "";
}
function miniBench(n, cells) {
  let h = `<div class="mb">`;
  for (let i = 0; i < n; i++) {
    const c = cells[i] || {};
    h += `<div class="c ${c.dim ? "dim" : ""} ${c.ghost ? "ghost" : ""}"${c.b ? ` data-who="${c.b}"` : ""}>${c.b ? buddySVG(c.b) : ""}${c.ban ? `<span class="ban">${BAN_SVG}</span>` : ""}</div>`;
  }
  return h + `</div>`;
}
const chip = b => `<span class="chip" data-who="${b}">${buddySVG(b)}</span>`;
function cluePic([t, a, b, c], n) {
  const cells = [];
  switch (t) {
    case "at": cells[b] = { b: a }; return miniBench(n, cells);
    case "notAt": cells[b] = { b: a, ban: true }; return miniBench(n, cells);
    case "end": for (let i = 0; i < n; i++) cells[i] = (i === 0 || i === n - 1) ? { b: a, ghost: true } : { dim: true }; return miniBench(n, cells);
    case "notEnd": for (let i = 0; i < n; i++) cells[i] = (i === 0 || i === n - 1) ? { ban: true, dim: true } : { b: a, ghost: true }; return miniBench(n, cells);
    case "before": return `${chip(a)}<span class="sym">${ARROW_SVG}</span>${chip(b)}`;
    case "rightBefore": return miniBench(2, [{ b: a }, { b: b }]);
    case "nextTo": return `${miniBench(2, [{ b: a }, { b: b }])}<span class="sym">${SWAP_SVG}</span>`;
    case "notNextTo": return `<span style="position:relative;display:inline-flex">${miniBench(2, [{ b: a }, { b: b }])}<span class="ban">${BAN_SVG}</span></span>`;
    case "between": return `${chip(a)}<span class="sym">${DOTS_SVG}</span>${chip(b)}<span class="sym">${DOTS_SVG}</span>${chip(c)}`;

}

function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

/* ---------- this game's own store ---------- */
const Store = {
  data: null,
  load() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(GAME.storageKey)); } catch (e) { raw = null; }
    const d = { version: 1, kids: {} };
    if (raw && typeof raw === "object" && raw.kids && typeof raw.kids === "object") {
      for (const [id, k] of Object.entries(raw.kids)) {
        if (!k || typeof k !== "object") continue;
        const progress = {};
        for (const [li, v] of Object.entries(k.progress && typeof k.progress === "object" ? k.progress : {})) {
          if (/^\d+$/.test(li) && +li < LEVELS.length && v && typeof v === "object") progress[li] = { stars: Math.min(3, num(v.stars)), clears: num(v.clears) };
        }
        const paid = {};
        for (const [li, v] of Object.entries(k.paid && typeof k.paid === "object" ? k.paid : {})) if (/^\d+$/.test(li) && +li < LEVELS.length) paid[li] = num(v) & 3;
        for (const [li, v] of Object.entries(progress)) paid[li] = num(paid[li]) | (v.clears ? 1 : 0) | (v.stars >= 3 ? 2 : 0);
        d.kids[String(id).slice(0, 40)] = {
          progress, paid,
          day: typeof k.day === "string" ? k.day : null,
          earnedToday: num(k.earnedToday), replayPaidToday: num(k.replayPaidToday),
          pending: num(k.pending), lifetime: num(k.lifetime),
          noRead: typeof k.noRead === "boolean" ? k.noRead : null,
          sound: typeof k.sound === "boolean" ? k.sound : null,
          puzzle: k.puzzle && typeof k.puzzle === "object" ? k.puzzle : null,
          gateLockUntil: num(k.gateLockUntil), gateFails: num(k.gateFails),
        };
      }
    }

  },
  save() { try { localStorage.setItem(GAME.storageKey, JSON.stringify(this.data)); } catch (e) { /* private mode / full */ } },
};
let me = readMainProfile();
function kid() {
  const d = Store.data;
  if (!d.kids[me.id]) d.kids[me.id] = { progress: {}, paid: {}, day: null, earnedToday: 0, replayPaidToday: 0, pending: 0, lifetime: 0, noRead: null, sound: null, puzzle: null, gateLockUntil: 0, gateFails: 0 };
  const k = d.kids[me.id];
  if (!k.paid || typeof k.paid !== "object") k.paid = {};

}
const noRead = () => { const k = kid(); return k.noRead === null ? me.little : k.noRead; };
const soundOn = () => { const k = kid(); return k.sound === null ? me.sound : k.sound; };
const isCleared = li => !!(kid().progress[li] && kid().progress[li].clears);

/* Award tokens for a solve. Returns a breakdown. No daily cap; each first-clear / 3-star reward is paid once per kid, ever. */
function award(li, stars) {
  const k = kid(), prev = k.progress[li] || { stars: 0, clears: 0 };
  const lines = []; let want = 0;
  const paid = num(k.paid[li]);
  if (!prev.clears && !(paid & 1)) { want += ECON.firstClear; lines.push(["first", ECON.firstClear]); k.paid[li] = num(k.paid[li]) | 1; }
  else if (k.replayPaidToday < ECON.replayPaidPerDay) { want += ECON.replay; lines.push(["replay", ECON.replay]); k.replayPaidToday++; }
  if (stars === 3 && prev.stars < 3 && !(paid & 2)) { k.paid[li] = num(k.paid[li]) | 2; want += ECON.firstThreeStars; lines.push(["stars", ECON.firstThreeStars]); }
  const got = want; // no daily cap: every reward is paid in full, once (see k.paid)
  k.earnedToday += got; k.pending += got; k.lifetime += got;
  const newSticker = !prev.clears;
  k.progress[li] = { stars: Math.max(prev.stars, stars), clears: prev.clears + 1 };
  Store.save();
  return { want, got, capped: false, lines, newSticker };
}

/* ---------- sound + optional speech (all on-device) ---------- */
const Sound = {
  ctx: null,
  play(notes) {
    if (!soundOn()) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = this.ctx || new AC();
      if (this.ctx.state === "suspended" && this.ctx.resume) this.ctx.resume().catch(() => {});
      let t = this.ctx.currentTime;
      for (const [f, dur] of notes) {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = "triangle"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02); t += dur * 0.75;
      }
    } catch (e) { /* no audio */ }
  },
  tap() { this.play([[600, .05]]); }, pick() { this.play([[520, .06], [700, .06]]); },
  good() { this.play([[660, .12], [880, .18]]); }, oops() { this.play([[330, .18], [294, .22]]); },
  win() { this.play([[523, .14], [659, .14], [784, .14], [1047, .3]]); },
};
const Speech = {
  ok: "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function",

      this.cur = u; speechSynthesis.speak(u);
    } catch (e) {}
  },
  stop() { if (this.ok) try { speechSynthesis.cancel(); } catch (e) {} },
};

        </div>

        ${nr ? "" : `<div class="txt">${esc(clueText(c))}</div>`}
      </div>`; }).join("")}</div>
  </div>`;
  placeHand();
}

/* Tutorial hand on level 1 until it is first cleared (pure visual cue, no reading needed). */
function placeHand() {
  document.querySelectorAll(".hand").forEach(h => h.remove());
  if (view !== "play" || !play || play.li !== 0 || isCleared(0) || play.done || $ov.innerHTML) return;
  let target = null;
  if (play.seats.every(Boolean)) target = document.querySelector('[data-act="check"]');
  else if (play.sel) target = document.querySelector(".seat:not(.filled)");
  else target = document.querySelector(".tray .tok");
  if (!target) return;
  const r = target.getBoundingClientRect(), h = document.createElement("div");
  h.className = "hand"; h.textContent = "👆"; h.setAttribute("aria-hidden", "true");
  h.style.left = (r.left + r.width / 2) + "px"; h.style.top = (r.top + r.height * 0.55) + "px";
  document.body.appendChild(h);
}

function place(b, target) {
  if (!play || play.done || play.locked.has(b)) { if (play && play.locked.has(b)) Sound.oops(); return; }
  const from = play.seats.indexOf(b);
  if (target === "tray") { if (from >= 0) play.seats[from] = null; }
  else {
    const occ = play.seats[target];
    if (occ === b) { play.sel = null; return render(); }
    if (occ && play.locked.has(occ)) { Sound.oops(); return; }
    play.seats[target] = b;
    if (from >= 0) play.seats[from] = occ || null;
  }
  play.sel = null; play.status = null; Sound.tap(); savePuzzle(); render();
}

function check() {
  const L = LEVELS[play.li];
  if (!play.seats.every(Boolean) || play.done) return;
  play.checks++;
  play.status = L.c.map(c => clueOk(play.seats, c));
  if (play.status.every(Boolean)) {
    play.done = true;
    kid().puzzle = null;
    const stars = Math.max(1, 3 - Math.min(2, (play.checks - 1) + play.hints));
    const res = award(play.li, stars);
    render(); Sound.win(); confetti();
    setTimeout(() => showWin(stars, res), 700);
  } else {
    Sound.oops(); savePuzzle(); render();
    const badCard = document.querySelector(".clue.bad");
    if (badCard) badCard.scrollIntoView({ block: "nearest", inline: "nearest" });
    if (!noRead()) toastNote("Some clue cards say ❌. Swap buddies and try again!");
  }
}

function hint() {
  if (!play || play.done) return;
  const sol = LEVELS[play.li].sol;
  // Pin the first buddy that isn't in its right seat yet. Hints lower the star score but never block progress.
  for (let i = 0; i < sol.length; i++) {
    const b = sol[i];
    if (play.seats[i] === b) { play.locked.add(b); continue; }
    const from = play.seats.indexOf(b), occ = play.seats[i];
    if (from >= 0) play.seats[from] = null;
    play.seats[i] = b; play.locked.add(b);
    if (occ && from >= 0) play.seats[from] = occ; // swap the one we bumped
    play.hints++; play.status = null; play.sel = null; Sound.pick(); savePuzzle(); render();
    return;
  }
}

function showWin(stars, res) {
  document.querySelectorAll(".hand").forEach(h => h.remove());
  const nr = noRead(), [sb, acc] = STICKERS[play.li];
  const nextOk = play.li + 1 < LEVELS.length;
  const words = { first: "First solve", replay: "Replay", stars: "3 stars!" };
  $ov.innerHTML = `<div class="ov"><div class="panel" role="dialog" aria-label="Level solved">
    <h2>${nr ? "🎉" : "🎉 Everyone's happy!"}</h2>
    <div class="winbench">${play.seats.map(b => `<span class="tok dance">${buddySVG(b, "yay")}</span>`).join("")}</div>
    <div class="bigstars">${[0, 1, 2].map(i => `<span style="animation-delay:${.2 + i * .2}s" class="${i < stars ? "" : "nostar"}">⭐</span>`).join("")}</div>
    <div class="coins">+${res.got} 🪙</div>
    ${!nr && !res.capped && res.lines.length ? `<div class="muted" style="font-size:17px">${res.lines.map(([k, v]) => `${words[k]} +${v}`).join(" · ")}</div>` : ""}
    ${res.capped ? `<div class="note" data-jar="full">${nr ? "🪙✅🌙" : (res.got ? `Your token jar is almost full, so you got ${res.got} token${res.got === 1 ? "" : "s"} today. Come back tomorrow for more!` : "Your token jar is full for today, so you get 0 tokens. You still did great! Come back tomorrow for more. You can always keep playing.")}</div>` : ""}
    ${res.newSticker ? `<div class="sticker" aria-label="New sticker: ${BUDDIES[sb].full}"><div class="inner"><div class="face"><div class="stk">${buddySVG(sb, "yay")}<span class="acc">${acc}</span></div></div><div class="back">?</div></div></div>
      ${nr ? "" : `<div class="muted">New sticker for your book!</div>`}` : ""}
    <div class="row">
      <button class="btn ghost" data-act="map" aria-label="Back to levels"><span class="ico">🗺️</span></button>
      <button class="btn ghost" data-act="replay" aria-label="Play again"><span class="ico">🔁</span></button>
      ${nextOk ? `<button class="btn" data-act="next" aria-label="Next level"><span class="ico">▶️</span>${nr ? "" : "Next"}</button>` : ""}
    </div></div></div>`;
  if (soundOn()) Speech.say(res.got ? `Everyone is happy! You earned ${res.got} tokens!` : "Everyone is happy! Your token jar is full for today.");
}

function showBook() {
  const nr = noRead();
  $ov.innerHTML = `<div class="ov"><div class="panel" role="dialog" aria-label="Sticker book">
    <h2>📒 ${nr ? "" : "Sticker Book"}</h2>
    <div class="book">${STICKERS.map(([b, acc], i) => {
      const got = isCleared(i);
      return `<div class="slot ${got ? "" : "no"}"><div class="stk">${buddySVG(b)}<span class="acc">${got ? acc : ""}</span></div>
        <small>${LEVELS[i].scene} ${i + 1}</small></div>`; }).join("")}</div>
    <div class="row"><button class="btn" data-act="closeOv" aria-label="Close"><span class="ico">👍</span></button></div></div></div>`;
}

function showGrown() {
  const k = kid();
  $ov.innerHTML = `<div class="ov"><div class="panel left" role="dialog" aria-label="For grown-ups">
    <h2 style="text-align:center">For grown-ups</h2>
    <p><b>What it practices:</b> spatial and ordering logic (left/right, ends, next to, between), negation (“NOT”), and using several clues at once, the same skills as the <i>Line Up!</i> track.</p>
    <p><b>Tokens:</b> earned only by solving puzzles. First solve +${ECON.firstClear}, first 3-star solve +${ECON.firstThreeStars}, replays +${ECON.replay} (up to ${ECON.replayPaidPerDay} a day). No daily limit. No purchases, no ads, no timers, nothing lost for missing a day.</p>
    <div class="note">Player: ${esc(me.avatar)} ${esc(me.name)} ${me.linked ? "(from Elzee)" : "(no Elzee player found on this device)"}<br>
      Today: ${k.earnedToday} · Waiting to go into the Elzee jar: <b>${k.pending}</b> · All-time: ${k.lifetime}</div>
    <p class="muted" style="font-size:16px">Tokens from this game move into the kid's Elzee jar the next time Elzee's home screen opens. Picture mode hides all words; 🔈 buttons read clues aloud with the device's own voice.</p>
    <p class="muted" style="font-size:16px">A grown-up has to answer a question, or enter the PIN, before the button below will work. Then hold it for 2 seconds to reset this kid's puzzle progress and stickers. Rewards already paid are remembered, so a reset never pays them twice.</p>
    <div class="row"><button class="btn ghost holdbtn" data-hold="reset" aria-label="Hold to reset puzzle progress"><i></i>Hold to reset</button>
      <button class="btn" data-act="closeOv">Close</button></div></div></div>`;
}

function toastNote(msg) {
  const el = document.createElement("div");
  el.className = "note"; el.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:45;max-width:90vw";
  el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
}
function confetti(n = 70) {
  const colors = ["#7c4dff", "#3ccf4e", "#ffc83d", "#ff6b3d", "#ff8fab", "#4dc3ff"];
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div"); c.className = "confetti";
    c.style.left = Math.random() * 100 + "%"; c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.6) + "s"; c.style.animationDelay = (Math.random() * .4) + "s";
    document.body.appendChild(c); setTimeout(() => c.remove(), 3800);
  }
}

function render() {
  Speech.stop();
  if (view !== "play" || !play || !play.done) document.querySelectorAll(".confetti").forEach(c => c.remove());
  if (view === "play" && play) renderPlay(); else { view = "map"; play = null; renderMap(); }
}

/* ---------- input: buttons ---------- */
const ACTS = {
  map() { resetArmed = false; $ov.innerHTML = ""; view = "map"; play = null; render(); window.scrollTo(0, 0); checkGameUpdate(); },
  start(el) { const li = +el.dataset.li; if (isUnlocked(li)) { Sound.tap(); startLevel(li); } },
  locked() { Sound.oops(); },
  toggleRead() { kid().noRead = !noRead(); Store.save(); render(); },
  toggleSound() { kid().sound = !soundOn(); Store.save(); if (!soundOn()) Speech.stop(); render(); },
  book() { showBook(); }, grown() { showGrown(); },
  closeOv() { resetArmed = false; $ov.innerHTML = ""; render(); },
  check() { check(); }, hint() { hint(); },
  clear() { if (!play || play.done) return; play.seats = play.seats.map(b => (b && play.locked.has(b) ? b : null)); play.sel = null; play.status = null; Sound.tap(); savePuzzle(); render(); },
  say(el) { const c = LEVELS[play.li].c[+el.dataset.ci]; if (c) Speech.say(clueText(c)); },
  replay() { $ov.innerHTML = ""; startLevel(play.li); },
  next() { $ov.innerHTML = ""; startLevel(Math.min(LEVELS.length - 1, play.li + 1)); },
};
// Taps on buddies are handled on pointerup (below); the click that follows lands on a buddy or a re-rendered (detached) node and is ignored.
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled && ACTS[el.dataset.act]) { ACTS[el.dataset.act](el); return; }
  if (!play || play.done || view !== "play" || e.target.closest("[data-buddy]")) return;
  // Tap an empty spot after picking a buddy.
  const seat = e.target.closest("[data-seat]"), tray = e.target.closest("[data-tray]");
  if (play.sel && seat) place(play.sel, +seat.dataset.seat);
  else if (play.sel && tray) place(play.sel, "tray");
});

/* ---------- input: drag or tap buddies (pointer events: finger, pencil, or mouse) ---------- */
let drag = null;
document.addEventListener("pointerdown", e => {
  const tok = e.target.closest("[data-buddy]");
  if (!tok || !play || play.done || !tok.closest("#app")) return;
  e.preventDefault();
  drag = { b: tok.dataset.buddy, x: e.clientX, y: e.clientY, el: tok, moving: false, ghost: null, id: e.pointerId };
  try { tok.setPointerCapture(e.pointerId); } catch (err) {}
});
document.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moving && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 10 && !play.locked.has(drag.b)) {
    drag.moving = true;
    drag.ghost = document.createElement("div"); drag.ghost.className = "ghost-drag"; drag.ghost.innerHTML = buddySVG(drag.b);
    document.body.appendChild(drag.ghost); drag.el.classList.add("ghosted");
    document.querySelectorAll(".hand").forEach(h => h.remove());
  }
  if (drag.moving) {
    drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
    document.querySelectorAll(".seat.target,.tray.target").forEach(x => x.classList.remove("target"));
    const hit = dropTarget(e.clientX, e.clientY); if (hit) hit.classList.add("target");
  }
});
function dropTarget(x, y) {
  const el = document.elementFromPoint(x, y);
  return el ? el.closest("[data-seat],[data-tray]") : null;
}
function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (d.ghost) d.ghost.remove();
  if (cancelled) return render();
  if (d.moving) {
    const hit = dropTarget(e.clientX, e.clientY);
    if (hit && hit.dataset.seat !== undefined) place(d.b, +hit.dataset.seat);
    else if (hit && hit.dataset.tray) place(d.b, "tray");
    else render();
    return;
  }
  // A tap: select / deselect, or swap with the selected buddy.
  if (play.locked.has(d.b)) { Sound.oops(); return; }
  if (play.sel === d.b) { play.sel = null; render(); return; }
  if (play.sel) {
    const at = play.seats.indexOf(d.b);
    if (at >= 0) return place(play.sel, at);          // drop the picked buddy onto this one's seat (swap)
    if (play.seats.includes(play.sel)) { play.sel = d.b; Sound.pick(); render(); return; }
  }
  play.sel = d.b; Sound.pick(); render();
}
document.addEventListener("pointerup", e => endDrag(e, false));
document.addEventListener("pointercancel", e => endDrag(e, true));

/* Grown-up gate for Hold to reset. Reads the Elzee PIN if one exists; never writes logicquest.v1.
   Lockouts live on this kid's game record so a wrong try can't touch the token jar. */
function sha256(text) {
  const rr = (v, n) => (v >>> n) | (v << (32 - n));
  const K = [], H = [];
  for (let p = 2, c = 0; c < 64; p++) {
    let prime = true; for (let i = 2; i * i <= p; i++) if (p % i === 0) { prime = false; break; }
    if (!prime) continue;
    if (c < 8) H[c] = (Math.pow(p, 1 / 2) * 4294967296) | 0;
    K[c++] = (Math.pow(p, 1 / 3) * 4294967296) | 0;
  }
  const bytes = Array.from(new TextEncoder().encode(String(text)));
  const bitLen = bytes.length * 8;
  bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (bitLen >>> (i * 8)) & 255);
  const w = new Array(64);
  for (let j = 0; j < bytes.length; j += 64) {
    for (let i = 0; i < 16; i++) w[i] = (bytes[j + 4 * i] << 24) | (bytes[j + 4 * i + 1] << 16) | (bytes[j + 4 * i + 2] << 8) | bytes[j + 4 * i + 3];
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
}
const hashPin = (salt, pin) => sha256(`${GAME.mainKey}:${salt}:${pin}`);
function readParentAuth() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(GAME.mainKey)); } catch (e) { raw = null; }
  if (!raw || typeof raw !== "object") return { kind: "math" };
  if (typeof raw.pinHash === "string" && /^[0-9a-f]{64}$/.test(raw.pinHash) && typeof raw.pinSalt === "string" && raw.pinSalt)
    return { kind: "pin", salt: raw.pinSalt, hash: raw.pinHash };
  if (typeof raw.pin === "string" && /^\d{4}$/.test(raw.pin)) return { kind: "plain", pin: raw.pin };
  return { kind: "math" };
}
function waitText(until) {
  const s = Math.max(1, Math.ceil((until - Date.now()) / 1000));
  if (s > 90) { const m = Math.ceil(s / 60); return m === 1 ? "1 minute" : `${m} minutes`; }
  return s === 1 ? "1 second" : `${s} seconds`;
}
function paintGate({ title, msg, length, onSubmit }) {
  let value = "";
  $ov.innerHTML = `<div class="ov"><div class="panel" role="dialog" aria-label="${esc(title)}">
    <h2 style="font-size:28px">${esc(title)}</h2>
    <p>${esc(msg)}</p>
    <div class="dots">${"<i></i>".repeat(length)}</div>
    <div class="err" data-err></div>
    <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => `<button class="key" data-k="${k}">${k}</button>`).join("")}
      <button class="key" data-k="cancel" aria-label="Cancel">Cancel</button><button class="key" data-k="0">0</button>
      <button class="key" data-k="back" aria-label="Delete">⌫</button></div>
  </div></div>`;
  const panel = $ov.querySelector(".panel");
  const dots = [...$ov.querySelectorAll(".dots i")];
  const err = $ov.querySelector("[data-err]");
  const paint = () => dots.forEach((d, i) => d.classList.toggle("on", i < value.length));
  const api = {
    error(text) { err.textContent = text; panel.classList.remove("shake"); void panel.offsetWidth; panel.classList.add("shake"); value = ""; paint(); },
  };
  $ov.querySelector(".keypad").addEventListener("click", e => {
    const k = e.target.closest("[data-k]"); if (!k) return;
    const key = k.dataset.k;
    if (key === "cancel") { showGrown(); return; }
    if (key === "back") { value = value.slice(0, -1); paint(); return; }
    if (value.length >= length) return;
    value += key; err.textContent = ""; paint();
    if (value.length === length) { const v = value; setTimeout(() => { if (panel.isConnected) onSubmit(v, api); }, 120); }
  });
}
function armReset() {
  resetArmed = true;
  const k = kid(); k.gateFails = 0; k.gateLockUntil = 0; Store.save();
  showGrown();
  toastNote("Thanks! Now hold the button to reset.");
}
function openResetGate() {
  const k = kid();
  if (k.gateLockUntil > Date.now()) { toastNote(`Please wait ${waitText(k.gateLockUntil)} and try again.`); return; }
  const auth = readParentAuth();
  if (auth.kind === "math") {
    const a = 24 + Math.floor(Math.random() * 26), b = 13 + Math.floor(Math.random() * 17);
    const ans = String(a * b);
    paintGate({ title: "A grown-up needs to do this", msg: `Grown-ups only: what is ${a} × ${b}? Type the answer, not a PIN.`, length: ans.length, onSubmit(v) {
      if (v === ans) { armReset(); return; }
      const kk = kid(); kk.gateFails += 1; kk.gateLockUntil = Date.now() + 60000; Store.save();
      showGrown();
      toastNote(`That's not right. Please wait ${waitText(kk.gateLockUntil)} before trying again.`);
    }});
    return;
  }
  paintGate({ title: "Grown-up check", msg: "Enter the grown-up PIN to unlock reset.", length: 4, onSubmit(v, api) {
    const ok = auth.kind === "plain" ? v === auth.pin : hashPin(auth.salt, v) === auth.hash;
    if (ok) { armReset(); return; }
    const kk = kid(); kk.gateFails += 1;
    if (kk.gateFails >= 3) {
      kk.gateLockUntil = Date.now() + 30000; kk.gateFails = 0; Store.save();
      showGrown();
      toastNote(`Too many tries. Please wait ${waitText(kk.gateLockUntil)}.`);
      return;
    }
    Store.save();
    api.error(`Hmm, that's not the PIN. ${3 - kk.gateFails} more ${3 - kk.gateFails === 1 ? "try" : "tries"}.`);
  }});
}

/* hold-to-confirm (grown-up reset): the 2-second hold only runs after the gate */
let hold = null;
document.addEventListener("pointerdown", e => {
  const el = e.target.closest("[data-hold]"); if (!el) return;
  e.preventDefault();
  const k = kid();
  if (k.gateLockUntil > Date.now()) { toastNote(`Please wait ${waitText(k.gateLockUntil)} and try again.`); return; }
  if (!resetArmed) { openResetGate(); return; }
  const bar = el.querySelector("i"), t0 = Date.now();
  hold = setInterval(() => {
    const p = Math.min(1, (Date.now() - t0) / 2000); if (bar) bar.style.width = (p * 100) + "%";
    if (p >= 1) {
      clearInterval(hold); hold = null;
      const kk = kid(); kk.progress = {}; kk.puzzle = null; resetArmed = false; Store.save();
      $ov.innerHTML = ""; render(); toastNote("Puzzle progress reset.");
    }
  }, 50);
});
["pointerup", "pointercancel", "pointerleave"].forEach(ev => document.addEventListener(ev, () => {
  if (hold) { clearInterval(hold); hold = null; document.querySelectorAll("[data-hold] i").forEach(b => b.style.width = "0"); }
}));

/* A newer build reloads only on the level map, never in the middle of a puzzle. */
let updateCheckedAt = 0;
function checkGameUpdate() {
  if (view === "play") return;
  const now = Date.now();
  if (now - updateCheckedAt < 15000) return;
  updateCheckedAt = now;
  fetch("../version.json?t=" + now, { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || typeof j.version !== "string" || j.version === BUILD || view === "play") return;
    try { if (sessionStorage.getItem("squish.update") === j.version) return; sessionStorage.setItem("squish.update", j.version); } catch (e) { return; }
    if (view !== "play") location.reload();
  }).catch(() => {});
}

/* keep in sync if the main app switches player in another tab; re-place the hand on rotate */
window.addEventListener("storage", e => { if (e.key === GAME.mainKey) { me = readMainProfile(); render(); } else if (e.key === GAME.storageKey) { Store.load(); render(); } });
window.addEventListener("resize", () => { if (view === "play") placeHand(); });
window.addEventListener("scroll", () => { if (view === "play") placeHand(); }, { passive: true });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkGameUpdate(); });

Store.load();
const savedPlay = puzzleLoad();
if (savedPlay) {
  play = savedPlay; view = "play"; render();
  toastNote("Welcome back! Your seats are still here.");
} else {
  render();
  checkGameUpdate();
}
if (/[?&]test=1\b/.test(location.search)) window.__squish = { LEVELS, RULES, clueText, GAME, BUILD, Store, kid, get play() { return play; }, get view() { return view; }, get resetArmed() { return resetArmed; } };
</script>
