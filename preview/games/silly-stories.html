<style>
:root{
  --bg:#fff8e7; --ink:#2d2a4a; --muted:#7a7699; --card:#fff; --line:#e7e2f5;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}

button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0}
#app{max-width:1180px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 14px) calc(env(safe-area-inset-left) + 16px)}
.hidden{display:none!important}
.btn{border:none;border-radius:18px;padding:12px 24px;min-height:64px;min-width:64px;font-size:23px;font-weight:600;
  background:var(--good);color:#fff;box-shadow:0 5px 0 var(--good-d);display:inline-flex;align-items:center;justify-content:center;gap:10px}

.btn.brand{background:var(--brand);box-shadow:0 5px 0 var(--brand-d)}

.iconbtn{border:none;background:#fff;border-radius:18px;width:64px;height:64px;font-size:30px;flex:none;text-decoration:none;
  box-shadow:0 4px 0 var(--line);display:inline-flex;align-items:center;justify-content:center;position:relative}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.iconbtn.on{background:var(--brand-l);box-shadow:0 4px 0 #cbbcff}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px;min-height:56px;font-size:22px;font-weight:700;box-shadow:0 4px 0 var(--line)}
.pill .av{font-size:32px}
.pill .nm{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.spacer{flex:1}
.banner{flex:none;background:var(--gold);color:var(--ink);border-radius:16px;padding:8px 16px;margin-bottom:8px;font-weight:700;text-align:center;animation:pop .3s}
/* map */
.mapwrap{flex:1;min-height:0;overflow:auto;padding:4px 2px 8px}
.hero{display:flex;align-items:center;gap:14px;margin:4px 0 16px}
.hero .big{font-size:64px;animation:bob 2.4s ease-in-out infinite}
.bubble{background:#fff;border-radius:22px;padding:14px 18px;box-shadow:0 4px 0 var(--line);font-size:21px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.lvl{position:relative;border:none;background:#fff;border-radius:24px;box-shadow:0 6px 0 var(--line);min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px}
.lvl .num{position:absolute;top:10px;left:14px;font-weight:700;color:var(--muted)}
.lvl .scene{font-size:64px;line-height:1}
.lvl.next{box-shadow:0 6px 0 #cbbcff,0 0 0 4px var(--brand) inset}.lvl.next .scene{animation:bob 1.8s ease-in-out infinite}
.lvl.locked{opacity:.55}
.stars{font-size:22px;letter-spacing:2px}.nostar{opacity:.2}
/* play */
.story{flex:1;min-height:0;background:var(--paper);border-radius:28px;box-shadow:0 6px 0 var(--line);padding:14px 18px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.stitle{display:flex;align-items:center;gap:12px;flex:none}
.stitle .sh{font-size:50px;line-height:1;animation:bob 2.6s ease-in-out infinite}

.lines{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:4px;overflow:hidden}
.sline{flex:none;display:flex;align-items:center;gap:12px;border-radius:18px;padding:4px 6px;transition:background .2s}
.sline.reading{background:#fff3c4}

.sline .pic{font-size:36px;flex:none;min-width:48px;text-align:center;letter-spacing:2px}

  min-width:104px;height:86px;margin:0 6px;border:4px dashed #b9a6ff;border-radius:20px;background:var(--blank);transition:transform .15s,background .15s;position:relative;touch-action:none}
.lines.fitted .txt{font-size:var(--fs)}.lines.fitted .blank{height:calc(86px*var(--bs));min-width:calc(104px*var(--bs))}.lines.fitted .blank .e{font-size:calc(46px*var(--bs))}
.blank.hot{background:#e1d6ff;border-color:var(--brand);transform:scale(1.08)}
.blank.filled{border:4px solid var(--good);background:var(--good-l);animation:pop .35s}
.blank .e{font-size:46px;line-height:1}
.blank .w{font-size:17px;font-weight:700;line-height:1}
.blank .q{font-size:34px;color:#b9a6ff;font-weight:700}
.blank.glow,.tile.glow{animation:glow 1s ease-in-out infinite}
.tray{flex:none;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;padding:14px 8px 4px;min-height:136px}
.tile{position:relative;border:none;background:#fff;border-radius:22px;width:112px;height:112px;box-shadow:0 6px 0 #d9d0f5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;transition:transform .15s}
.tile .e{font-size:58px;line-height:1;pointer-events:none}
.tile .w{font-size:18px;font-weight:700;pointer-events:none}
.tile.sel{transform:translateY(-10px) scale(1.06);box-shadow:0 10px 0 #cbbcff,0 0 0 4px var(--brand) inset}
.tile.used{visibility:hidden}
.tile.wob{animation:wiggle .5s}
.tile .spk{position:absolute;top:4px;right:6px;font-size:16px;opacity:.55;pointer-events:none}
.board{flex:1;min-height:0;display:flex;flex-direction:column}
.side{flex:none;display:flex;flex-direction:column}

.tools{flex:none;display:flex;gap:10px;justify-content:center;margin-top:6px}
.drag{position:fixed;left:0;top:0;z-index:50;pointer-events:none;width:112px;height:112px;border-radius:22px;background:#fff;box-shadow:0 18px 30px rgba(45,42,74,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;will-change:transform}
.drag .e{font-size:62px;line-height:1}.drag .w{font-size:18px;font-weight:700}
.toast{pointer-events:none;position:fixed;left:50%;top:86px;transform:translateX(-50%);background:#fff;border-radius:18px;padding:10px 18px;box-shadow:0 6px 0 var(--line);font-size:21px;z-index:40;animation:pop .25s;max-width:90vw;text-align:center}
.hand{position:fixed;z-index:45;font-size:54px;pointer-events:none;transition:transform 1.1s ease-in-out}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(45,42,74,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.panel{background:#fff;border-radius:30px;padding:20px 22px;max-width:760px;width:100%;max-height:calc(100dvh - 32px);overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:pop .35s}
.panel h2{font-size:32px}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.scene{position:relative;width:100%;height:clamp(150px,23vh,300px);border-radius:24px;overflow:hidden;flex:none}
.scene .heroa{position:absolute;left:50%;top:50%;font-size:min(120px,16vh);margin:-.6em 0 0 -.5em;line-height:1;animation:dance 1s ease-in-out infinite}
.scene .act{position:absolute;font-size:min(58px,8vh);line-height:1;animation:hop 1.2s ease-in-out infinite}
.scene .dec{position:absolute;font-size:34px;opacity:.85;animation:floaty 3s ease-in-out infinite}
.recap{width:100%;display:flex;flex-direction:column;gap:2px;font-size:19px;text-align:left;min-height:0;overflow:hidden}
.recap .sline{padding:2px 8px;gap:8px}.recap .pic{font-size:26px}.recap .txt{font-size:19px;line-height:1.35}
.bigstars{font-size:42px}.bigstars span{display:inline-block;animation:pop .4s backwards}
.coins{font-size:30px;font-weight:700;color:var(--gold-d);animation:pop .4s .5s backwards}
.parade{display:flex;gap:10px;font-size:52px}.parade span{animation:hop 1s ease-in-out infinite}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.grown p{text-align:left;font-size:18px;margin:4px 0}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes dance{0%,100%{transform:rotate(-10deg) translateY(0)}50%{transform:rotate(10deg) translateY(-18px)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-22px) scale(1.05,.95)}60%{transform:translateY(-22px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes fall{0%{transform:translateY(-40px)}100%{transform:translateY(110%)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,200,61,.0)}50%{box-shadow:0 0 0 10px rgba(255,200,61,.75)}}
#app.young .tile{width:150px;height:150px;border-radius:28px}#app.young .tile .e{font-size:84px}
#app.young .sline .pic{font-size:52px;min-width:70px}#app.young .sline .txt{font-size:clamp(22px,min(3vw,3.2vh),32px)}
#app.young .blank{min-width:130px;height:110px}#app.young .blank .e{font-size:66px}#app.young .tray{gap:22px}
#app.young .side{justify-content:center}
@media (orientation:landscape) and (min-width:900px){#app.young .side{width:200px}#app.young .tray{flex-direction:column}}
@media (max-width:600px){#app.young .tile{width:96px;height:96px}#app.young .tile .e{font-size:54px}#app.young .blank{min-width:96px;height:84px}#app.young .sline .pic{display:inline;font-size:36px;min-width:44px}}
@media (max-width:600px){.top{gap:6px}.top .pill[aria-label=Player],[data-act=grown]{display:none!important}.pill{padding:6px 10px}#app{padding-left:calc(env(safe-area-inset-left) + 10px);padding-right:calc(env(safe-area-inset-right) + 10px)}.story{padding:10px}.sline{gap:6px}.tray{gap:10px}.side{flex-direction:row;align-items:center}.side .tray{flex:1;min-height:0;padding-top:8px;gap:8px}.tools{margin-top:0}.sline{padding:0 4px}.lines{gap:2px}.stitle .sh{font-size:38px}.tile{width:78px;height:78px}.tile .e{font-size:40px}.tile .w{font-size:14px}.drag{width:78px;height:78px}.blank{min-width:80px;height:66px}.blank .e{font-size:38px}.sline .pic{display:none}.levels{grid-template-columns:repeat(2,1fr)}}
@media (max-height:900px){.recap .txt{font-size:17px}.recap .pic{font-size:22px}.parade{font-size:40px}.panel{gap:6px;padding:14px 20px}.bigstars{font-size:34px}}
@media (max-height:700px){.tile{width:92px;height:92px}.tile .e{font-size:46px}.tray{min-height:110px;padding-top:8px}.blank{height:72px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
/* ==========================================================================
   SILLY STORIES: a vocabulary-by-meaning interlude for Elzee.
   Listen to (or read) a silly story. Drag picture word tiles into the
   blanks. Exactly one tile fits each blank by meaning and context; the
   extra tiles are plausible but don't fit (verified by silly-stories-dev/verify.mjs).
   No randomness, no timer, no fail state.
   ========================================================================== */
const GAME = {
  id: "sillystories",
  storageKey: "logicquest.minigame.sillystories.v1", // this game's own key
  mainKey: "logicquest.v1",                           // main app key: READ ONLY, never written here
  resultKey: "logicquest.interlude.result.v1",
};
const ECON = {
  firstClear: 3,        // first time a story is finished
  firstThreeStars: 2,   // first time a story is finished with no hints
  replay: 0,            // replaying a finished story (contract §6). No daily cap of any kind (contract §6).
};
const RM = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- stories (fixed; one answer per blank) ----------
   line.t: sentence, "{}" marks the blank. line.a: the tile id that fits. line.pic: picture clue for picture mode.
   tile.say: what long-press / tap reads aloud (disambiguates "bat"). */
/*STORIES-START*/
const STORIES = [
  { id: "pig", name: "Pinky Gets Dressed", hero: "🐷", age: 6, bg: "linear-gradient(#bfe3ff,#e9f7ff 70%,#9fe39a 70%)",

      { id: "umbrella", e: "☂️", w: "umbrella" },

    lines: [

    tiles: [
      { id: "pepper", e: "🌶️", w: "hot pepper" },

      { id: "rock", e: "🪨", w: "rock" },

    decor: ["🎈", "🎉", "🎈", "⭐"],

      { t: "The monkey hit a ball far away with his {}.", pic: "🐒", a: "batbaseball" },
      { t: "The penguin felt chilly, so he wore a woolly {}.", pic: "🐧🥶", a: "scarf" },

    tiles: [

  { id: "y-puppy", young: true, name: "Puppy's Lunch", hero: "🐶", age: 5.5, bg: "linear-gradient(#ffe9c7,#fff8ec)",
    decor: ["🦴", "✨", "🐾", "✨"],

  { id: "y-duck", young: true, name: "Bath Time", hero: "🐥", age: 5.5, bg: "linear-gradient(#cdeeff,#f2fbff)",
    decor: ["💧", "💦", "💧", "✨"],
    lines: [

function cleanCur(c) {

}

  data: null,

    if (raw && typeof raw === "object" && raw.kids && typeof raw.kids === "object") {
      for (const [id, k] of Object.entries(raw.kids)) {
        if (!k || typeof k !== "object") continue;
        const progress = {};
        for (const [li, v] of Object.entries(k.progress && typeof k.progress === "object" ? k.progress : {})) {
          if (/^\d+$/.test(li) && +li < STORIES.length && v && typeof v === "object") progress[li] = { stars: Math.min(3, num(v.stars)), clears: num(v.clears) };
        }
        d.kids[String(id).slice(0, 40)] = {
          progress, day: typeof k.day === "string" ? k.day : null,
          earnedToday: num(k.earnedToday), pending: num(k.pending), lifetime: num(k.lifetime),
          noRead: typeof k.noRead === "boolean" ? k.noRead : null, sound: typeof k.sound === "boolean" ? k.sound : null,
          cur: cleanCur(k.cur),

  },
  save() { try { localStorage.setItem(GAME.storageKey, JSON.stringify(this.data)); } catch (e) { /* private mode / full */ } },
};
let me = readMainProfile();
function kid() {
  const d = Store.data;
  if (!d.kids[me.id]) d.kids[me.id] = { progress: {}, day: null, earnedToday: 0, pending: 0, lifetime: 0, noRead: null, sound: null, cur: null, track: null };

/* Track: little path (pathId "little", same rule Jelly Jars uses for picture mode) gets the young stories by default.
   A grown-up can flip it with the visible 🐣/🦁 button; the choice is stored per kid in this game's own key. */
const curTrack = () => { const k = kid(); return k.track || (me.little ? "young" : "big"); };
const noRead = () => { const k = kid(); return k.noRead === null ? (me.little || curTrack() === "young") : k.noRead; };
const soundOn = () => { const k = kid(); return k.sound === null ? me.sound : k.sound; };
const isCleared = si => !!(kid().progress[si] && kid().progress[si].clears);
const isUnlocked = si => { const L = trackList(trackOf(si)), i = L.indexOf(si); return i <= 0 || isCleared(L[i - 1]); };
const nextIn = si => { const L = trackList(trackOf(si)), i = L.indexOf(si); return i >= 0 && i < L.length - 1 ? L[i + 1] : -1; };
const isFinal = si => nextIn(si) < 0;
function pickStory(tr) { // interlude round: in-progress story of this track, else next unfinished, else lowest stars
  const k = kid(), L = trackList(tr);
  if (k.cur && trackOf(k.cur.si) === tr) return k.cur.si;
  const n = L.find(i => !isCleared(i)); if (n !== undefined) return n;
  let lo = L[0]; L.forEach(i => { if (((k.progress[i] || {}).stars || 0) < ((k.progress[lo] || {}).stars || 0)) lo = i; }); return lo;
}

/* Award tokens for a finished story. lifetime only ever increases. */
function award(si, stars) {
  const k = kid(), prev = k.progress[si] || { stars: 0, clears: 0 };
  let want = 0; const lines = [];
  if (!prev.clears) { want += ECON.firstClear; lines.push(["first", ECON.firstClear]); }
  else if (ECON.replay) { want += ECON.replay; lines.push(["replay", ECON.replay]); }
  if (stars === 3 && prev.stars < 3) { want += ECON.firstThreeStars; lines.push(["stars", ECON.firstThreeStars]); }
  const got = want; // paid in full: no caps (contract §6); earnedToday is a display stat only
  k.earnedToday += got; k.pending += got; k.lifetime += got;

const Sound = {
  ctx: null,
  tone(f0, f1, dur, type = "triangle", vol = 0.18, delay = 0) {
    if (!soundOn()) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = this.ctx || new AC();
      if (this.ctx.state === "suspended" && this.ctx.resume) this.ctx.resume().catch(() => {});
      const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.03);
    } catch (e) { /* no audio */ }
  },
  pick() { this.tone(300, 720, 0.13, "sine"); },
  good() { this.tone(660, 660, 0.12); this.tone(880, 880, 0.18, "triangle", 0.18, 0.11); },
  oops() { this.tone(330, 330, 0.14, "triangle", 0.14); this.tone(294, 294, 0.2, "triangle", 0.12, 0.13); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, f * 1.01, 0.22, "triangle", 0.18, i * 0.11)); },
  pop() { this.tone(900, 300, 0.1, "sine", 0.15); },

const Speech = {
  get ok() { try { return !!(window.speechSynthesis && typeof window.speechSynthesis.speak === "function" && typeof window.SpeechSynthesisUtterance === "function"); } catch (e) { return false; } },
  voice: null, token: 0,
  pickVoice() {
    try {
      const vs = (speechSynthesis.getVoices() || []).filter(v => /^en/i.test(v.lang));
      const local = vs.filter(v => v.localService !== false);
      this.voice = local.find(v => /samantha|karen|female|zira|aria/i.test(v.name)) || local[0] || null;
    } catch (e) { this.voice = null; }
  },
  /* Speak a list of chunks in order; onChunk(i) fires as each starts, onDone at the end.
     If speech is off, missing, or stalls, a timer walks through the chunks anyway, so nothing ever waits forever. */
  seq(chunks, onChunk, onDone) {

  if (m >= LAUNCH.min && !session.bannerShown) { session.bannerShown = true; if (view === "play") render(); }
  if (m >= LAUNCH.min + 3 && !session.offerShown && !$ov.firstChild) {
    session.offerShown = true; const nr = noRead();
    $ov.innerHTML = `<div class="ov"><div class="panel" role="dialog" aria-label="Back to the trail?"><h2>🗺️ ${nr ? "" : "Time for the trail?"}</h2>
      <div class="row"><button class="btn ghost" data-act="keep" aria-label="Keep playing"><span class="ico">📖</span></button>
      <button class="btn" data-act="back" aria-label="Back to my adventure"><span class="ico">▶️</span>${nr ? "" : "Back to my adventure"}</button></div></div></div>`;
  }
}
setInterval(tickBudget, 5000);

/* ---------- boot ---------- */
Store.load();
window.addEventListener("pagehide", () => { if (play && !play.done) saveCur(); });
window.addEventListener("storage", ev => { if (ev.key === GAME.mainKey) { me = readMainProfile(); render(); } });
window.addEventListener("resize", () => { if (FX.on) FX.size(); if (view === "play" && play && !drag) { renderPlay(); fitStory(); } });
(function boot() {
  const k = kid(); Store.save();
  if (INTERLUDE) {
    try { history.replaceState({ ss: "base" }, ""); history.pushState({ ss: "game" }, ""); } catch (e) { /* ignore */ }
    startStory(pickStory(curTrack()), true);
  } else if (k.cur) { pushNav(); startStory(k.cur.si, true); }
  else render();
})();

/* Read-only hooks for automated tests (cannot change game state). */
window.SillyStories = Object.freeze({
  stories: STORIES,
  track: () => curTrack(),
  state: () => JSON.parse(JSON.stringify({ view, play, session, kid: kid(), launch: LAUNCH })),
});
</script>
</body>
</html>
