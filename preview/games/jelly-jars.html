<style>
/* Visual language matches Elzee (lq-site/index.html) and Squish Seats: cream background, purple brand, chunky 3D buttons. */
:root{

.hidden{display:none!important}

/* buttons */

.lvl{position:relative;border:none;background:#fff;border-radius:24px;box-shadow:0 6px 0 var(--line);min-height:150px;

.lvl .num{position:absolute;top:8px;left:12px;font-weight:700;color:var(--muted);font-size:20px}

.float{position:fixed;left:0;top:0;z-index:60;pointer-events:none;will-change:transform}

.ctrls{display:flex;gap:12px;flex:none;margin-top:12px;justify-content:center}
.ctrls .btn{flex:0 1 160px}
.ctrls .btn.wig{animation:nope .6s 3}

/* win state on the shelf */
.stage.win .jcol{animation:jardance .5s ease-in-out infinite alternate}

  animation:liddrop .5s cubic-bezier(.3,1.6,.5,1) backwards}

.panel{background:var(--bg);border-radius:28px;padding:22px;max-width:620px;width:100%;max-height:94vh;overflow:auto;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.12);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}

.panel h2{font-size:34px;margin-bottom:6px}
.bigstars{font-size:58px;letter-spacing:6px}
.bigstars span{display:inline-block;animation:pop .5s backwards}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.coins{font-size:30px;font-weight:700;color:var(--gold-d);margin:8px 0}
.note{background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 4px 0 var(--line);margin:10px 0;font-size:18px}
.muted{color:var(--muted)}
.left{text-align:left}
.hand{position:fixed;z-index:62;font-size:56px;pointer-events:none;transform:translate(-30%,-10%)}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:70}
.holdbtn{position:relative;overflow:hidden}
.holdbtn i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,93,108,.35)}

/* twist intro demo */
.twistcard .demo{position:relative;width:300px;height:270px;margin:6px auto 0}

  background:#fff;border:3px solid #cbbcff;border-radius:16px;font-size:30px;font-weight:700;z-index:2}
.twistcard .dbadge .mini{width:36px;display:block}.twistcard .dbadge .plus{font-weight:700;color:var(--brand-d);font-size:18px}
.twistcard .dbadge.mys{background:var(--brand);color:#fff}
.twistcard .dbadge .rv{position:absolute;inset:-3px;display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid #cbbcff;border-radius:16px;opacity:0;animation:rv 4.4s infinite}
@keyframes rv{0%,40%{opacity:0;transform:rotateY(90deg)}50%,92%{opacity:1;transform:none}100%{opacity:0}}
.twistcard .djar{position:absolute;left:102px;width:96px;top:70px;height:182px;border:5px solid rgba(255,200,61,.75);border-top:none;border-radius:6px 6px 26px 26px;background:rgba(255,255,255,.6)}
.twistcard .dj{position:absolute;left:50%;display:block}
.twistcard .dj svg{display:block;width:100%;height:auto}
.twistcard .dg{position:absolute;left:115px;width:70px;height:48px;border:3px dashed;border-radius:40% 40% 30% 30%}

@keyframes dOk{0%{transform:translate(-120px,0);opacity:0}6%{opacity:1}18%{transform:translate(0,0);opacity:1}28%{transform:translate(0,var(--land)) scale(1.25,.7)}33%{transform:translate(0,var(--land)) scale(.9,1.12)}38%,44%{transform:translate(0,var(--land)) scale(1);opacity:1}48%,100%{transform:translate(0,var(--land));opacity:0}}
@keyframes dBad{0%,50%{transform:translate(120px,0);opacity:0}56%{opacity:1}66%{transform:translate(0,0);opacity:1}72%{transform:translate(0,40px) scale(.9,1.1)}76%{transform:translate(-8px,30px) rotate(-12deg)}80%{transform:translate(8px,10px) rotate(12deg)}88%{transform:translate(120px,-30px) rotate(0) scale(1.1,.9)}94%{transform:translate(120px,0);opacity:1}100%{transform:translate(120px,0);opacity:0}}
.twistcard .mk{position:absolute;font-size:40px;left:212px;top:150px;opacity:0}

<div id="app" role="main"></div>

<script>
"use strict";
/* ==========================================================================
   JELLY JARS: a hands-on sorting-logic interlude for Elzee.
   Drag (or tap-tap) the top jelly of a jar into another jar. Jars can have
   rule badges (only stripes, only red, NOT red, two rules at once), a size
   rule (never a bigger jelly on a smaller one), a color-pattern jar, and
   mystery jars whose hidden rule you work out from example jellies.
   No randomness: every level is a fixed puzzle verified solvable offline
   (jelly-jars-dev/verify-levels.js runs the engine below from this file).
   ========================================================================== */

const GAME = {
  id: "jellyjars",
  storageKey: "logicquest.minigame.jellyjars.v1", // this game's own key
  mainKey: "logicquest.v1",                        // main app key: READ ONLY, never written here
};
const ECON = {
  firstClear: 3,        // first time a level is solved
  firstThreeStars: 2,   // first time a level earns 3 stars
  replay: 1,            // solving an already-cleared level
  replayPaidPerDay: 3,  // replay tokens paid at most this many times a day
  dailyCap: 15,         // hard cap on tokens per kid per day from this game
};
const RM = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- rules engine + levels (identical copy is run by the offline verifier) ---------- */
/*ENGINE-START*/
/* Jelly code: color + pattern + size, e.g. "rs2" = red, stripes, medium.
   colors r b y g p o · patterns p plain, s stripes, d dots · sizes 1 small, 2 medium, 3 big */
function J(code) { return { c: code[0], p: code[1] || "p", s: +(code[2] || 2) }; }
function matches(rule, j) {
  if (!rule) return true;
  for (const k of ["c", "p", "s"]) if (rule[k] !== undefined && j[k] !== rule[k]) return false;
  if (rule.not) for (const k of ["c", "p", "s"]) if (rule.not[k] !== undefined && j[k] === rule.not[k]) return false;
  return true;

  const ids = play.jars[a], top = jellyEl(ids[ids.length - 1]); if (!top) return;
  const ra = top.getBoundingClientRect(), rb = cb.querySelector(".jar").getBoundingClientRect();
  const g = document.createElement("div"); g.className = "float demoghost"; g.style.width = ra.width + "px"; g.style.opacity = ".55";
  g.innerHTML = jellySVG(play.code[ids[ids.length - 1]]);
  const hand = document.createElement("div"); hand.className = "hand"; hand.textContent = "👆"; hand.setAttribute("aria-hidden", "true");
  document.body.append(g, hand);
  const x0 = ra.left, y0 = ra.top, x1 = rb.left + (rb.width - ra.width) / 2, y1 = rb.top - ra.height * 0.2;
  const frames = [
    { transform: `translate(${x0}px,${y0}px)`, offset: 0 }, { transform: `translate(${x0}px,${y0 - 40}px)`, offset: 0.2 },
    { transform: `translate(${(x0 + x1) / 2}px,${Math.min(y0, y1) - 90}px)`, offset: 0.5 }, { transform: `translate(${x1}px,${y1}px)`, offset: 0.8 }, { transform: `translate(${x1}px,${y1}px)`, offset: 1 }];
  const opt = { duration: 1900, iterations: times, easing: "ease-in-out" };
  g.animate(frames, opt);
  hand.style.left = "0px"; hand.style.top = "0px";
  const off = ra.width * 0.4, offy = ra.height * 0.55;
  hand.animate(frames.map(f => ({ ...f, transform: f.transform.replace(/translate\(([-\d.]+)px,([-\d.]+)px\)/, (m, x, y) => `translate(${+x + off}px,${+y + offy}px)`) })), opt)
    .onfinish = () => { g.remove(); hand.remove(); };
}

/* ---------- twist intro card: an animated mini demo (✅ one goes in, 🚫 one bounces off) ---------- */
const introSeen = new Set();
function maybeTwistIntro() {
  const L = LEVELS[play.li];
  if (!L.twist || isCleared(play.li) || introSeen.has(play.li)) return;
  introSeen.add(play.li); showTwist(L.twist);
}
const TWISTS = {
  badge:   { badge: ruleIcon({ p: "s" }), inside: [], ok: "bs2", bad: "rd2", say: "New! Rule badges. This jar only takes striped jellies." },
  size:    { badge: `<span style="font-size:26px">📶</span>`, inside: ["bp2"], ok: "yp1", bad: "pp3", say: "New! A big jelly can never sit on a smaller one." },
  seq:     { badge: ["r", "b", "y"].map(c => `<span class="mini" style="width:22px">${jellySVG(c + "p2", "happy", { noface: true })}</span>`).join(""), inside: ["rp2"], ghost: ["b", "y"], ok: "bp2", bad: "yp2", say: "New! Pattern jar. Drop the colors in the pattern order, bottom to top." },
  two:     { badge: ruleIcon({ c: "r", p: "s" }), inside: [], ok: "rs2", bad: "rd2", say: "New! Two rules at once. The jelly has to match both." },
  mystery: { badge: "?", reveal: ruleIcon({ p: "s" }), inside: ["rs2", "bs1"], ok: "gs2", bad: "gd2", say: "New! Mystery jars. What do the jellies inside have in common? That's the secret rule." },
};
function showTwist(tw) {
  const T = TWISTS[tw], nr = noRead();
  const slotY = n => 185 - n * 56, n = T.inside.length;
  const jel = (c, y, cls = "", extra = "") => `<span class="dj ${cls}" style="top:${y}px;width:${64 * SIZESCALE[J(c).s] / 0.8}px;margin-left:${-32 * SIZESCALE[J(c).s] / 0.8}px;${extra}">${jellySVG(c)}</span>`;
  $ov.innerHTML = `<div class="ov"><div class="panel twistcard" role="dialog" aria-label="New rule">
    <h2>✨ ${nr ? "" : "New!"}</h2>
    <div class="demo" style="--land:${slotY(n) - 6}px">
      <div class="dbadge ${tw === "mystery" ? "mys" : ""}">${T.badge}${T.reveal ? `<span class="rv">${T.reveal}</span>` : ""}</div>
      <div class="djar"></div>
      ${(T.ghost || []).map((c, i) => `<span class="dg" style="top:${slotY(n + i) + 4}px;border-color:${COLORS[c].dark};background:${COLORS[c].fill}33"></span>`).join("")}
      ${T.inside.map((c, i) => jel(c, slotY(i))).join("")}
      ${jel(T.ok, -6, "ok")}${jel(T.bad, -6, "bad")}
      <span class="mk m1">✅</span><span class="mk m2">🚫</span>
    </div>
    ${nr ? "" : `<p style="font-size:21px">${esc(T.say)}</p>`}
    <div class="row">${Speech.ok ? `<button class="iconbtn" data-act="sayTwist" data-tw="${tw}" aria-label="Read aloud">🔈</button>` : ""}
      <button class="btn" data-act="closeOv" aria-label="Got it"><span class="ico">👍</span></button></div></div></div>`;
  if (soundOn()) Speech.say(T.say);
}

/* ---------- celebration ---------- */
const FX = {
  cv: document.getElementById("fx"), ctx: null, parts: [], on: false,
  size() { const d = window.devicePixelRatio || 1; this.cv.width = innerWidth * d; this.cv.height = innerHeight * d; this.ctx = this.cv.getContext("2d"); this.ctx.setTransform(d, 0, 0, d, 0, 0); },
  burst(x, y, n = 40, spread = 1, up = 1) {
    if (RM()) return;
    const cols = ["#7c4dff", "#3ccf4e", "#ffc83d", "#ff6b3d", "#ff8fab", "#4dc3ff", "#ff5d73"];
    for (let i = 0; i < n; i++) {
      const a = up ? -Math.PI / 2 + (Math.random() - 0.5) * 1.6 * spread : Math.random() * Math.PI * 2;
      const v = 380 + Math.random() * 520;
      this.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6, vr: (Math.random() - 0.5) * 14, w: 8 + Math.random() * 7, h: 10 + Math.random() * 8,
        c: cols[i % cols.length], life: 2.6 + Math.random(), round: i % 4 === 0 });
    }
    if (!this.on) { this.on = true; this.size(); this.t = performance.now(); requestAnimationFrame(t => this.tick(t)); }
  },
  tick(t) {
    const dt = Math.min(0.033, (t - this.t) / 1000); this.t = t;
    const g = this.ctx; g.clearRect(0, 0, innerWidth, innerHeight);
    this.parts = this.parts.filter(p => (p.life -= dt) > 0 && p.y < innerHeight + 40);
    for (const p of this.parts) {
      p.vy += 900 * dt; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.globalAlpha = Math.min(1, p.life);
      if (p.round) { g.beginPath(); g.arc(0, 0, p.w / 2, 0, 7); g.fill(); } else g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 2);
      g.restore();
    }
    if (this.parts.length) requestAnimationFrame(tt => this.tick(tt)); else { this.on = false; g.clearRect(0, 0, innerWidth, innerHeight); }
  },
};
let winTimer = 0, winRes = null;
function celebrate() {
  const stars = Math.max(1, 3 - play.hints);
  winRes = { stars, res: award(play.li, stars) };
  Sound.win();
  document.querySelectorAll(".jcol").forEach((c, i) => { const r = c.getBoundingClientRect(); setTimeout(() => FX.burst(r.left + r.width / 2, r.top + 30, 26), i * 120); });
  // re-render the top bar meter so the coin count ticks up right away
  const top = document.querySelector(".top"); if (top) top.outerHTML = topBar(true);
  winTimer = setTimeout(showWin, RM() ? 200 : 1900);
}
function showWin() {
  clearTimeout(winTimer); winTimer = 0;
  if (!play || !winRes || $ov.innerHTML) return;
  const { stars, res } = winRes, nr = noRead(), li = play.li, final = li === LEVELS.length - 1;
  const nextOk = li + 1 < LEVELS.length;
  const words = { first: "First solve", replay: "Replay", stars: "3 stars!" };
  const parade = final ? `<div class="parade">${FRIENDS.map((f, i) => `<span style="animation-delay:${i * 0.09}s">${friendHTML(f)}</span>`).join("")}</div>` : "";
  $ov.innerHTML = `<div class="ov"><div class="panel winpanel ${final ? "final" : ""}" role="dialog" aria-label="Level solved">
    <h2>${final ? "🏆" : "🎉"} ${nr ? "" : final ? "Every jar is sorted!" : "Jars full!"}</h2>
    <div class="reveal ${final ? "big" : ""}"><div class="rays"></div><div class="rjar"><div class="rlid"></div></div>
      <div class="rfriend">${friendHTML(final ? KING : FRIENDS[li])}</div></div>
    ${parade}
    <div class="bigstars">${[0, 1, 2].map(i => `<span style="animation-delay:${0.9 + i * 0.2}s" class="${i < stars ? "" : "nostar"}">⭐</span>`).join("")}</div>
    ${res.got ? `<div class="coins">+${res.got} 🪙</div>` : ""}
    ${!nr && res.lines.length && res.got ? `<div class="muted" style="font-size:17px">${res.lines.map(([k, v]) => `${words[k]} +${v}`).join(" · ")}</div>` : ""}
    ${res.capped ? `<div class="note">${nr ? "🪙✅🌙" : "Your token jar is full for today. Come back tomorrow for more. Puzzles are always free to play! 🌙"}</div>` : ""}
    ${res.newSticker && !nr ? `<div class="muted">${final ? "You found the Jelly King and all 10 jelly friends!" : "A new jelly friend for your book!"}</div>` : ""}
    <div class="row">
      <button class="btn ghost" data-act="map" aria-label="Back to levels"><span class="ico">🗺️</span></button>
      <button class="btn ghost" data-act="replay" aria-label="Play again"><span class="ico">🔁</span></button>
      ${nextOk ? `<button class="btn" data-act="next" aria-label="Next level"><span class="ico">▶️</span>${nr ? "" : "Next"}</button>` : ""}
    </div></div></div>`;
  setTimeout(() => { Sound.pop(); const f = document.querySelector(".rfriend"); if (f) { const r = f.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + r.height / 2, final ? 90 : 50, 1, 0); } }, 650);
  if (final && !RM()) for (let i = 1; i <= 6; i++) setTimeout(() => { if (!$ov.querySelector(".final")) return; FX.burst(innerWidth * (0.15 + 0.7 * ((i * 37) % 10) / 10), innerHeight * (0.15 + 0.1 * (i % 3)), 70, 1, 0); Sound.pop(); }, 900 + i * 520);
  if (soundOn()) Speech.say(final ? "You did it! Every jar is sorted. Here comes the Jelly King!" : res.got ? `Jars full! You earned ${res.got} tokens!` : "Jars full! Great thinking!");
}

function showBook() {
  const nr = noRead(), all = LEVELS.every((_, i) => isCleared(i));
  $ov.innerHTML = `<div class="ov"><div class="panel" role="dialog" aria-label="Jelly friend book">
    <h2>📒 ${nr ? "" : "Jelly Friends"}</h2>
    <div class="book">${FRIENDS.map((f, i) => {
      const got = isCleared(i);
      return `<div class="bslot ${got ? "" : "no"}">${got ? friendHTML(f, "happy") : `<span class="friendj">${jellySVG("zp3", "happy", { noface: true })}</span>`}<small>${LEVELS[i].scene} ${i + 1}</small></div>`; }).join("")}
      <div class="bslot king ${all ? "" : "no"}">${all ? friendHTML(KING, "yay") : `<span class="friendj">${jellySVG("zp3", "happy", { noface: true })}</span>`}<small>👑</small></div></div>
    <div class="row"><button class="btn" data-act="closeOv" aria-label="Close"><span class="ico">👍</span></button></div></div></div>`;
}
function showGrown() {
  const k = kid();
  $ov.innerHTML = `<div class="ov"><div class="panel left" role="dialog" aria-label="For grown-ups">
    <h2 style="text-align:center">For grown-ups</h2>
    <p><b>What it practices:</b> sorting and classifying by color, pattern, and size; following rules (badges, “NOT”, two rules at once); ordering (a size rule and a color pattern); planning ahead (only the top jelly moves, so you have to dig and park); and finding a hidden rule from examples. Every level is a fixed puzzle that has been checked to be solvable. There's no timer, and nothing depends on speed or luck.</p>
    <p><b>Tokens:</b> earned only by solving puzzles. First solve +${ECON.firstClear}, first 3-star solve +${ECON.firstThreeStars}, replays +${ECON.replay} (up to ${ECON.replayPaidPerDay} a day). At most <b>${ECON.dailyCap} tokens a day</b> per kid. Hints cost a star, never tokens. Wrong drops just bounce back and cost nothing. No purchases, no ads, nothing lost for missing a day.</p>
    <div class="note">Player: ${esc(me.avatar)} ${esc(me.name)} ${me.linked ? "(from Elzee)" : "(no Elzee player found on this device)"}<br>
      Today: ${k.earnedToday}/${ECON.dailyCap} · Waiting to go into the Elzee jar: <b>${k.pending}</b> · All-time: ${k.lifetime}</div>
    <p class="muted" style="font-size:16px">Tokens from this game move into the kid's Elzee jar the next time Elzee's home screen opens (up to ${ECON.dailyCap} a day). Picture mode hides all words; 🔈 reads the rules aloud with the device's own voice.</p>
    <p class="muted" style="font-size:16px">Hold the button below for 2 seconds to reset this kid's puzzle progress and jelly friends. Today's token count is kept so the daily cap can't be reset.</p>
    <div class="row"><button class="btn ghost holdbtn" data-hold="reset" aria-label="Hold to reset puzzle progress"><i></i>Hold to reset</button>
      <button class="btn" data-act="closeOv">Close</button></div></div></div>`;
}
function toastNote(msg) {
  if (!msg) return;
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const el = document.createElement("div");
  el.className = "note toast"; el.style.cssText = "position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:45;max-width:90vw;pointer-events:none";
  el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2000);
}

/* ---------- buttons ---------- */
const ACTS = {
  map() { clearTimeout(winTimer); $ov.innerHTML = ""; view = "map"; play = null; render(); },
  start(el) { const li = +el.dataset.li; if (isUnlocked(li)) { Sound.tap(); startLevel(li); } },
  locked() { Sound.boing(); },
  toggleRead() { kid().noRead = !noRead(); Store.save(); render(); },
  toggleSound() { kid().sound = !soundOn(); Store.save(); if (!soundOn()) Speech.stop(); render(); },
  book() { showBook(); }, grown() { showGrown(); },
  closeOv() { $ov.innerHTML = ""; render(); },
  say() { if (play) Speech.say(levelSpeech(LEVELS[play.li])); },
  sayTwist(el) { const T = TWISTS[el.dataset.tw]; if (T) Speech.say(T.say); },
  undo() { undo(); }, hint() { hint(); },
  restart() { if (!play || play.done || hold) return; const li = play.li, h = play.hints; startLevel(li); play.hints = h; Sound.pop(); },
  replay() { clearTimeout(winTimer); $ov.innerHTML = ""; startLevel(play.li); },
  next() { clearTimeout(winTimer); $ov.innerHTML = ""; startLevel(Math.min(LEVELS.length - 1, play.li + 1)); },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled && ACTS[el.dataset.act]) { ACTS[el.dataset.act](el); return; }
  // tap anywhere during the shelf celebration skips to the prize card
  if (view === "play" && play && play.done && winTimer && !$ov.innerHTML) showWin();
});

/* hold-to-confirm (grown-up reset) */
let holdReset = null;
document.addEventListener("pointerdown", e => {
  const el = e.target.closest("[data-hold]"); if (!el) return;
  const bar = el.querySelector("i"), t0 = Date.now();
  holdReset = setInterval(() => {
    const p = Math.min(1, (Date.now() - t0) / 2000); bar.style.width = (p * 100) + "%";
    if (p >= 1) {
      clearInterval(holdReset); holdReset = null;
      const k = kid(); k.progress = {}; Store.save(); $ov.innerHTML = ""; render(); toastNote("Puzzle progress reset.");
    }
  }, 50);
});
["pointerup", "pointercancel", "pointerleave"].forEach(ev => document.addEventListener(ev, () => {
  if (holdReset) { clearInterval(holdReset); holdReset = null; document.querySelectorAll("[data-hold] i").forEach(b => b.style.width = "0"); }
}));

/* keep in sync if Elzee switches player in another tab; re-fit jars on rotate */
window.addEventListener("storage", e => { if (e.key === GAME.mainKey) { me = readMainProfile(); render(); } else if (e.key === GAME.storageKey) { Store.load(); render(); } });
window.addEventListener("resize", () => { if (view === "play" && play && !hold) { stopDemo(); layoutJars(); scheduleDemo(); } if (FX.on) FX.size(); });

/* Read-only peek for automated tests (QA only; changes nothing). */
window.JellyJars = Object.freeze({
  state: () => (play ? { li: play.li, jars: codesOf(), done: play.done, stuck: play.stuck, hints: play.hints, busy: !!hold } : { view }),
  solution: () => (play ? solve(LEVELS[play.li], codesOf()) : null),
  levels: LEVELS.length,
});

Store.load(); render();
