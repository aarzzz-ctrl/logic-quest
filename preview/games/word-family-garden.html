<title>Word Family Garden · Elzee</title>
<style>
:root{
  --bg:#fff8e7; --ink:#2d2a4a; --muted:#7a7699; --card:#fff; --line:#e7e2f5;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.btn{border:none;border-radius:18px;padding:12px 24px;min-height:64px;min-width:64px;font-size:23px;font-weight:600;

  box-shadow:0 4px 0 var(--line);display:inline-flex;align-items:center;justify-content:center;position:relative}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

.top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px;min-height:56px;font-size:22px;font-weight:700;box-shadow:0 4px 0 var(--line)}
.pill .av{font-size:32px}.pill .nm{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill b{color:var(--gold-d)}
.spacer{flex:1}
.banner{flex:none;background:var(--gold);border-radius:16px;padding:8px 16px;margin-bottom:8px;font-weight:700;text-align:center}
.mapwrap{flex:1;min-height:0;overflow:auto;padding:4px 2px 8px}
.hero{display:flex;align-items:center;gap:14px;margin:4px 0 16px}
.hero .big{font-size:60px;animation:bob 2.4s ease-in-out infinite}
.bubble{background:#fff;border-radius:22px;padding:14px 18px;box-shadow:0 4px 0 var(--line);font-size:21px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.lvl{position:relative;border:none;background:#fff;border-radius:24px;box-shadow:0 6px 0 var(--line);min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px}

.lvl .tw{position:absolute;top:8px;right:12px;font-size:22px}
.lvl .scene{font-size:54px;line-height:1}
.lvl.next{box-shadow:0 6px 0 #cbbcff,0 0 0 4px var(--brand) inset}.lvl.next .scene{animation:bob 1.8s ease-in-out infinite}
.lvl.locked{opacity:.55}
.stars{font-size:22px;letter-spacing:2px}.nostar{opacity:.2}
.board{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.park{flex:1;min-height:0;position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 62%,var(--grass) 62%,#76c765);box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column}
.park .deco{position:absolute;font-size:44px;opacity:.9;pointer-events:none;animation:floaty 4s ease-in-out infinite}
.prompt{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:12px 14px 0;flex:none}

.dots{display:flex;gap:6px}.dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 2px #b9a6ff}.dots i.done{background:var(--good);box-shadow:none}.dots i.cur{background:var(--gold);box-shadow:none}

.bed{display:flex;align-items:flex-end;gap:18px;padding:0 6px}
.pot{position:relative;width:var(--pw);display:flex;flex-direction:column;align-items:center;touch-action:none}
.blooms{position:relative;z-index:0;display:flex;flex-wrap:wrap-reverse;justify-content:center;align-items:flex-start;align-content:flex-start;gap:0 4px;min-height:calc(2 * (var(--bloom) + 44px));width:100%;padding:0 4px;margin-bottom:-22px}
.potbody{position:relative;z-index:1;width:88%;height:104px;display:flex;align-items:center;justify-content:center;transition:transform .15s}

.potbody::after{content:"";position:absolute;left:0;right:0;top:0;height:30px;border-radius:12px;background:linear-gradient(#f09a6e,var(--pot));box-shadow:0 4px 0 var(--pot-d)}
.potbody .lab{position:relative;z-index:1;margin-top:26px;font-size:40px;font-weight:700;color:#fff;text-shadow:0 3px 0 var(--pot-d);letter-spacing:1px;pointer-events:none}

.pot.hot .potbody{transform:scale(1.08)}.pot.hot .potbody::after{background:linear-gradient(#ffd36b,var(--gold))}
.compost{position:relative;width:168px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;touch-action:none}

.compost .heap .wd{font-size:30px}

.flower{position:relative;display:flex;flex-direction:column;align-items:center;width:calc(var(--bloom) + 10px);touch-action:none}
.flower .head{width:var(--bloom);height:var(--bloom);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bloom) * .5);line-height:1;

.flower .stem::after{content:"";position:absolute;left:6px;top:8px;width:16px;height:9px;border-radius:0 12px 0 12px;background:var(--stem)}
.flower .fw{position:relative;z-index:1;font-size:19px;font-weight:700;background:rgba(255,255,255,.94);border-radius:10px;padding:0 6px;margin:-6px 0 -4px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.flower .fw b{color:var(--brand-d)}
.flower.pull{cursor:grab}
.flower.grow{animation:grow .7s cubic-bezier(.3,1.6,.5,1)}
.flower.dance{animation:hop .8s ease-in-out 2}
.sign{position:absolute;left:50%;top:38%;transform:translateX(-50%);z-index:5;background:#fff8e7;border:4px solid var(--soil);border-radius:14px;padding:4px 14px;font-size:30px;font-weight:700;color:var(--soil-d);white-space:nowrap;pointer-events:none;animation:pop .3s}
.side{flex:none;display:flex;flex-direction:column;align-items:center}
.tray{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;padding:4px 8px;min-height:var(--ch)}

.card .sdot{position:absolute;bottom:5px;font-size:16px;pointer-events:none}
.card .e{font-size:48px;line-height:1;pointer-events:none}
.tray .card.used{visibility:hidden}
.tray .card.sel{transform:translateY(-10px) scale(1.06);box-shadow:0 10px 0 #cbbcff,0 0 0 4px var(--brand) inset}

.glow{animation:glow 1s ease-in-out infinite!important;border-radius:20px}
.weedtip{font-size:64px;line-height:1;animation:bob 2s ease-in-out infinite}
.tools{display:flex;gap:10px;justify-content:center;margin-top:10px}
.drag{position:fixed;left:0;top:0;z-index:50;pointer-events:none;border-radius:20px;background:#fff;box-shadow:0 18px 30px rgba(45,42,74,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;will-change:transform}
.drag.seed{background:linear-gradient(#fff 0 64%,#f6e3c8 64%)}
.drag .on{font-size:44px;font-weight:700;color:var(--brand-d);line-height:1}.drag .e{font-size:50px;line-height:1}
.drag.fl{background:transparent;box-shadow:none}
.toast{pointer-events:none;position:fixed;left:50%;top:86px;transform:translateX(-50%);background:#fff;border-radius:18px;padding:10px 18px;box-shadow:0 6px 0 var(--line);font-size:21px;z-index:40;max-width:90vw;text-align:center}
.ov{position:fixed;inset:0;background:rgba(45,42,74,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.panel{background:#fff;border-radius:30px;padding:20px 22px;max-width:720px;width:100%;max-height:calc(100dvh - 32px);overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:pop .35s}
.panel h2{font-size:32px}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.startov{background:linear-gradient(var(--sky1),var(--sky2) 62%,var(--grass) 62%)}
.startbtn{border:none;border-radius:50%;width:200px;height:200px;font-size:96px;background:var(--good);color:#fff;box-shadow:0 10px 0 var(--good-d);animation:pulse 1.6s ease-in-out infinite}
.title{font-size:44px;font-weight:700;color:var(--brand-d);text-shadow:0 3px 0 #fff}
.minisaw{font-size:70px;display:flex;gap:30px;justify-content:center}.minisaw span{animation:hop 1s ease-in-out infinite}
.winscene{position:relative;width:100%;height:clamp(140px,22vh,240px);border-radius:24px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 64%,var(--grass) 64%);display:flex;align-items:flex-end;justify-content:center;gap:6px;padding-bottom:10px}
.winscene .flower{--bloom:min(64px,8vh)}.winscene .flower .stem{height:min(40px,5vh)}

.grownlist{font-size:clamp(20px,3vh,28px);line-height:1.4;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;max-width:100%}
.grownlist span{background:var(--good-l);border-radius:12px;padding:0 10px}.grownlist b{color:var(--brand-d)}
.bigstars{font-size:42px}.bigstars span{display:inline-block;animation:pop .4s backwards}
.coins{font-size:30px;font-weight:700;color:var(--gold-d)}
.parade{display:flex;gap:10px;font-size:46px;flex-wrap:wrap;justify-content:center}.parade span{animation:hop 1s ease-in-out infinite}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.grown p{text-align:left;font-size:18px;margin:4px 0}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes grow{0%{transform:scale(0,0) translateY(40px);opacity:0}60%{transform:scale(1.15,1.2) translateY(-8px);opacity:1}100%{transform:scale(1) translateY(0)}}

#app.young{--cw:132px;--ch:120px;--bloom:84px;--pw:240px}#app.young .card .e{font-size:72px}
@media (orientation:landscape) and (min-width:900px){.board{flex-direction:row}.side{width:276px;justify-content:center}.tray{max-width:276px}#app.young{--cw:118px;--ch:106px}#app.young .card .e{font-size:62px}}
@media (max-width:600px){#app{--cw:76px;--ch:70px;padding-left:10px;padding-right:10px}#app.young{--cw:96px;--ch:88px}.card .e{font-size:36px}.card .on{font-size:32px}
  .top{gap:6px}.top .pill[aria-label=Player],[data-act=grown]{display:none!important}.pill{padding:6px 10px}.tray{gap:8px}.prompt .ptxt{font-size:17px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
/*VOICE-START v1.0.0*/
/* ElzeeVoice v1.0.0 - one shared read-aloud voice for Elzee and its games (1.4.2).
   Source of truth: workspace/build142/elzee-voice.js, pasted unchanged between the VOICE markers of
   index.html and games/*.html (the pages are offline single files, so no <script src>).
   - Calm, natural voices first (iPad Safari: Ava Premium/Enhanced, Samantha Enhanced, Allison, Susan, Karen, Samantha).
   - Novelty voices (Fred, Zarvox, Bubbles, ...) are never used.
   - One calm rate (0.9) and normal pitch (1.0) everywhere, younger mode included.
   - Each kid picks their own voice in Elzee (🔈 on the top bar). It is saved on their profile as profile.voice
     in logicquest.v1; games only READ it (active profile). No network, on-device voices only. */
(function (root) {
  "use strict";
  var VERSION = "1.0.0", RATE = 0.9, PITCH = 1.0, MAIN_KEY = "logicquest.v1";
  var NOVELTY = /(^|[\s.\-_(])(Fred|Albert|Bad News|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Pipe Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Bahh|Junior|Ralph|Kathy|Deranged|Hysterical)($|[\s.\-_)])/i;
  var PREFER = [/^Ava\b.*\((Premium|Enhanced)\)/i, /^Samantha\b.*\(Enhanced\)/i, /^Allison\b/i, /^Susan\b/i, /^Karen\b/i, /^Samantha\b/i];
  // Friendly characters for the kids' voice cards (picture-only; no reading needed).
  var CHARS = [{ e: "🦉", n: "Owl" }, { e: "🐻", n: "Bear" }, { e: "🐰", n: "Bunny" }, { e: "🐢", n: "Turtle" }, { e: "🐳", n: "Whale" }];
  function isNovelty(v) { return !!v && (NOVELTY.test(String(v.name || "")) || NOVELTY.test(String(v.voiceURI || ""))); }
  function score(v) {
    var name = String(v.name || ""), i;
    for (i = 0; i < PREFER.length; i++) if (PREFER[i].test(name)) return i;
    return /^en[-_]US/i.test(v.lang || "") ? 20 : 30;
  }
  function voices() {
    var all = [];
    try { all = (root.speechSynthesis && root.speechSynthesis.getVoices && root.speechSynthesis.getVoices()) || []; } catch (e) { all = []; }
    var seen = {}, out = [];
    for (var i = 0; i < all.length; i++) {
      var v = all[i];
      if (!v || !/^en/i.test(v.lang || "") || v.localService === false || isNovelty(v) || seen[v.name]) continue; // on-device English only
      seen[v.name] = 1; out.push(v);
    }
    return out.map(function (v, i) { return { v: v, s: score(v), i: i }; })
      .sort(function (a, b) { return a.s - b.s || a.i - b.i; }).map(function (x) { return x.v; });
  }
  // Active Elzee profile, read only (games never write logicquest.v1).
  function activeProfile() {
    try {
      var d = JSON.parse(root.localStorage.getItem(MAIN_KEY));
      if (!d || !Array.isArray(d.profiles)) return null;
      for (var i = 0; i < d.profiles.length; i++) if (d.profiles[i] && d.profiles[i].id === d.activeId) return d.profiles[i];
    } catch (e) {}
    return null;
  }
  function prefFor(p) { return p && typeof p.voice === "string" && p.voice ? p.voice.slice(0, 100) : null; }
  function pick(name) {
    var list = voices();
    if (name) for (var i = 0; i < list.length; i++) if (list[i].name === name) return list[i];
    return list[0] || null; // calm default
  }
  // Voice cards for the kid picker: the best few voices, each with a friendly character.
  function choices(max) {
    var list = voices().slice(0, Math.min(max || CHARS.length, CHARS.length));
    return list.map(function (v, i) { return { name: v.name, lang: v.lang, emoji: CHARS[i].e, char: CHARS[i].n }; });
  }
  // Set voice, calm rate and normal pitch on an utterance. name undefined = the active profile's pick.
  function apply(u, name) {
    if (name === undefined) name = prefFor(activeProfile());
    var v = pick(name);
    if (v) { try { u.voice = v; } catch (e) { /* not a real voice object */ } u.lang = v.lang || "en-US"; } else u.lang = "en-US";
    u.rate = RATE; u.pitch = PITCH;
    api.last = v ? v.name : null;
    return u;
  }
  var api = { version: VERSION, RATE: RATE, PITCH: PITCH, CHARS: CHARS, isNovelty: isNovelty, voices: voices, pick: pick,
    choices: choices, apply: apply, prefFor: prefFor, activeProfile: activeProfile, last: null };
  root.ElzeeVoice = api;
})(typeof window !== "undefined" ? window : this);

<script>
"use strict";
/* ==========================================================================
   WORD FAMILY GARDEN: a phonics / word-family interlude for Elzee.
   Flower pots hold word endings (-at, -ug, -ake ...). Kids drag starting-letter
   seeds into pots: only real words sprout into a flower (and are read aloud);
   a seed that makes a non-word wobbles and hops back out. Seeds that make no
   word in any pot go in the compost. Twists: pull the one weed that doesn't
   rhyme, and grow a picture in the pot its word ends with.
   Young path (little-path profiles): rhyme by ear with pictures only.
   Fixed levels; every seed has exactly one home (word-family-garden-dev/verify.mjs).
   No randomness, no timer, no fail state.
   ========================================================================== */
const GAME = {
  id: "word-family-garden",
  storageKey: "logicquest.minigame.word-family-garden.v1", // this game's own key
  mainKey: "logicquest.v1",                                 // main app key: READ ONLY, never written here
  resultKey: "logicquest.interlude.result.v1",
};
const ECON = { firstClear: 3, firstThreeStars: 2, replay: 0 }; // contract §6 fixed-level rates; no caps of any kind
const RM = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/*LEVELS-START*/
/* Real words the garden knows. e = picture (emoji; omitted = plain flower), rh = rhyme sound (young path),

  e.preventDefault();
  const r = t.getBoundingClientRect(), i = +t.dataset.item;
  drag = { i, el: t, x0: e.clientX, y0: e.clientY, ox: e.clientX - r.left, oy: e.clientY - r.top, r, moved: false, ghost: null, pid: e.pointerId, lx: e.clientX, vx: 0, hot: null };
  try { t.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  Speech.say(itemSay(i)); // every seed / picture / flower is spoken on touch
});
document.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moved && Math.hypot(dx, dy) > 10) {
    drag.moved = true; clearGlow();
    drag.ghost = ghostFor(drag.i, drag.r, drag.el); drag.el.style.visibility = "hidden"; Sound.pick();
  }
  if (!drag.moved) return;
  drag.vx = drag.vx * 0.7 + (e.clientX - drag.lx) * 0.3; drag.lx = e.clientX;
  const tilt = RM() ? 0 : Math.max(-18, Math.min(18, drag.vx * 1.5));
  drag.ghost.style.transform = `translate(${e.clientX - drag.ox}px,${e.clientY - drag.oy}px) rotate(${tilt}deg) scale(1.08)`;
  const b = targetAt(e.clientX, e.clientY);
  if (b !== drag.hot) { if (drag.hot) drag.hot.classList.remove("hot"); if (b) b.classList.add("hot"); drag.hot = b; }
});
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag; drag = null;
  if (!d.moved) { if (!cancel) tapItem(d.i); return; }
  if (d.hot) d.hot.classList.remove("hot");
  const b = cancel ? null : targetAt(e.clientX, e.clientY);
  if (b) { tryPlace(d.i, b.dataset.spot, d.ghost); return; }
  springHome(d);
}
function springHome(d) {
  const g = d.ghost, el = d.el;
  const cur = g.getBoundingClientRect(), home = el.getBoundingClientRect();
  const done = () => { g.remove(); el.style.visibility = ""; };
  if (RM() || !g.animate) { done(); return; }
  const a = g.animate([{ transform: `translate(${cur.left}px,${cur.top}px) scale(1.08)` }, { transform: `translate(${home.left}px,${home.top}px) scale(1.1,.9)`, offset: 0.8 }, { transform: `translate(${home.left}px,${home.top}px) scale(1)` }], { duration: 380, easing: "ease-out" });
  a.onfinish = done; setTimeout(() => { if (g.isConnected) done(); }, 700);
}
document.addEventListener("pointerup", e => endDrag(e, false));
document.addEventListener("pointercancel", e => endDrag(e, true));
document.addEventListener("contextmenu", e => { if (e.target.closest && e.target.closest(".card,.flower")) e.preventDefault(); });
function tapItem(i) {
  Sound.pick();
  play.sel = play.sel === i ? null : i;
  document.querySelectorAll(".tray .card, .stage .flower.pull").forEach(el => el.classList.toggle("sel", +el.dataset.item === play.sel));
}

/* ---------- clicks ---------- */
document.addEventListener("click", e => {
  const spot = e.target.closest && e.target.closest(".stage .pot, .stage .compost");
  const fl = e.target.closest && e.target.closest(".stage .flower");
  if (spot && view === "play" && play && !play.done && !play.busy && !$ov.firstChild && !(fl && fl.classList.contains("pull"))) {
    if (play.sel !== null && play.sel !== undefined) { tryPlace(play.sel, spot.dataset.spot, null); return; }
    if (fl) { Speech.say(wSay(fl.querySelector(".fw") ? fl.querySelector(".fw").textContent : items()[+fl.dataset.item].w)); return; }
    Speech.say(spot.dataset.spot === "compost" ? (R0().type === "weed" ? "The compost. Drop the weed in here." : "The compost. Things that grow no word go here.") : potSay(+spot.dataset.spot.slice(1)));
    return;
  }
  const b = e.target.closest && e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "begin") begin();
  else if (act === "start") { pushNav(); startLevel(+b.dataset.li, true); }
  else if (act === "locked") { Sound.oops(); if (b.animate) b.animate([{ transform: "rotate(0)" }, { transform: "rotate(-4deg)" }, { transform: "rotate(4deg)" }, { transform: "rotate(0)" }], { duration: 300 }); }
  else if (act === "map") { try { if (history.state && history.state.wfg === "play") history.replaceState({ wfg: "map" }, ""); } catch (err) { /* ignore */ } toMap(); }
  else if (act === "home") exitGame(session.finished ? "done" : "quit");
  else if (act === "back") exitGame(session.solved ? "done" : "quit");
  else if (act === "toggleRead") { const k = kid(); k.noRead = !noRead(); Store.save(); render(); }
  else if (act === "toggleSound") { const k = kid(); k.sound = !soundOn(); Store.save(); if (!k.sound) Speech.stop(); render(); }
  else if (act === "sayPrompt") Speech.say(promptSay(R0()));
  else if (act === "sayIntro") Speech.say(curTrack() === "young" ? "Word Family Garden! Tap a picture to hear it. Then put it in the pot that rhymes." : "Word Family Garden! Drag seeds into pots. Only real words grow into flowers. A seed that makes no word goes in the compost.");
  else if (act === "hint") hint();
  else if (act === "next") { const n = nextIn(play.li); $ov.innerHTML = ""; if (n >= 0) startLevel(n, true); else toMap(); }
  else if (act === "toggleTrack") {
    const k = kid(); k.track = curTrack() === "young" ? "big" : "young"; Store.save(); Sound.pick();
    Speech.say(k.track === "young" ? "Little garden" : "Big garden");
    if (view === "play") { if (play && !play.done) saveCur(); if (INTERLUDE) startLevel(pickLevel(k.track), true); else { $ov.innerHTML = ""; view = "map"; play = null; render(); } }
    else render();
  }
  else if (act === "replay") { $ov.innerHTML = ""; startLevel(play.li, false); }
  else if (act === "keep") { $ov.innerHTML = ""; }
  else if (act === "grown") showGrown();
  else if (act === "closeOv") { $ov.innerHTML = ""; }
});

/* ---------- the ▶️ start tap (unlocks speech + audio on iPad) ---------- */
function startScreen() {
  const nr = noRead() || curTrack() === "young", [b1, b2] = BUDDIES[curTrack()];
  $ov.innerHTML = `<div class="ov startov"><div class="panel" style="background:transparent;box-shadow:none" role="dialog" aria-label="Word Family Garden. Tap to start">
    ${nr ? "" : `<div class="title">Word Family Garden</div>`}
    <div class="minisaw" aria-hidden="true"><span>${b1}</span><span style="animation-delay:.5s">🌻</span><span style="animation-delay:.25s">🪴</span><span style="animation-delay:.7s">${b2}</span></div>
    <button class="startbtn" data-act="begin" aria-label="Tap to start">▶️</button></div></div>`;
}
function begin() {
  if (started) { $ov.innerHTML = ""; return; }
  started = true;
  Speech.unlock(); // inside the tap gesture
  $ov.innerHTML = ""; Sound.pick();
  if (view === "play") fitStage();
  const q = afterStart.splice(0); q.forEach(fn => setTimeout(fn, 300));
  Speech.flush();
}

/* ---------- navigation (back button) ---------- */
function pushNav() { if (!INTERLUDE) try { history.pushState({ wfg: "play" }, ""); } catch (e) { /* ignore */ } }
function toMap() { Speech.stop(); clearGlow(); $ov.innerHTML = ""; if (play && !play.done) saveCur(); view = "map"; play = null; render(); }
window.addEventListener("popstate", () => {
  if (INTERLUDE) { exitGame(session.solved ? "done" : "quit"); return; }
  if (view === "play") toMap();
});
function exitGame(status) {
  Speech.stop();
  if (LAUNCH.elzee) {
    const now = Date.now();
    const rec = { v: 1, gameId: GAME.id, sid: LAUNCH.sid, step: LAUNCH.step, profileId: me.id, status: status === "done" ? "done" : "quit",
      rounds: INTERLUDE ? (session.finished ? 1 : 0) : session.solved, solved: session.solved, startedAt: session.startedAt, endedAt: now,
      durationMs: Math.max(0, now - session.startedAt), tokensEarned: session.tokens };
    try { localStorage.setItem(GAME.resultKey, JSON.stringify(rec)); } catch (e) { /* ignore */ }
    try { sessionStorage.removeItem("wfg.session." + LAUNCH.sid); } catch (e) { /* ignore */ }
  }
  window.__wfgExit = LAUNCH.ret; // for tests
  if (!window.__wfgNoNav) location.replace(LAUNCH.ret);
}

/* ---------- winning ---------- */
function winLevel() {
  if (!play || play.done) return;
  play.done = true; clearGlow();
  const li = play.li, stars = Math.max(1, 3 - play.hints), final = isFinal(li);
  const res = award(li, stars);
  session.solved++; session.tokens += res.got; saveSession();
  if (INTERLUDE) session.finished = true;
  Sound.win();
  showWin(li, stars, res, final);
}
/* Everything the level grew: [{w, onset}] (seed words, pictures, and the flowers left after weeding). */
function grownOf(li) {
  const out = [];
  LEVELS[li].rounds.forEach((R, ri) => itemsOf(li, ri).forEach((it, i) => {
    const t = targetOf(li, ri, i);
    if (R.type === "weed") { if (t === null) out.push({ w: it.w }); return; }
    if (t && t !== "compost") out.push({ w: wordIn(li, ri, i, t), onset: it.kind === "seed" ? it.o : "" });
  }));
  return out;
}
function showWin(li, stars, res, final) {
  const L = LEVELS[li], nr = noRead() || !!L.young, [b1, b2] = BUDDIES[trackOf(li)];
  const grown = grownOf(li), shown = grown.slice(0, 9);
  const parade = final ? `<div class="parade" aria-hidden="true">${trackList(trackOf(li)).map((i, n) => `<span style="animation-delay:${n * 0.12}s">${LEVELS[i].scene}</span>`).join("")}<span>🏆</span></div>` : "";
  const buttons = INTERLUDE
    ? `<button class="btn" data-act="back" aria-label="Back to my adventure"><span class="ico">▶️</span>${nr ? "" : "Back to my adventure"}</button>`
    : `<button class="btn ghost" data-act="map" aria-label="All levels"><span class="ico">🗺️</span></button>
       <button class="btn ghost" data-act="replay" aria-label="Play again"><span class="ico">🔁</span></button>
       ${final ? "" : `<button class="btn" data-act="next" aria-label="Next level"><span class="ico">▶️</span>${nr ? "" : "Next"}</button>`}`;
  $ov.innerHTML = `<div class="ov"><div class="panel win ${final ? "final" : ""}" role="dialog" aria-label="Level complete">
    <h2>${final ? "🏆" : "🎉"} ${nr ? "" : final ? "Garden champion!" : esc(L.name) + "!"}</h2>
    <div class="winscene" aria-hidden="true"><span class="bud" style="left:4%;top:12%">${b1}</span><span class="bud" style="right:4%;top:18%;animation-delay:.45s">${b2}</span>
      ${shown.map((g, n) => flowerHTML(g.w, { n, cls: "dance", noLabel: true })).join("")}</div>
    ${nr ? "" : `<div class="grownlist">${grown.map(g => `<span>${wordHTML(g.w, g.onset)}</span>`).join("")}</div>`}
    ${parade}
    <div class="row" style="align-items:center"><span class="bigstars">${[0, 1, 2].map(i => `<span style="animation-delay:${0.3 + i * 0.2}s" class="${i < stars ? "" : "nostar"}">⭐</span>`).join("")}</span>
      ${res.got ? `<span class="coins">+${res.got} 🪙</span>` : ""}</div>
    <div class="row">${buttons}</div></div></div>`;
  $ov.querySelectorAll(".winscene .flower").forEach((f, n) => { f.style.animationDelay = n * 0.1 + "s"; f.style.animationIterationCount = "infinite"; });
  const pill = document.querySelector('.top .pill[aria-label^="Tokens"]'); if (pill) { pill.setAttribute("aria-label", "Tokens earned today " + kid().earnedToday); const b = pill.querySelector("b"); if (b) b.textContent = kid().earnedToday; }
  if (!RM()) { FX.burst(innerWidth / 2, innerHeight * 0.35, final ? 120 : 80, 1.2, 1); if (final) for (let i = 1; i <= 6; i++) setTimeout(() => { if (!$ov.querySelector(".final")) return; FX.burst(innerWidth * (0.15 + 0.7 * ((i * 37) % 10) / 10), innerHeight * (0.15 + 0.1 * (i % 3)), 60, 1, 0); Sound.pop(); }, 500 + i * 450); }
  const lines = [final ? (L.young ? "Hooray! You grew the whole little garden!" : "Hooray! You are a garden champion!") : (L.young ? "Hooray! You did it!" : "Hooray! Your garden grew!")];
  if (!L.young && grown.length) lines.push("You grew " + listSay(grown.map(g => wSay(g.w))) + ".");
  if (res.got) lines.push(`You earned ${res.got} tokens!`);
  setTimeout(() => { if ($ov.querySelector(".win")) Speech.seq(lines); }, 400);
}
function showGrown() {
  const k = kid();
  $ov.innerHTML = `<div class="ov"><div class="panel grown" role="dialog" aria-label="For grown-ups"><h2>ⓘ For grown-ups</h2>
    <p><b>Word Family Garden</b> practices word families (phonics): a starting sound plus an ending makes a word (c + at = cat). Only real words grow; every seed has exactly one pot, and seeds that make no word go in the compost. Twists: pull the weed that doesn't rhyme, and grow a picture in the pot its word ends with. Wrong tries just hop back out.</p>
    <p><b>Tokens:</b> first time a level is finished +${ECON.firstClear}, first time with no hints +${ECON.firstThreeStars}, replays ${ECON.replay}. No daily limits. No purchases, no ads, no timer.</p>
    <p>Today: ${k.earnedToday} · Waiting to go into the Elzee jar: <b>${k.pending}</b> · All-time: ${k.lifetime}</p>
    <p>🐣 little garden: rhyming by ear with pictures, everything read aloud. 🖼️ hides the words around the game. 🔈 uses the device's own voice.</p>
    <div class="row"><button class="btn" data-act="closeOv" aria-label="Close"><span class="ico">👍</span></button></div></div></div>`;
}

/* ---------- confetti ---------- */
const FX = {
  cv: document.getElementById("fx"), ctx: null, parts: [], on: false,
  size() { const d = window.devicePixelRatio || 1; this.cv.width = innerWidth * d; this.cv.height = innerHeight * d; this.ctx = this.cv.getContext("2d"); if (this.ctx) this.ctx.setTransform(d, 0, 0, d, 0, 0); },
  burst(x, y, n = 40, spread = 1, up = 1) {
    if (RM()) return;
    const cols = ["#7c4dff", "#3ccf4e", "#ffc83d", "#ff6b3d", "#ff8fab", "#4dc3ff", "#ff5d73"];
    for (let i = 0; i < n; i++) { // decorative only; never affects play or rewards
      const a = up ? -Math.PI / 2 + (Math.random() - 0.5) * 1.6 * spread : Math.random() * Math.PI * 2, v = 380 + Math.random() * 520;
      this.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6, vr: (Math.random() - 0.5) * 14, w: 8 + Math.random() * 7, h: 10 + Math.random() * 8, c: cols[i % cols.length], life: 2.2 + Math.random(), round: i % 4 === 0 });
    }
    if (!this.on) { this.on = true; this.size(); if (!this.ctx) { this.on = false; this.parts = []; return; } this.t = performance.now(); requestAnimationFrame(t => this.tick(t)); }
  },
  tick(t) {
    const dt = Math.min(0.033, (t - this.t) / 1000); this.t = t;
    const g = this.ctx; g.clearRect(0, 0, innerWidth, innerHeight);
    this.parts = this.parts.filter(p => (p.life -= dt) > 0 && p.y < innerHeight + 40);
    for (const p of this.parts) {
      p.vy += 900 * dt; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.globalAlpha = Math.min(1, p.life);
      if (p.round) { g.beginPath(); g.arc(0, 0, p.w / 2, 0, 7); g.fill(); } else g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 2);
      g.restore();
    }
    if (this.parts.length) requestAnimationFrame(tt => this.tick(tt)); else { this.on = false; g.clearRect(0, 0, innerWidth, innerHeight); }
  },
};

/* ---------- soft time budget (interlude §4.3) ---------- */
function tickBudget() {
  if (!INTERLUDE || session.finished || !started) return;
  const m = (Date.now() - session.startedAt) / 60000;
  if (m >= LAUNCH.min && !session.bannerShown) { session.bannerShown = true; if (view === "play" && !drag && !(play && play.busy)) renderPlay(); }
  if (m >= LAUNCH.min + 3 && !session.offerShown && !$ov.firstChild) {
    session.offerShown = true; const nr = noRead() || isYoung();
    $ov.innerHTML = `<div class="ov"><div class="panel" role="dialog" aria-label="Back to the trail?"><h2>🗺️ ${nr ? "" : "Time for the trail?"}</h2>
      <div class="row"><button class="btn ghost" data-act="keep" aria-label="Keep playing"><span class="ico">🌻</span></button>
      <button class="btn" data-act="back" aria-label="Back to my adventure"><span class="ico">▶️</span>${nr ? "" : "Back to my adventure"}</button></div></div></div>`;
  }
}
setInterval(tickBudget, 5000);

/* ---------- boot ---------- */
Store.load();
window.addEventListener("pagehide", () => { if (play && !play.done) saveCur(); });
window.addEventListener("storage", ev => { if (ev.key === GAME.mainKey) { me = readMainProfile(); if (!(play && play.busy)) render(); } });
window.addEventListener("resize", () => { if (FX.on) FX.size(); if (view === "play" && play && !drag && !play.busy) renderPlay(); });
(function boot() {
  const k = kid(); Store.save();
  if (INTERLUDE) {
    try { history.replaceState({ wfg: "base" }, ""); history.pushState({ wfg: "game" }, ""); } catch (e) { /* ignore */ }
    startLevel(pickLevel(curTrack()), true);
  } else if (k.cur) { pushNav(); startLevel(k.cur.li, true); }
  else render();
  startScreen(); // every boot (interlude and resume too): one big ▶️ tap, which unlocks speech on iPad
})();

/* Read-only hooks for automated tests (cannot change game state). */
window.WordFamilyGarden = Object.freeze({
  levels: LEVELS, words: WORDS, rimes: RIMES, fits, spotsOf, itemsOf, targetOf, movable, wordIn, pickNaturalVoice, pickVoice,
  track: () => curTrack(),
  state: () => JSON.parse(JSON.stringify({ view, play, session, kid: kid(), launch: LAUNCH, started, unlocked: Speech.unlocked, voice: Speech.voice ? Speech.voice.name : null })),
});
</script>
